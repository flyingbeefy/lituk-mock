<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life in the UK 模擬試</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
/* Layout: one centred column (max 760px) on a cool paper ground. Cards hold each task;
   "paper" cards carry a red margin rule like a ruled exam sheet. The test view has a sticky
   bar (leave, position, timer, finish) above a single question card and a number grid. */
:root{
  --paper:#eef1f5; --surface:#ffffff; --ink:#111c2e; --muted:#566579; --line:#d3dae4;
  --brand:#1b3a73; --brand-ink:#ffffff; --accent:#c4122f; --ok:#177245;
  --tint:color-mix(in srgb,var(--brand) 9%,var(--surface));
  --ok-tint:color-mix(in srgb,var(--ok) 13%,var(--surface));
  --bad-tint:color-mix(in srgb,var(--accent) 10%,var(--surface));
  --font-display:"Bricolage Grotesque","PingFang HK","Noto Sans HK","Microsoft JhengHei",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible","PingFang HK","Noto Sans HK","Microsoft JhengHei",system-ui,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0c131f; --surface:#151f30; --ink:#e9eef7; --muted:#9aa9be; --line:#2a3850;
    --brand:#9dbcff; --brand-ink:#0c131f; --accent:#ff7085; --ok:#5fd39a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0c131f; --surface:#151f30; --ink:#e9eef7; --muted:#9aa9be; --line:#2a3850;
  --brand:#9dbcff; --brand-ink:#0c131f; --accent:#ff7085; --ok:#5fd39a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.55 var(--font-body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--font-display);line-height:1.2;margin:0}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 56px}
.muted{color:var(--muted)}
.small{font-size:.88rem}

.mast{margin:6px 0 12px}
.mast h1{font-size:clamp(1.7rem,6vw,2.4rem);font-weight:800;letter-spacing:-.02em}
.mast h1 span{color:var(--accent)}
.sub{color:var(--muted);margin-top:4px;font-size:.92rem}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.nav a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink);text-decoration:none;font-weight:700;font-size:.92rem}
.nav a[aria-current="page"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.nav b{font-variant-numeric:tabular-nums;font-size:.8rem;padding:0 7px;border-radius:999px;background:var(--accent);color:var(--surface)}
.nav a[aria-current="page"] b{background:var(--brand-ink);color:var(--brand)}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 14px}
@media (min-width:620px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile b{display:block;font:800 1.65rem/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.tile b small{font-size:.55em;color:var(--muted);font-weight:600}
.tile span{color:var(--muted);font-size:.84rem;line-height:1.3;display:block;margin-top:3px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 14px}
.card > h2 + p,.card > h3 + p{margin-top:6px}
.paper{position:relative;padding-left:32px}
.paper::before{content:"";position:absolute;left:15px;top:14px;bottom:14px;width:2px;background:var(--accent);opacity:.6;border-radius:2px}
.banner{border-color:var(--brand);background:var(--tint)}
.cardfoot{display:flex;gap:12px 16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-top:14px}
.lbl{display:block;font-size:.8rem;color:var(--muted);font-weight:700;margin-bottom:5px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:9px 20px;border-radius:999px;
  border:1.5px solid var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.1)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brand);filter:none}
.btn.danger{background:var(--accent);border-color:var(--accent);color:var(--brand-ink)}
.btn.sm{min-height:38px;padding:5px 14px;font-size:.9rem}
.btn.on{border-color:var(--accent);color:var(--accent)}

.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--paper);flex-wrap:wrap}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span{display:block;padding:6px 13px;border-radius:999px;font-size:.88rem;font-weight:700;color:var(--muted)}
.seg input:checked + span{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1.5px var(--brand) inset}
.seg input:focus-visible + span{outline:3px solid var(--brand);outline-offset:2px}

.chlist{display:grid;gap:14px;margin-top:14px}
.chrow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.chrow b{display:block;line-height:1.3}
.chrow small{display:block;color:var(--muted);font-size:.84rem}
.meter{grid-column:1/-1;display:flex;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand);opacity:.45}
.meter i.m{background:var(--ok);opacity:1}
.meter i.x{background:var(--accent);opacity:1}

.spark{display:block;width:100%;height:auto;margin-top:10px}
.spark .passline{stroke:var(--ok);stroke-width:1;stroke-dasharray:4 4}
.spark .tl{fill:none;stroke:var(--brand);stroke-width:2;stroke-linejoin:round}
.spark .p{fill:var(--ok)} .spark .f{fill:var(--accent)}

.foot{color:var(--muted);font-size:.82rem;margin-top:22px;display:grid;gap:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}
.dot.ok{background:var(--ok)}

/* test */
.tbar{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 0 8px;display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:8px}
.where{text-align:center;font-weight:700;line-height:1.25}
.where small{display:block;color:var(--muted);font-weight:400;font-size:.78rem}
.timer{font:800 1.15rem/1 var(--font-display);font-variant-numeric:tabular-nums;padding:8px 10px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line)}
.timer.low{color:var(--accent);border-color:var(--accent)}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 14px}
.bar i{display:block;height:100%;background:var(--brand);transition:width .2s}
.kicker{color:var(--muted);font-size:.8rem;letter-spacing:.04em;margin:0 0 6px}
.qtext{font:700 1.3rem/1.35 var(--font-display)}
.qtext.sm{font-size:1.05rem}
.hint{color:var(--muted);font-size:.9rem;margin-top:8px}
.hint.flash{color:var(--accent);font-weight:700}
.opts{display:grid;gap:10px;border:0;padding:0;margin:16px 0 0;min-width:0}
.opt{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.opt input{flex:none;width:22px;height:22px;margin:2px 0 0;accent-color:var(--brand)}
.opt .otext{flex:1;min-width:0}
.opt.sel{border-color:var(--brand);background:var(--tint)}
.opt.right{border-color:var(--ok);background:var(--ok-tint)}
.opt.wrong{border-color:var(--accent);background:var(--bad-tint)}
.opt.locked{cursor:default}
.mark{flex:none;font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:999px;align-self:center;white-space:nowrap}
.mark.ok{background:var(--ok);color:var(--surface)}
.mark.bad{background:var(--accent);color:var(--surface)}
.fbk{margin-top:14px;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.fbk.ok{border-color:var(--ok)} .fbk.bad{border-color:var(--accent)}
.verdict{font:800 1.1rem/1.2 var(--font-display);margin-bottom:6px}
.fbk.ok .verdict{color:var(--ok)} .fbk.bad .verdict{color:var(--accent)}
.exp .zh{border-top:1px dashed var(--line);padding-top:7px;margin-top:7px}
.acts{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.acts .sp{flex:1}
.gridbox{margin-top:22px}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:8px}
@media (min-width:620px){.grid{grid-template-columns:repeat(12,1fr)}}
.cell{aspect-ratio:1;min-height:36px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);font-weight:700;cursor:pointer;position:relative;font-variant-numeric:tabular-nums;padding:0}
.cell.ans{background:var(--tint);border-color:var(--brand)}
.cell.r{background:var(--ok-tint);border-color:var(--ok)}
.cell.w{background:var(--bad-tint);border-color:var(--accent)}
.cell.cur{box-shadow:0 0 0 3px var(--brand)}
.cell.flag::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.8rem;margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:1.5px solid var(--line);vertical-align:-1px;margin-right:5px}
.legend i.a{background:var(--tint);border-color:var(--brand)}
.legend i.f{background:var(--accent);border-color:var(--accent);border-radius:50%}

/* results */
.score{display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap}
.big{font:800 clamp(3rem,15vw,4.6rem)/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.big small{font-size:.42em;color:var(--muted);font-weight:600;letter-spacing:0}
.stamp{display:inline-block;padding:7px 16px;border:3px double currentColor;border-radius:8px;font:800 1.25rem/1.15 var(--font-display);letter-spacing:.08em;transform:rotate(-6deg);text-align:center}
.stamp.pass{color:var(--ok)} .stamp.fail{color:var(--accent)}
.meta{color:var(--muted);font-size:.9rem;margin-top:12px;display:flex;gap:4px 16px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{min-height:38px;padding:5px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.revlist{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:12px}
.rev{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}
.rev.ok{border-left-color:var(--ok)} .rev.bad{border-left-color:var(--accent)}
.revhead{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.tag{font-weight:700}
.rev.ok .tag{color:var(--ok)} .rev.bad .tag{color:var(--accent)}
.ropts{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px}
.ropts li{padding:8px 12px;border-radius:9px;border:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:center}
.ropts li.right{border-color:var(--ok);background:var(--ok-tint)}
.ropts li.wrong{border-color:var(--accent);background:var(--bad-tint)}
.hrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow b{font-variant-numeric:tabular-nums}
.pill{font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.pill.pass{color:var(--ok)} .pill.fail{color:var(--accent)}
.setrow{padding:14px 0;border-bottom:1px solid var(--line)}
.setrow:first-of-type{padding-top:4px}
.setrow:last-child{border-bottom:0;padding-bottom:0}
.setrow p{margin-top:6px}

.iobox{width:100%;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);resize:vertical}
.modal-bg{position:fixed;inset:0;background:rgba(8,14,24,.58);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border-radius:var(--r);padding:22px;max-width:430px;width:100%;border:1px solid var(--line)}
.modal h2{margin-bottom:8px}
.modal p{margin-bottom:18px;color:var(--muted)}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="modal-root"></div>
<script>
(() => {
'use strict';
const BANK = [["dbe71ed","s",1,"Which of the following is a fundamental principle of British life?",["The rule of law","Compulsory military service","Membership of a political party","Speaking more than one language"],"The principles are democracy, the rule of law, individual liberty, tolerance of different faiths and beliefs, and participation in community life.","英國生活的基本原則是民主、法治、個人自由、包容不同信仰，以及參與社區生活。"],["8e6db1f","m",1,"Which TWO of the following are fundamental principles of British life?",["Democracy","Individual liberty","Owning property","Driving on the left"],"Democracy and individual liberty are two of the five fundamental principles.","民主和個人自由是五項基本原則其中兩項。"],["edd7faa","s",1,"Which of these is a responsibility of everyone living in the UK?",["To look after yourself and your family","To attend a place of worship","To join a trade union","To support the government of the day"],"Residents should respect the law, respect others' rights, treat others fairly, look after themselves and their family, and look after their area and the environment.","居民應尊重法律和他人權利、公平待人、照顧自己和家人，並愛護居住環境。"],["185bf50","s",1,"Which of these freedoms does the UK offer to its residents?",["Freedom of speech","Freedom from paying tax","Free housing","Free travel on public transport"],"The UK offers freedom of belief and religion, freedom of speech, freedom from unfair discrimination, a fair trial, and a say in electing a government.","英國給予信仰和宗教自由、言論自由、免受不公平歧視、公平審訊，以及參與選舉政府的權利。"],["c43d7bd","t",1,"There is no place in British society for extremism or intolerance.",1,"British society is founded on fundamental values and principles that all residents should respect.","英國社會建基於所有居民都應尊重的基本價值，不容極端主義或不包容。"],["8845f7f","s",1,"How many questions are there in the Life in the UK test?",["24","20","30","45"],"The test has 24 questions about important aspects of life in the UK.","考試共有 24 條題目。"],["25df055","s",1,"How long do you have to complete the Life in the UK test?",["45 minutes","30 minutes","60 minutes","90 minutes"],"You have 45 minutes to answer 24 questions.","考試限時 45 分鐘，共 24 題。"],["548d314","s",1,"What is the pass mark for the Life in the UK test?",["75%","50%","60%","90%"],"You need 18 correct answers out of 24, which is 75%.","24 題要答對 18 題，即 75%。"],["3625ca3","t",1,"The Life in the UK test is usually taken in English, but can be arranged in Welsh or Scottish Gaelic.",1,"Special arrangements can be made to take the test in Welsh or Scottish Gaelic.","考試一般以英語進行，亦可以安排以威爾斯語或蘇格蘭蓋爾語應考。"],["d2ddd4f","s",1,"Which of the following is one of the freedoms offered by the UK?",["A right to a fair trial","A right to a job","A right to a pension at 50","A right to free legal advice in every case"],"A right to a fair trial is one of the freedoms the UK offers in return for residents' responsibilities.","接受公平審訊的權利是英國給予居民的自由之一。"],["a9d29e1","m",1,"Which TWO are responsibilities of people living in the UK?",["Respect and obey the law","Treat others with fairness","Give money to charity","Join a political party"],"Obeying the law and treating others fairly are listed responsibilities. The other two are personal choices.","遵守法律和公平待人是居民的責任，另外兩項屬個人選擇。"],["b0c16bc","t",1,"Tolerance of those with different faiths and beliefs is a fundamental principle of British life.",1,"It is one of the five fundamental principles.","這是五項基本原則之一。"],["7fedab4","s",1,"What do new citizens do at a citizenship ceremony?",["Swear or affirm loyalty to the monarch","Take the Life in the UK test again","Recite the Bill of Rights","Pay a year's income tax in advance"],"New citizens take an oath or affirmation of allegiance and a pledge of loyalty to the UK.","新公民要在入籍儀式上宣誓效忠君主。"],["54549cf","s",1,"Which of these is NOT one of the fundamental principles of British life?",["Supporting a particular political party","Democracy","The rule of law","Participation in community life"],"People are free to support any party or none. The other three are fundamental principles.","支持哪個政黨是個人自由，其餘三項都是基本原則。"],["ab8b48b","t",1,"Residents of the UK should respect the rights of others, including their right to their own opinions.",1,"This is one of the responsibilities of everyone living in the UK.","尊重他人權利，包括他人持有自己意見的權利，是居民的責任。"],["4a3df0d","t",1,"People in the UK may ignore laws that they personally disagree with.",0,"Everyone must respect and obey the law. The rule of law is a fundamental principle.","人人都必須遵守法律，法治是基本原則。"],["88ac02a","s",1,"Which of the following is a responsibility you take on by becoming a permanent resident?",["Looking after the area in which you live","Serving in the armed forces for a year","Standing for election to the council","Learning to speak Welsh or Gaelic"],"Looking after your area and the environment is one of the listed responsibilities.","愛護居住的地方和環境是居民的責任之一。"],["6344cc6","s",1,"Which principle means that all adults have a say in how the country is run?",["Democracy","Individual liberty","Tolerance","The rule of law"],"Democracy is a system of government where the whole adult population gets a say.","民主是指所有成年人都可以參與決定國家如何管治。"],["0438c09","s",2,"Which countries make up Great Britain?",["England, Scotland and Wales","England, Scotland, Wales and Northern Ireland","England and Wales only","England, Wales and Northern Ireland"],"Great Britain refers only to England, Scotland and Wales.","大不列顛只包括英格蘭、蘇格蘭和威爾斯。"],["66d9d88","s",2,"What is the full official name of the UK?",["The United Kingdom of Great Britain and Northern Ireland","The United Kingdom of England, Scotland and Wales","The British Isles","The Commonwealth of Great Britain"],"The UK is made up of Great Britain plus Northern Ireland.","英國全名是「大不列顛及北愛爾蘭聯合王國」。"],["8578032","t",2,"The Channel Islands and the Isle of Man are part of the UK.",0,"They are Crown dependencies. They are closely linked with the UK but are not part of it.","海峽群島和馬恩島是皇家屬地，與英國關係密切，但不屬於英國。"],["de76512","s",2,"What is the status of the Isle of Man and the Channel Islands?",["Crown dependencies","British overseas territories","Counties of England","Independent republics"],"They are Crown dependencies with their own governments.","兩者都是皇家屬地，有自己的政府。"],["34ee36e","s",2,"Which of these is a British overseas territory?",["The Falkland Islands","The Isle of Man","The Channel Islands","Northern Ireland"],"St Helena and the Falkland Islands are examples of British overseas territories.","福克蘭群島和聖海倫娜都是英國海外領土。"],["e1a4cfd","s",2,"What is the capital city of Scotland?",["Edinburgh","Glasgow","Aberdeen","Dundee"],"Edinburgh is the capital of Scotland.","蘇格蘭的首府是愛丁堡。"],["0a3fa17","s",2,"What is the capital city of Wales?",["Cardiff","Swansea","Newport","Bangor"],"Cardiff is the capital of Wales.","威爾斯的首府是卡迪夫。"],["86405b5","s",2,"What is the capital city of Northern Ireland?",["Belfast","Dublin","Londonderry","Armagh"],"Belfast is the capital of Northern Ireland. Dublin is the capital of the Republic of Ireland.","北愛爾蘭的首府是貝爾法斯特。都柏林是愛爾蘭共和國的首都。"],["bbf9dce","s",2,"What is the capital city of the UK?",["London","Edinburgh","Birmingham","Cardiff"],"London is the capital of both England and the UK.","倫敦是英格蘭和英國的首都。"],["999e442","t",2,"Northern Ireland is part of Great Britain.",0,"Great Britain is England, Scotland and Wales. Northern Ireland is part of the UK but not of Great Britain.","大不列顛只有英格蘭、蘇格蘭和威爾斯。北愛爾蘭屬於英國，但不屬於大不列顛。"],["78cef5c","s",2,"Which of these is one of the four countries of the UK?",["Wales","The Isle of Man","The Republic of Ireland","Jersey"],"The UK consists of England, Scotland, Wales and Northern Ireland.","英國由英格蘭、蘇格蘭、威爾斯和北愛爾蘭組成。"],["81f8cc4","m",2,"Which TWO are Crown dependencies?",["The Isle of Man","The Channel Islands","St Helena","The Falkland Islands"],"The Isle of Man and the Channel Islands are Crown dependencies. The other two are overseas territories.","馬恩島和海峽群島是皇家屬地，另外兩個是海外領土。"],["975f38a","s",2,"How is St Helena linked to the UK?",["It is a British overseas territory","It is a Crown dependency","It is part of Scotland","It is an independent member of the UK"],"St Helena is a British overseas territory, linked to the UK but not part of it.","聖海倫娜是英國海外領土，與英國有聯繫但不屬於英國。"],["a03df16","t",2,"The UK is governed by the parliament sitting in Westminster.",1,"Scotland, Wales and Northern Ireland also have parliaments or assemblies with devolved powers.","英國由位於 Westminster 的國會管治。蘇格蘭、威爾斯和北愛爾蘭另有獲下放權力的議會。"],["d52b835","s",2,"Which parts of the UK have parliaments or assemblies of their own with devolved powers?",["Scotland, Wales and Northern Ireland","England, Scotland and the Isle of Man","Scotland and the Channel Islands only","England and Wales only"],"Scotland, Wales and Northern Ireland have devolved powers in defined areas.","蘇格蘭、威爾斯和北愛爾蘭各有獲下放權力的議會。"],["e477ea0","s",2,"Which country is part of the UK but not part of Great Britain?",["Northern Ireland","Wales","Scotland","England"],"Northern Ireland is in the UK but is not on the island of Great Britain.","北愛爾蘭屬於英國，但不屬於大不列顛。"],["3377afa","t",2,"Crown dependencies have their own governments.",1,"The Channel Islands and the Isle of Man have their own governments.","海峽群島和馬恩島都有自己的政府。"],["be13702","s",2,"Which of these statements about Great Britain is correct?",["Great Britain refers only to England, Scotland and Wales","Great Britain refers to England, Scotland, Wales and Northern Ireland"],"Northern Ireland is not part of Great Britain.","大不列顛不包括北愛爾蘭。"],["676345e","s",2,"How many countries make up the United Kingdom?",["Four","Two","Three","Five"],"England, Scotland, Wales and Northern Ireland.","英格蘭、蘇格蘭、威爾斯和北愛爾蘭，共四個。"],["6bf5818","t",2,"St Helena and the Falkland Islands are part of the UK.",0,"They are British overseas territories, linked to the UK but not part of it.","兩者是英國海外領土，不屬於英國。"],["3aa94c8","s",2,"Which of these islands are closely linked with the UK but are not part of it?",["The Channel Islands","The Isle of Wight","Anglesey","The Orkney Islands"],"The Channel Islands are a Crown dependency. The other three are part of the UK.","海峽群島是皇家屬地，其餘三個都屬於英國。"],["caa4bb3","s",2,"Where does the UK Parliament sit?",["Westminster","Holyrood","Stormont","Cardiff Bay"],"The UK Parliament sits at Westminster in London.","英國國會位於倫敦 Westminster。"],["9b30cb8","s",3,"Who were the first people to live in Britain?",["Hunter-gatherers","Farmers from south-east Europe","Roman soldiers","Anglo-Saxon settlers"],"The first people in Britain, in the Stone Age, were hunter-gatherers.","石器時代最早在英國生活的人以狩獵和採集為生。"],["100d6f1","s",3,"About how long ago did Britain become permanently separated from the continent by the Channel?",["10,000 years ago","1,000 years ago","4,000 years ago","100,000 years ago"],"Britain was once joined to the continent by a land bridge. The Channel separated them about 10,000 years ago.","英國原本有陸橋連接歐洲大陸，約一萬年前被英倫海峽永久分隔。"],["fef7504","s",3,"When did the first farmers arrive in Britain?",["6,000 years ago","10,000 years ago","2,000 years ago","500 years ago"],"The first farmers arrived 6,000 years ago. Their ancestors probably came from south-east Europe.","最早的農民約六千年前到達英國，祖先可能來自東南歐。"],["d9934e0","s",3,"In which county is Stonehenge?",["Wiltshire","Dorset","Suffolk","Kent"],"Stonehenge still stands in Wiltshire. It was probably a gathering place for seasonal ceremonies.","巨石陣位於 Wiltshire，可能是舉行季節性儀式的聚集地。"],["43019c1","s",3,"What is Skara Brae?",["A well-preserved prehistoric village on Orkney","A Roman fort built on Hadrian's Wall","An Iron Age hill fort in the county of Dorset","An Anglo-Saxon burial ship found in Suffolk"],"Skara Brae on Orkney, off the north coast of Scotland, is the best preserved prehistoric village in northern Europe.","Skara Brae 位於蘇格蘭北面的 Orkney，是北歐保存得最好的史前村落。"],["37dc30b","s",3,"What kind of houses did people live in during the Bronze Age?",["Roundhouses","Castles","Stone villas","Longships"],"Bronze Age people lived in roundhouses and buried their dead in round barrows.","青銅時代的人住在圓屋，死後葬於圓形墳塚。"],["49a8bd3","s",3,"What are round barrows?",["Bronze Age tombs","Iron Age coins","Roman roads","Viking ships"],"People in the Bronze Age buried their dead in tombs called round barrows.","Round barrows 是青銅時代的圓形墳墓。"],["e326230","s",3,"Maiden Castle in Dorset is an impressive example of what?",["An Iron Age hill fort","A Norman cathedral","A Roman villa","A Tudor palace"],"Iron Age people sometimes defended their settlements as hill forts. Maiden Castle can still be seen today.","Maiden Castle 是鐵器時代的山丘堡壘，至今仍可參觀。"],["45ae218","t",3,"The language spoken by people in the Iron Age was part of the Celtic language family.",1,"Related languages are still spoken today in parts of Wales, Scotland and Ireland.","鐵器時代的語言屬於凱爾特語系，相關語言今天仍在威爾斯、蘇格蘭和愛爾蘭部分地區使用。"],["d2dbeeb","s",3,"Who led the Roman invasion of Britain in 55 BC, which was unsuccessful?",["Julius Caesar","Emperor Claudius","Emperor Hadrian","St Augustine"],"Julius Caesar's invasion in 55 BC failed. Britain stayed separate from the Roman Empire for nearly 100 years.","公元前 55 年 Julius Caesar 入侵失敗，其後近一百年英國仍未被羅馬帝國統治。"],["9cd787e","s",3,"Which Roman emperor led the successful invasion of Britain in AD 43?",["Claudius","Hadrian","Julius Caesar","Augustus"],"Emperor Claudius led the Roman army in a new invasion in AD 43.","公元 43 年，羅馬皇帝 Claudius 率軍成功入侵英國。"],["35f0fd8","s",3,"Boudicca fought against the Romans. She was queen of which tribe?",["The Iceni","The Picts","The Jutes","The Angles"],"Boudicca was queen of the Iceni in what is now eastern England.","Boudicca 是今日英格蘭東部 Iceni 部落的女王。"],["f900af2","s",3,"Where in London is there a statue of Boudicca?",["On Westminster Bridge","In Trafalgar Square","Outside Buckingham Palace","At the Tower of London"],"Her statue stands on Westminster Bridge, near the Houses of Parliament.","她的雕像位於國會大樓附近的 Westminster Bridge。"],["67ad560","s",3,"Why did Emperor Hadrian build a wall in the north of England?",["To keep out the Picts","To keep out the Vikings","To mark the border with Wales","To protect London from fire"],"The Picts were ancestors of the Scottish people. Parts of Hadrian's Wall can still be seen.","Hadrian 築牆是為了阻擋 Picts 人（蘇格蘭人的祖先），部分城牆至今仍在。"],["71974c2","m",3,"Which TWO are forts on Hadrian's Wall?",["Housesteads","Vindolanda","Maiden Castle","Sutton Hoo"],"Housesteads and Vindolanda are forts on the wall, which is a UNESCO World Heritage Site.","Housesteads 和 Vindolanda 是 Hadrian's Wall 上的堡壘，該城牆是聯合國教科文組織世界遺產。"],["c3fd7a6","s",3,"For how long did the Romans remain in Britain?",["400 years","50 years","150 years","1,000 years"],"The Romans stayed for 400 years and left in AD 410.","羅馬人在英國逗留了四百年，於公元 410 年撤走。"],["7d394b2","s",3,"In which year did the Roman army leave Britain?",["AD 410","AD 43","AD 789","AD 1066"],"The army left in AD 410 to defend other parts of the Roman Empire and never returned.","羅馬軍隊於公元 410 年撤離英國去保衛帝國其他地方，其後沒有再回來。"],["a098288","m",3,"Which TWO things did the Romans do in Britain?",["Built roads and public buildings","Created a structure of law","Built Stonehenge","Wrote the Domesday Book"],"The Romans built roads and public buildings, created a structure of law and introduced new plants and animals.","羅馬人修築道路和公共建築、建立法律架構，並引入新的動植物。"],["3c4aa93","t",3,"The Romans conquered all of Britain, including the whole of what is now Scotland.",0,"Areas of what is now Scotland were never conquered by the Romans.","今日蘇格蘭的部分地區從未被羅馬人征服。"],["3286758","s",3,"When did the first Christian communities begin to appear in Britain?",["In the 3rd and 4th centuries AD","In the 1st and 2nd centuries BC","In the 9th and 10th centuries AD","In the 12th and 13th centuries AD"],"Christian communities first appeared during the Roman period, in the 3rd and 4th centuries AD.","基督教社群最早在羅馬統治時期（公元三、四世紀）出現。"],["2ba44c4","s",3,"Where did the Jutes, Angles and Saxons come from?",["Northern Europe","North Africa","Ireland","Southern Italy"],"After the Romans left, Britain was invaded by tribes from northern Europe.","羅馬人離開後，來自北歐的 Jutes、Angles 和 Saxons 部族入侵英國。"],["5b9ad04","s",3,"What was found at Sutton Hoo in Suffolk?",["The burial place of an Anglo-Saxon king","The remains of a Roman bath house","The ruins of a Viking trading town","The site of a Stone Age village"],"A king was buried there with treasure and armour, all placed in a ship.","Sutton Hoo 是盎格魯撒克遜國王的墓地，國王連同寶物和盔甲葬在一艘船內。"],["bc86c92","s",3,"Who founded a monastery on the island of Iona?",["St Columba","St Patrick","St Augustine","St David"],"St Columba founded a monastery on Iona, off the coast of what is now Scotland.","St Columba 在今日蘇格蘭對開的 Iona 島創立修道院。"],["0f32448","s",3,"Who was the first Archbishop of Canterbury?",["St Augustine","St Columba","St Patrick","St George"],"St Augustine led missionaries from Rome and became the first Archbishop of Canterbury.","St Augustine 帶領傳教士由羅馬來到英國，成為首任 Archbishop of Canterbury。"],["f157c8d","s",3,"Which of these statements about St Patrick is correct?",["St Patrick became the patron saint of Ireland","St Patrick became the patron saint of Scotland"],"St Patrick is the patron saint of Ireland. St Andrew is the patron saint of Scotland.","St Patrick 是愛爾蘭的主保聖人，蘇格蘭的主保聖人是 St Andrew。"],["b385732","s",3,"Where did the Vikings come from?",["Denmark, Norway and Sweden","France and Spain","Germany and Italy","Ireland and Wales"],"The Vikings first visited Britain in AD 789 to raid coastal towns.","維京人來自丹麥、挪威和瑞典，公元 789 年首次到英國搶掠沿海城鎮。"],["2e75aa8","s",3,"When did the Vikings first visit Britain to raid coastal towns?",["AD 789","AD 410","AD 1066","AD 43"],"The Vikings first came in AD 789 and later began to stay and form their own communities.","維京人於公元 789 年首次來襲，其後開始定居。"],["984ad47","s",3,"Which king united the Anglo-Saxon kingdoms in England and defeated the Vikings?",["Alfred the Great","Cnut","Harold","Kenneth MacAlpin"],"The Anglo-Saxon kingdoms united under King Alfred the Great, who defeated the Vikings.","盎格魯撒克遜各王國在 Alfred the Great 帶領下團結起來，擊敗維京人。"],["070ca60","s",3,"What was the Danelaw?",["An area of England where Viking invaders settled","A law that banned trade with the Vikings","A tax paid by the Anglo-Saxons to Rome","The council that advised King Alfred"],"Many Vikings stayed in the Danelaw. Place names such as Grimsby and Scunthorpe come from Viking languages.","Danelaw 是英格蘭東部和北部維京人定居的地區，Grimsby 和 Scunthorpe 等地名都源自維京語言。"],["7b9e37f","s",3,"Who was the first of the Danish kings to rule England?",["Cnut, also called Canute","Alfred the Great","William of Normandy","Harold"],"Anglo-Saxon kings ruled England except for a short period of Danish kings. The first was Cnut.","英格蘭曾短暫由丹麥國王統治，第一位是 Cnut（又稱 Canute）。"],["e72a681","s",3,"In the north, the threat of Viking attack encouraged people to unite under which king?",["Kenneth MacAlpin","Robert the Bruce","Alfred the Great","James VI"],"The term Scotland began to be used to describe that country.","北方的人在 Kenneth MacAlpin 之下團結起來，「Scotland」這個名稱亦開始使用。"],["e1e7b44","s",3,"Who won the Battle of Hastings in 1066?",["William, Duke of Normandy","Harold, the Saxon king","Cnut of Denmark","Kenneth MacAlpin"],"William defeated Harold, who was killed in the battle. William became king and is known as William the Conqueror.","諾曼第公爵 William 擊敗並殺死 Harold，成為英格蘭國王，人稱 William the Conqueror。"],["15fb10f","s",3,"In which year did the Norman Conquest take place?",["1066","1215","1485","789"],"William of Normandy won the Battle of Hastings in 1066.","諾曼征服發生於 1066 年。"],["e3d48b5","s",3,"What does the Bayeux Tapestry commemorate?",["The Battle of Hastings","The Battle of Agincourt","The defeat of the Spanish Armada","The signing of the Magna Carta"],"The tapestry is a great piece of embroidery that can still be seen in France today.","Bayeux Tapestry 是記錄 Hastings 戰役的刺繡，現存於法國。"],["339c24b","s",3,"What is the Domesday Book?",["A record of towns, villages, people and land","The first Bible to be printed in English","A list of soldiers at the Battle of Hastings","A collection of Anglo-Saxon poems and songs"],"It lists who owned the land and what animals they owned. It gives a picture of society just after the Norman Conquest.","Domesday Book 是 William the Conqueror 下令編製的名冊，記錄各城鎮村莊的人口、土地擁有人和牲畜。"],["19df067","t",3,"The Norman Conquest was the last successful foreign invasion of England.",1,"It led to many changes in government and social structures in England.","諾曼征服是英格蘭最後一次被外敵成功入侵，其後政府和社會結構出現很多改變。"],["143648f","s",3,"In 1284 the Statute of Rhuddlan annexed Wales to the Crown of England. Which king introduced it?",["Edward I","Henry V","King John","Richard III"],"Edward I of England introduced the Statute of Rhuddlan in 1284.","Edward I 於 1284 年頒布 Statute of Rhuddlan，把威爾斯併入英格蘭王室。"],["d721754","m",3,"Which TWO castles were built in Wales to maintain English power?",["Conwy","Caernarvon","Windsor","Edinburgh"],"Huge castles, including Conwy and Caernarvon, were built to maintain English power in Wales.","Conwy 和 Caernarvon 等大型城堡是為了維持英格蘭在威爾斯的勢力而興建。"],["6c61ae7","s",3,"Who defeated the English at the Battle of Bannockburn in 1314?",["Robert the Bruce","Kenneth MacAlpin","William Wallace","Bonnie Prince Charlie"],"Robert the Bruce led the Scots to victory, and Scotland remained unconquered by the English.","Robert the Bruce 率領蘇格蘭人在 Bannockburn 擊敗英軍，蘇格蘭沒有被英格蘭征服。"],["ec6a705","s",3,"In the Middle Ages, what was the Pale?",["An area around Dublin ruled by the English","A wall between England and Scotland","A tax paid by peasants","A Welsh castle"],"By 1200 the English ruled an area of Ireland known as the Pale, around Dublin.","到 1200 年，英格蘭人統治都柏林一帶，稱為 the Pale。"],["35ef0d6","s",3,"Against which country did England fight the Hundred Years War?",["France","Spain","Scotland","The Netherlands"],"English kings fought a long war with France, called the Hundred Years War.","百年戰爭是英格蘭與法國之間的長期戰爭。"],["9966a31","t",3,"The Hundred Years War lasted exactly 100 years.",0,"It actually lasted 116 years.","百年戰爭實際上打了 116 年。"],["5c63ea2","s",3,"Which king led the English to victory at the Battle of Agincourt in 1415?",["Henry V","Henry VII","Edward I","Richard III"],"Henry V's vastly outnumbered English army defeated the French at Agincourt.","Henry V 在 Agincourt 戰役以寡敵眾擊敗法軍。"],["6485a85","s",3,"In which year did the Black Death arrive in Britain?",["1348","1066","1215","1485"],"The Black Death was a plague that came to Britain in 1348.","黑死病於 1348 年傳入英國。"],["a27ecf0","s",3,"What proportion of the population of England died in the Black Death?",["One third","One tenth","One half","Three quarters"],"One third of the population of England died, and a similar proportion in Scotland and Wales.","英格蘭有三分之一人口死於黑死病，蘇格蘭和威爾斯的比例相若。"],["bb1278f","s",3,"What happened as a result of the Black Death?",["Labour shortages led peasants to demand higher wages","The king lost his lands in France and Ireland","Parliament was closed for more than a century","England broke away from the Church of Rome"],"With a smaller population there were labour shortages, and new social classes appeared.","人口減少導致勞動力短缺，農民開始要求更高工資，亦出現了新的社會階層。"],["73c4b60","s",3,"After the Black Death, which new social class of owners of large areas of land appeared?",["The gentry","The serfs","The clergy","The Chartists"],"The gentry owned large areas of land. People who moved to the towns developed into a strong middle class.","Gentry 是擁有大片土地的新階層，而遷往城鎮的人則發展成中產階級。"],["8367d45","s",3,"What was feudalism?",["A system in which land was given in return for help in war","A style of church music sung in medieval monasteries","A tax on wool exported from England to Europe","A way of choosing knights to sit in Parliament"],"The king gave land to his lords in return for help in war. The Normans used this system.","封建制度是一種土地擁有制度：國王把土地賜予領主，換取他們在戰時出力。"],["d48e29c","s",3,"In which year was the Magna Carta agreed?",["1215","1066","1314","1485"],"King John was forced by his noblemen to agree to it in 1215.","1215 年，King John 被貴族迫使同意《大憲章》。"],["ed5cc8d","s",3,"Which king was forced by his noblemen to agree to the Magna Carta?",["King John","Henry VIII","Edward I","Charles I"],"King John agreed to the Magna Carta, which means the Great Charter, in 1215.","King John 於 1215 年被迫同意《大憲章》（Magna Carta）。"],["6462e8b","s",3,"What idea did the Magna Carta establish?",["That even the king was subject to the law","That only men could vote","That the Pope was head of the Church","That Wales was part of England"],"It protected the rights of the nobility and restricted the king's power to collect taxes or make laws.","《大憲章》確立了連國王也要受法律約束的原則，並限制國王徵稅和立法的權力。"],["aac0cd5","s",3,"In the medieval English Parliament, who sat in the House of Commons?",["Knights and wealthy people from towns and cities","The nobility, great landowners and bishops","Serfs and peasants chosen by their lords","Judges and sheriffs appointed by the king"],"The nobility, great landowners and bishops sat in the House of Lords.","下議院由騎士和城鎮的富人組成，貴族、大地主和主教則在上議院。"],["a546497","s",3,"What were the three Houses of the medieval Scottish Parliament called?",["Estates","Chambers","Clans","Courts"],"The three Estates were the lords, the commons and the clergy.","中世紀蘇格蘭議會分為三個 Estates：貴族、平民和神職人員。"],["7d903e4","s",3,"How did the law develop in England during the Middle Ages?",["Judges developed common law through precedence and tradition","All laws were written down by the king in a single great code","Laws were decided by the Pope and announced in every church","Each village wrote its own laws, which the sheriff enforced"],"In Scotland the legal system developed slightly differently and laws were codified, meaning written down.","英格蘭的法官按先例和傳統發展出普通法；蘇格蘭則把法律成文化。"],["a70d1c9","s",3,"Who wrote The Canterbury Tales?",["Geoffrey Chaucer","William Caxton","John Barbour","William Shakespeare"],"Chaucer wrote a series of poems about a group of pilgrims going to Canterbury.","Geoffrey Chaucer 寫了 The Canterbury Tales，內容講述一群前往 Canterbury 的朝聖者。"],["bf7dfc1","s",3,"Who was the first person in England to print books using a printing press?",["William Caxton","Geoffrey Chaucer","Isaac Newton","Samuel Pepys"],"The Canterbury Tales was one of the first books Caxton printed.","William Caxton 是英格蘭第一個用印刷機印書的人，The Canterbury Tales 是他最早印刷的書之一。"],["ca1a45d","s",3,"Who wrote The Bruce, a poem about the Battle of Bannockburn?",["John Barbour","Robert Burns","Geoffrey Chaucer","Sir Walter Scott"],"John Barbour was a poet who wrote in the Scots language.","John Barbour 以 Scots 語寫作，The Bruce 是關於 Bannockburn 戰役的詩。"],["f17f9ab","m",3,"Which TWO English words come from Norman French?",["Park","Beauty","Apple","Summer"],"Park and beauty come from Norman French. Apple, cow and summer come from Anglo-Saxon.","Park 和 beauty 源自諾曼法語；apple、cow 和 summer 源自盎格魯撒克遜語。"],["145f092","s",3,"By 1400, which language was used for official documents and in the royal court and Parliament in England?",["English","Norman French","Latin","Gaelic"],"English had become the preferred language of the royal court and Parliament.","到 1400 年，英格蘭的官方文件已用英文書寫，英文亦成為宮廷和國會的常用語言。"],["64b87b1","s",3,"What were the Crusades?",["Wars in which European Christians fought for the Holy Land","Battles between the kings of England and Scotland","Viking raids on monasteries and coastal towns","Rebellions by Welsh princes against English rule"],"Many English knights took part in the Crusades.","十字軍東征是歐洲基督徒為爭奪聖地控制權而發動的戰爭，很多英格蘭騎士都有參與。"],["bfbf890","s",3,"Which cathedral is famous for its medieval stained glass?",["York Minster","St Paul's Cathedral","Westminster Abbey","Coventry Cathedral"],"Several cathedrals had windows of stained glass. The glass in York Minster is one of the most famous examples.","York Minster 的彩繪玻璃是中世紀最著名的例子之一。"],["84e5239","s",3,"In the Middle Ages, skilled people came to England from abroad. From where did canal builders come?",["Holland","Italy","Germany","France"],"Weavers came from France, engineers from Germany, glass manufacturers from Italy and canal builders from Holland.","運河建造者來自荷蘭；織布工來自法國、工程師來自德國、玻璃製造者來自意大利。"],["37f1ff0","t",3,"In the Middle Ages, English wool was a very important export.",1,"England was an important trading nation, and people came from abroad to trade and to work.","中世紀時英格蘭是重要的貿易國，羊毛是非常重要的出口貨品。"],["867bac7","s",3,"In the Middle Ages, in the north of Scotland and in Ireland, land was owned by members of what?",["Clans","Guilds","Estates","Boroughs"],"A clan was a prominent family group.","在蘇格蘭北部和愛爾蘭，土地由氏族（clans）成員擁有。"],["e780089","s",3,"Which two families fought the Wars of the Roses?",["The Houses of Lancaster and York","The Houses of Tudor and Stuart","The Houses of Windsor and Hanover","The Houses of Normandy and Wessex"],"The civil war began in 1455 to decide who should be king of England.","玫瑰戰爭於 1455 年開始，是 Lancaster 與 York 兩個家族爭奪英格蘭王位的內戰。"],["02badb6","s",3,"What was the symbol of the House of Lancaster?",["A red rose","A white rose","A thistle","A daffodil"],"Lancaster's symbol was a red rose and York's was a white rose.","Lancaster 家族的標誌是紅玫瑰，York 家族是白玫瑰。"],["8efb862","s",3,"Which battle ended the Wars of the Roses in 1485?",["The Battle of Bosworth Field","The Battle of Hastings","The Battle of Agincourt","The Battle of Bannockburn"],"King Richard III was killed and Henry Tudor became King Henry VII.","1485 年 Bosworth Field 戰役結束了玫瑰戰爭，Richard III 陣亡，Henry Tudor 成為 Henry VII。"],["ccdee4f","s",3,"Which king was killed at the Battle of Bosworth Field?",["Richard III","Henry VII","Harold","Charles I"],"Richard III of the House of York was killed in the battle in 1485.","York 家族的 Richard III 於 1485 年在 Bosworth Field 陣亡。"],["6f1226e","s",3,"Who became king after winning the Battle of Bosworth Field?",["Henry VII","Henry VIII","Richard III","Edward VI"],"Henry Tudor, leader of the House of Lancaster, became Henry VII and was the first Tudor king.","Lancaster 家族的 Henry Tudor 登基成為 Henry VII，是第一位都鐸國王。"],["6cc2d19","s",3,"What does the Tudor rose look like?",["A red rose with a white rose inside it","A white rose with a blue thistle","Two red roses side by side","A red rose with a gold crown"],"Henry VII married Elizabeth of York, uniting the two families. The Tudor rose showed the alliance.","Henry VII 娶了 Elizabeth of York，兩個家族聯合。都鐸玫瑰是紅玫瑰內有一朵白玫瑰。"],["c2bb0bf","s",3,"How many times did Henry VIII marry?",["Six","Two","Four","Eight"],"Henry VIII is most famous for breaking away from the Church of Rome and marrying six times.","Henry VIII 最為人熟悉的是脫離羅馬教會和結過六次婚。"],["d6a8481","s",3,"Who was Henry VIII's first wife?",["Catherine of Aragon","Anne Boleyn","Jane Seymour","Catherine Parr"],"Catherine of Aragon was a Spanish princess. Only one of their children, Mary, survived.","Catherine of Aragon 是西班牙公主，兩人的子女只有 Mary 存活。"],["b010a5b","s",3,"Which of Henry VIII's wives was the mother of Elizabeth I?",["Anne Boleyn","Catherine of Aragon","Jane Seymour","Anne of Cleves"],"Anne Boleyn had one daughter, Elizabeth. She was executed at the Tower of London.","Anne Boleyn 是 Elizabeth I 的母親，後來在倫敦塔被處決。"],["1ca5eef","s",3,"Which wife gave Henry VIII the son he wanted?",["Jane Seymour","Catherine Howard","Anne Boleyn","Catherine Parr"],"Jane Seymour gave birth to Edward but died shortly afterwards.","Jane Seymour 為 Henry VIII 誕下兒子 Edward，但產後不久去世。"],["3503118","m",3,"Which TWO of Henry VIII's wives were executed?",["Anne Boleyn","Catherine Howard","Jane Seymour","Catherine Parr"],"Anne Boleyn and her cousin Catherine Howard were both executed. Catherine Parr survived Henry.","Anne Boleyn 和她的表親 Catherine Howard 都被處決，Catherine Parr 則比 Henry 長壽。"],["cf70b71","s",3,"Anne of Cleves, Henry VIII's fourth wife, was a princess from which country?",["Germany","Spain","France","Scotland"],"Henry married her for political reasons but divorced her soon after.","Anne of Cleves 是德國公主，Henry 出於政治原因娶她，不久便離婚。"],["8075204","s",3,"Why did Henry VIII establish the Church of England?",["The Pope refused to approve his divorce from his first wife","He wanted England to join the new Protestant Church of Scotland","Parliament ordered him to break all links with Catholic Spain","He wanted to become Archbishop of Canterbury himself"],"In the new Church the king, not the Pope, had the power to appoint bishops and decide how people should worship.","教宗不批准他與第一任妻子離婚，於是他成立英國國教會，由國王而非教宗任命主教。"],["c6a1916","s",3,"What was the Reformation?",["A movement against the authority of the Pope","A war between England and Catholic Spain","The return of Charles II from exile in 1660","A reform of the voting system in the 1830s"],"The Protestants formed their own churches. They read the Bible in their own languages instead of in Latin.","宗教改革是反對教宗權威和羅馬天主教會做法的運動，新教徒成立了自己的教會。"],["f8461ad","t",3,"During the Reformation, Protestants believed that people should read the Bible in their own language instead of in Latin.",1,"Protestants also did not pray to saints or at shrines.","新教徒主張用自己的語言而非拉丁文讀聖經，亦不向聖人祈禱。"],["acb8a07","s",3,"During whose reign was Wales formally united with England by the Act for the Government of Wales?",["Henry VIII","Elizabeth I","Edward I","James I"],"The Welsh sent representatives to the House of Commons and the Welsh legal system was reformed.","在 Henry VIII 在位期間，威爾斯透過 Act for the Government of Wales 正式與英格蘭合併。"],["1404fa1","s",3,"Who became king after Henry VIII died?",["Edward VI","James I","Charles I","Henry VII"],"Edward VI was strongly Protestant. He died at the age of 15 after ruling for just over six years.","Henry VIII 死後由兒子 Edward VI 繼位，他是堅定的新教徒，15 歲去世。"],["d37c83d","s",3,"During whose reign was the Book of Common Prayer written?",["Edward VI","Henry VIII","Mary I","James I"],"The Book of Common Prayer was written for use in the Church of England. A version is still used in some churches today.","Book of Common Prayer 在 Edward VI 在位期間編寫，供英國國教會使用。"],["ac9d17f","s",3,"Why did Queen Mary become known as 'Bloody Mary'?",["She persecuted Protestants","She fought a war against Scotland","She executed two of her husbands","She led the army at Agincourt"],"Mary was a devout Catholic and persecuted Protestants.","Mary 是虔誠天主教徒，因迫害新教徒而被稱為 'Bloody Mary'。"],["63c97a5","s",3,"What happened in 1588?",["The English defeated the Spanish Armada","The Great Fire of London","Charles I was executed","The Act of Union with Scotland was agreed"],"The Armada was a large fleet of ships sent by Spain to conquer England and restore Catholicism.","1588 年英格蘭擊敗西班牙無敵艦隊。該艦隊是西班牙派來征服英格蘭並恢復天主教的。"],["b24bbde","s",3,"Which monarch was on the throne when the Spanish Armada was defeated?",["Elizabeth I","Henry VIII","James I","Mary I"],"Elizabeth I became one of the most popular monarchs in English history, particularly after 1588.","擊敗西班牙無敵艦隊時在位的是 Elizabeth I，她因此更受愛戴。"],["b6e00a7","t",3,"Elizabeth I was a Protestant who re-established the Church of England as the official Church in England.",1,"She found a balance between the views of Catholics and more extreme Protestants.","Elizabeth I 是新教徒，重新確立英國國教會為英格蘭的官方教會，並在天主教徒與激進新教徒之間取得平衡。"],["8c943e3","s",3,"What did the Scottish Parliament do in 1560?",["It abolished the authority of the Pope in Scotland","It agreed a union of Scotland with England","It ordered the execution of Mary, Queen of Scots","It gave the vote to all Scottish landowners"],"Roman Catholic religious services became illegal, and a Protestant Church of Scotland was established.","1560 年蘇格蘭議會廢除教宗在蘇格蘭的權威，天主教儀式變成非法，並成立新教的蘇格蘭教會。"],["c5c99f6","s",3,"How old was Mary Stuart when she became Queen of Scots?",["One week old","Five years old","15 years old","21 years old"],"Her father died when she was only a week old. She spent much of her childhood in France.","Mary Stuart 出生僅一星期父親便去世，她隨即成為蘇格蘭女王，童年大部分時間在法國度過。"],["0210271","s",3,"How was Mary, Queen of Scots related to Elizabeth I?",["She was her cousin","She was her sister","She was her daughter","She was her aunt"],"Elizabeth kept Mary a prisoner for 20 years and she was eventually executed.","兩人是表親。Elizabeth 把 Mary 囚禁了 20 年，最後將她處決。"],["598e913","s",3,"What was the name of Sir Francis Drake's ship, one of the first to sail right around the world?",["The Golden Hind","HMS Victory","The Mary Rose","The Mayflower"],"Drake was also one of the commanders in the defeat of the Spanish Armada.","Sir Francis Drake 的船 Golden Hind 是最早環繞世界航行的船之一，他亦是擊敗西班牙無敵艦隊的指揮官之一。"],["f7cf389","s",3,"Where was William Shakespeare born?",["Stratford-upon-Avon","London","Canterbury","Edinburgh"],"Shakespeare was a playwright and actor, born in Stratford-upon-Avon in 1564.","莎士比亞 1564 年生於 Stratford-upon-Avon，是劇作家和演員。"],["e7d3d48","m",3,"Which TWO of these plays were written by William Shakespeare?",["Hamlet","Macbeth","The Mousetrap","Peter Grimes"],"His plays also include A Midsummer Night's Dream and Romeo and Juliet.","Hamlet 和 Macbeth 都是莎士比亞的作品，其他名作包括 A Midsummer Night's Dream 和 Romeo and Juliet。"],["211cc83","s",3,"What is the Globe Theatre in London?",["A modern copy of a theatre of Shakespeare's time","The oldest working cinema in Britain","The main concert hall used for the Proms","The hall where Parliament first met"],"Shakespeare's plays and poems are still performed and studied in Britain and other countries today.","倫敦的 Globe Theatre 是仿照當年首演莎士比亞戲劇的劇院而建的現代複製品。"],["9d9341b","s",3,"Who became King of England when Elizabeth I died in 1603?",["James VI of Scotland","Charles I","Edward VI","William of Orange"],"Elizabeth had no children. Her cousin James VI of Scotland became James I of England, Wales and Ireland.","Elizabeth I 沒有子女，1603 年由表親蘇格蘭國王 James VI 繼位，成為英格蘭的 James I。"],["f06a99d","t",3,"When James VI of Scotland became James I of England, Scotland stopped being a separate country.",0,"Scotland remained a separate country. The two kingdoms were not united until the Act of Union in 1707.","蘇格蘭當時仍是獨立國家，要到 1707 年的 Act of Union 兩國才合併。"],["9d5d766","s",3,"What is the King James Version?",["A translation of the Bible into English","A history of the Stuart kings of Scotland","The first dictionary of the English language","A set of laws uniting England and Scotland"],"It is also called the Authorised Version. It is still used in many Protestant churches today.","King James Version 是 James I 在位期間完成的英文聖經譯本，又稱 Authorised Version。"],["9ade4be","s",3,"During the reigns of Elizabeth I and James I, where in Ireland did Scottish and English Protestants settle on 'plantations'?",["Ulster","Dublin","Cork","Galway"],"The settlers took over land from Catholic landholders in Ulster, the northern province of Ireland.","蘇格蘭和英格蘭的新教徒在愛爾蘭北部的 Ulster 定居，接管了天主教地主的土地。"],["703612c","s",3,"What was the 'Divine Right of Kings'?",["The idea that the king was directly appointed by God to rule","The right of the king to choose the Archbishop of Canterbury","The right of Parliament to choose who should be the next king","A tax that the Church had to pay to the king every year"],"James I and his son Charles I believed in it, which caused conflict with Parliament.","「君權神授」是指國王直接由上帝委任統治。James I 和 Charles I 相信這個理念，因而與國會發生衝突。"],["c2607ac","s",3,"For how many years did Charles I rule without calling Parliament?",["11 years","3 years","20 years","40 years"],"He found ways to raise money without Parliament's approval for 11 years.","Charles I 有 11 年沒有召開國會，自行設法籌集資金。"],["b553bd1","s",3,"In which year did the English Civil War begin?",["1642","1588","1660","1707"],"Civil war between the king and Parliament began in 1642.","國王與國會之間的英國內戰於 1642 年爆發。"],["34862f6","s",3,"In the English Civil War, what were supporters of the king called?",["Cavaliers","Roundheads","Jacobites","Whigs"],"Those who supported the king were the Cavaliers and those who supported Parliament were the Roundheads.","內戰中支持國王的稱為 Cavaliers，支持國會的稱為 Roundheads。"],["a5d9903","m",3,"At which TWO battles was the army of Charles I defeated?",["Marston Moor","Naseby","Bosworth Field","Culloden"],"The king's army was defeated at the Battles of Marston Moor and Naseby.","Charles I 的軍隊在 Marston Moor 和 Naseby 兩場戰役被擊敗。"],["d4810a2","s",3,"What happened to Charles I in 1649?",["He was executed","He fled to France","He was crowned in Scotland","He signed the Bill of Rights"],"Charles I was unwilling to reach an agreement with Parliament and was executed in 1649.","Charles I 不肯與國會達成協議，於 1649 年被處決。"],["9b027e8","s",3,"After Charles I was executed, England declared itself a republic. What was it called?",["The Commonwealth","The Protectorate of Britain","The United Kingdom","The Restoration"],"England no longer had a monarch and was called the Commonwealth.","Charles I 被處決後，英格蘭宣布成為共和國，稱為 the Commonwealth。"],["fa2b647","s",3,"What title was given to Oliver Cromwell as leader of the new republic?",["Lord Protector","Prime Minister","Lord Chancellor","Iron Duke"],"Cromwell ruled as Lord Protector until his death in 1658.","Oliver Cromwell 獲封 Lord Protector，統治至 1658 年去世。"],["6f20d1f","s",3,"How did Charles II famously escape after the Battle of Worcester?",["He hid in an oak tree","He sailed down the Thames in disguise","He hid in the Tower of London","He rode to Scotland dressed as a servant"],"He hid in an oak tree on one occasion and eventually fled to Europe.","Charles II 在 Worcester 戰敗後曾躲在一棵橡樹上，最後逃往歐洲。"],["cf673e6","s",3,"What was the Restoration?",["The return of the monarchy under Charles II in 1660","The rebuilding of London after the Great Fire","The union of the kingdoms of England and Scotland","The return of the Roman Catholic Church to England"],"Parliament invited Charles II to come back from exile in the Netherlands in May 1660.","Restoration 是指 1660 年國會邀請流亡荷蘭的 Charles II 回國復辟。"],["11700c5","s",3,"What happened in London in 1665?",["There was a major outbreak of plague","The Great Exhibition opened in Hyde Park","The Civil War began with a battle in the city","The first curry house opened in George Street"],"Thousands of people died, especially in poorer areas.","1665 年倫敦爆發大瘟疫，數以千計的人死亡。"],["0125c9e","s",3,"In which year did the Great Fire of London take place?",["1666","1605","1688","1707"],"The fire destroyed much of the city, including many churches and St Paul's Cathedral.","倫敦大火發生於 1666 年，燒毀了城中大部分地方，包括 St Paul's Cathedral。"],["6325878","s",3,"Who designed the new St Paul's Cathedral after the Great Fire of London?",["Sir Christopher Wren","Inigo Jones","Robert Adam","Sir Edwin Lutyens"],"London was rebuilt with a new St Paul's, designed by the famous architect Sir Christopher Wren.","大火後重建的 St Paul's Cathedral 由著名建築師 Sir Christopher Wren 設計。"],["73bfc0c","s",3,"Whose diary describes the plague and the Great Fire of London?",["Samuel Pepys","Isaac Newton","Geoffrey Chaucer","Oliver Cromwell"],"Samuel Pepys wrote about these events in a diary which was later published and is still read today.","Samuel Pepys 在日記中記錄了瘟疫和倫敦大火，日記後來出版，至今仍有人閱讀。"],["41accce","s",3,"What did the Habeas Corpus Act of 1679 guarantee?",["That no one could be held prisoner unlawfully","That all men who owned property could vote","That the monarch must always be a Protestant","That newspapers could print without a licence"],"Habeas corpus is Latin for 'you must present the person in court'. Every prisoner has a right to a court hearing.","1679 年的 Habeas Corpus Act 保證任何人不得被非法拘禁，每名囚犯都有權在法庭聆訊。"],["6c71023","s",3,"Which of these is the oldest surviving scientific society in the world?",["The Royal Society","The National Trust","The Royal Academy","The British Council"],"The Royal Society was formed during the reign of Charles II to promote 'natural knowledge'.","Royal Society 在 Charles II 在位時成立，是世界上現存最古老的科學學會。"],["65593d8","s",3,"What did Sir Isaac Newton discover about white light?",["It is made up of the colours of the rainbow","It travels much faster than sound does","It cannot pass through coloured glass","It is bent by the force of gravity"],"Newton also showed how gravity applied to the whole universe.","牛頓發現白光由彩虹的各種顏色組成，亦說明了萬有引力適用於整個宇宙。"],["29f882d","s",3,"What is Sir Edmund Halley known for?",["Predicting the return of a comet","Inventing the steam engine","Designing St Paul's Cathedral","Discovering penicillin"],"Halley was an early member of the Royal Society.","Sir Edmund Halley 成功預測一顆彗星的回歸，該彗星現稱 Halley's Comet。"],["e2d4e66","s",3,"Why was the Glorious Revolution of 1688 called 'glorious'?",["There was no fighting in England","It ended the Hundred Years War","It gave women the right to vote","It united England and Scotland"],"William of Orange invaded and became William III. James II fled to France.","1688 年的光榮革命在英格蘭沒有發生戰鬥，並確立了國會的權力。William of Orange 成為 William III，James II 逃往法國。"],["faca19d","s",3,"Who ruled jointly with William III after the Glorious Revolution?",["Mary, the daughter of James II","Anne, the sister of Charles II","Elizabeth, the daughter of Henry VIII","Mary, Queen of Scots"],"William of Orange was married to Mary, the elder daughter of James II.","William III 與妻子 Mary（James II 的長女）共同執政。"],["4a35a21","s",3,"At which battle in Ireland did William III defeat James II in 1690?",["The Battle of the Boyne","The Battle of Culloden","The Battle of Naseby","The Battle of Worcester"],"This event is still celebrated by some people in Northern Ireland today.","1690 年 William III 在愛爾蘭的 Boyne 戰役擊敗 James II。北愛爾蘭至今仍有人慶祝這件事。"],["dcb6994","s",3,"What were supporters of James II called?",["Jacobites","Roundheads","Chartists","Huguenots"],"Some people continued to believe that James was the rightful king, particularly in Scotland.","支持 James II 的人稱為 Jacobites，在蘇格蘭尤其多。"],["a095384","s",3,"What did the Bill of Rights of 1689 do?",["It confirmed the rights of Parliament and limited the king's power","It gave the vote to all men who owned property of any value","It abolished slavery in every part of the British Empire","It united Great Britain and Ireland as a single kingdom"],"Parliament took control of who could be monarch and declared that the king or queen must be a Protestant.","1689 年的《權利法案》確認國會的權利和君主權力的限制，並規定君主必須是新教徒。"],["8de0f1f","t",3,"After the Bill of Rights of 1689, the monarch needed Parliament's agreement each year to renew funding for the army and the navy.",1,"A new Parliament also had to be elected at least every three years.","《權利法案》之後，君主每年都要得到國會同意才可延續陸軍和海軍的撥款。"],["75f59c4","s",3,"From 1689, what were the two main groups in Parliament called?",["The Whigs and the Tories","The Cavaliers and the Roundheads","The Lords and the Estates","The Chartists and the Fenians"],"This was the beginning of party politics. The Conservative Party is still sometimes called the Tories.","1689 年起國會有兩大派別：Whigs 和 Tories，是政黨政治的開端。保守黨至今仍有時被稱為 Tories。"],["1a129f9","s",3,"What changed for newspapers from 1695?",["They could operate without a government licence","They were banned from reporting on Parliament","They had to be printed in Latin","They were taxed for the first time"],"This was an important step in the development of a free press.","1695 年起報章毋須政府發牌便可經營，是新聞自由發展的重要一步。"],["4fc51c0","s",3,"What was a 'pocket borough'?",["A constituency controlled by a single wealthy family","A town that was allowed to mint its own coins","A constituency that had lost its right to an MP","A village that was excused from paying taxes"],"A 'rotten borough' was a constituency that had hardly any voters.","Pocket borough 是由一個富有家族控制的選區；rotten borough 則是幾乎沒有選民的選區。"],["34f6b36","s",3,"Who were the Huguenots?",["Protestant refugees from France","Catholic settlers from Spain","Viking traders from Denmark","Jewish merchants from Poland"],"They came between 1680 and 1720. Many were educated and skilled and worked as scientists, in banking or in weaving.","Huguenots 是 1680 至 1720 年間因受迫害而由法國來英的新教難民，不少人學識和技術俱佳。"],["5f8fd35","s",3,"What did the Act of Union of 1707 create?",["The Kingdom of Great Britain","The United Kingdom of Great Britain and Ireland","The Commonwealth","The Church of England"],"It united England and Wales with Scotland during the reign of Queen Anne.","1707 年的 Act of Union 在 Queen Anne 在位期間把英格蘭、威爾斯和蘇格蘭合併成大不列顛王國。"],["8a571fe","t",3,"After the Act of Union in 1707, Scotland kept its own legal and education systems and Presbyterian Church.",1,"Scotland was no longer an independent country but kept these institutions.","1707 年合併後蘇格蘭不再是獨立國家，但保留了自己的法律、教育制度和長老教會。"],["1716196","s",3,"Who was the first Prime Minister of Britain?",["Sir Robert Walpole","William Pitt","The Duke of Wellington","Oliver Cromwell"],"Walpole was Prime Minister from 1721 to 1742.","Sir Robert Walpole 是英國第一位首相，任期由 1721 至 1742 年。"],["541b7ea","s",3,"Why did George I rely heavily on his ministers?",["He did not speak very good English","He lived in Scotland","He was a child when he became king","He was often away at war"],"George I was German. The most important minister in Parliament became known as the Prime Minister.","George I 是德國人，英語不太流利，所以很倚重大臣。國會中最重要的大臣後來稱為首相。"],["a15e048","s",3,"Who was defeated at the Battle of Culloden in 1746?",["Bonnie Prince Charlie","The Duke of Wellington","Oliver Cromwell","William of Orange"],"Charles Edward Stuart, the grandson of James II, was defeated by George II's army and escaped back to Europe.","Bonnie Prince Charlie（Charles Edward Stuart，James II 的孫）在 1746 年的 Culloden 戰役被 George II 的軍隊擊敗。"],["ca24ec6","s",3,"What were the Highland Clearances?",["Landlords destroyed small farms to make space for sheep and cattle","Roman forts were removed from the north of Scotland","The clans fought a series of battles against each other","Forests were cut down to build ships for the navy"],"Small farms were known as crofts. Many Scottish people left for North America at this time.","Highland Clearances 是指蘇格蘭地主拆毀小農場（crofts）改為放牧牛羊，很多蘇格蘭人因此移居北美。"],["465f4d2","s",3,"Which Scottish poet is known as 'The Bard'?",["Robert Burns","Sir Walter Scott","John Barbour","Dylan Thomas"],"Burns wrote in the Scots language. His best-known work is probably the song Auld Lang Syne.","Robert Burns 被稱為 'The Bard'，以 Scots 語寫作，最著名的作品是 Auld Lang Syne。"],["6c4e097","s",3,"When is Auld Lang Syne traditionally sung?",["At New Year","At Christmas","At Easter","On Remembrance Day"],"It is sung by people in the UK and other countries when they celebrate the New Year, called Hogmanay in Scotland.","Auld Lang Syne 是慶祝新年時唱的歌，蘇格蘭的新年前夕稱為 Hogmanay。"],["41c70c8","s",3,"Adam Smith was a thinker of the Enlightenment. What ideas did he develop?",["Ideas about economics","Ideas about gravity","Ideas about medicine","Ideas about architecture"],"Adam Smith's ideas about economics are still referred to today.","Adam Smith 是啟蒙時代的蘇格蘭思想家，他的經濟學理念至今仍被引用。"],["fff9e8a","s",3,"Which Enlightenment thinker wrote about human nature?",["David Hume","James Watt","Robert Burns","Richard Arkwright"],"David Hume's ideas about human nature continue to influence philosophers.","David Hume 關於人性的思想至今仍影響哲學家。"],["ad5301f","s",3,"Whose work on steam power helped the progress of the Industrial Revolution?",["James Watt","Adam Smith","Sir Robert Walpole","Captain James Cook"],"Scientific discoveries such as James Watt's work on steam power helped the Industrial Revolution.","James Watt 在蒸汽動力方面的研究推動了工業革命。"],["ae15b33","s",3,"What was the Industrial Revolution?",["The rapid development of industry in the 18th and 19th centuries","A rebellion by factory workers in the north of England","The campaign to win the vote for working men","A trade war between Britain and France"],"Britain was the first country to industrialise on a large scale.","工業革命是指英國在 18 和 19 世紀工業迅速發展，英國是第一個大規模工業化的國家。"],["e7dae45","s",3,"Before the 18th century, what was the biggest source of employment in Britain?",["Agriculture","Coal mining","Shipbuilding","Banking"],"The Industrial Revolution moved many people from the countryside to work in mining and manufacturing.","18 世紀之前，農業是英國最主要的就業來源。"],["f41a2f1","s",3,"What did the Bessemer process make possible?",["The mass production of steel","The printing of newspapers","The cloning of animals","The spinning of cotton by hand"],"It led to the development of the shipbuilding industry and the railways.","Bessemer process 令鋼鐵可以大量生產，帶動了造船業和鐵路的發展。"],["e1991f2","s",3,"What was Richard Arkwright's original trade?",["Barber","Blacksmith","Sailor","Printer"],"He later improved the carding machine and developed efficient and profitable factories.","Richard Arkwright 原本是理髮師，後來改良梳棉機，並建立高效率的工廠。"],["174bf2e","s",3,"Why were canals built during the Industrial Revolution?",["To link the factories to towns, cities and ports","To supply clean drinking water to London and Leeds","To defend the south coast from a French invasion","To drain farmland in the Scottish Highlands"],"Canals were built particularly in the new industrial areas in the middle and north of England.","工業革命時期興建運河，是為了把工廠與城鎮和港口連接起來，尤其在英格蘭中部和北部。"],["a4b0377","s",3,"What did Captain James Cook do?",["He mapped the coast of Australia","He defeated the Spanish Armada","He discovered the source of the Nile","He was the first to sail around the world alone"],"A few colonies were then established in Australia.","Captain James Cook 繪製了澳洲海岸的地圖，其後英國在當地建立殖民地。"],["562fa4a","s",3,"What did Sake Dean Mahomet open in London in 1810?",["The first curry house in Britain","The first Indian bank in Britain","The first cinema in Britain","The first tea shop in Britain"],"It was called the Hindoostane Coffee House, in George Street, London.","Sake Dean Mahomet 於 1810 年在倫敦 George Street 開設 Hindoostane Coffee House，是英國第一間咖喱屋。"],["13394d2","s",3,"What did Sake Dean Mahomet and his wife introduce to Britain?",["Shampooing, the Indian art of head massage","Yoga, a form of exercise and meditation","Polo, a ball game played on horseback","Chess, a board game for two players"],"Mahomet grew up in the Bengal region of India and came to Britain in 1782.","Sake Dean Mahomet 和妻子把 'shampooing'（印度式頭部按摩）引入英國。"],["a8d3e70","s",3,"Which group set up the first formal anti-slavery groups in Britain in the late 1700s?",["The Quakers","The Chartists","The Huguenots","The Fenians"],"They petitioned Parliament to ban the practice.","1700 年代後期，Quakers 成立了最早的正式反奴隸制團體，並向國會請願。"],["4dea039","s",3,"William Wilberforce is known for what?",["Leading the campaign to abolish the slave trade","Founding the first training school for nurses","Building the Great Western Railway to Bristol","Leading the Chartists' campaign for the vote"],"He was an evangelical Christian and a Member of Parliament.","William Wilberforce 是福音派基督徒和國會議員，以領導廢除奴隸貿易的運動而聞名。"],["21fe1e0","s",3,"What became illegal in 1807?",["Trading slaves in British ships or from British ports","Owning land in Ireland without living on that land","Printing a newspaper without a government licence","Employing women and children for over 10 hours a day"],"The Emancipation Act of 1833 then abolished slavery throughout the British Empire.","1807 年起以英國船隻或由英國港口販賣奴隸屬違法；1833 年的 Emancipation Act 在整個大英帝國廢除奴隸制。"],["ebe9182","s",3,"In which year did the Emancipation Act abolish slavery throughout the British Empire?",["1833","1807","1776","1901"],"The Royal Navy also stopped slave ships from other countries and freed the slaves.","1833 年的 Emancipation Act 在整個大英帝國廢除奴隸制。"],["e587829","s",3,"How many American colonies declared their independence from Britain in 1776?",["13","6","20","50"],"The colonists defeated the British army and Britain recognised the colonies' independence in 1783.","1776 年有 13 個美洲殖民地宣布獨立，英國於 1783 年承認。"],["01f4523","s",3,"Who used the slogan 'no taxation without representation'?",["The American colonists","The Chartists","The suffragettes","The Roundheads"],"The British government wanted to tax the colonies, which had no representation in Parliament.","美洲殖民者不滿在國會沒有代表卻要交稅，提出「無代表，不納稅」。"],["115f689","s",3,"Who commanded the British fleet at the Battle of Trafalgar in 1805?",["Admiral Nelson","The Duke of Wellington","Sir Francis Drake","Captain James Cook"],"Nelson was killed in the battle. Nelson's Column in Trafalgar Square is a monument to him.","1805 年 Trafalgar 海戰由 Admiral Nelson 指揮，他在戰役中陣亡。Trafalgar Square 的 Nelson's Column 是紀念他的。"],["1168884","s",3,"Where can you visit HMS Victory, Nelson's ship?",["Portsmouth","Greenwich","Liverpool","Belfast"],"HMS Victory can be visited in Portsmouth.","Nelson 的戰艦 HMS Victory 現於 Portsmouth 開放參觀。"],["40b6889","s",3,"Who defeated the Emperor Napoleon at the Battle of Waterloo in 1815?",["The Duke of Wellington","Admiral Nelson","Sir Robert Walpole","Winston Churchill"],"Wellington was known as the Iron Duke and later became Prime Minister.","1815 年 Duke of Wellington 在 Waterloo 擊敗拿破崙。他人稱 Iron Duke，後來當上首相。"],["cd107be","s",3,"Which country joined England, Scotland and Wales in 1801 to form the United Kingdom?",["Ireland","Canada","The Isle of Man","Australia"],"The Act of Union of 1800 created the United Kingdom of Great Britain and Ireland.","1800 年的 Act of Union 令愛爾蘭於 1801 年與英格蘭、蘇格蘭和威爾斯合併，成為大不列顛及愛爾蘭聯合王國。"],["8af1379","s",3,"What is the cross of St George, the flag of England?",["A red cross on a white ground","A diagonal white cross on a blue ground","A diagonal red cross on a white ground","A white cross on a red ground"],"The Union Flag combines the crosses of St George, St Andrew and St Patrick.","St George 十字是白底紅十字。英國國旗由 St George、St Andrew 和 St Patrick 三個十字組成。"],["cf2155c","s",3,"What is the cross of St Andrew, the flag of Scotland?",["A diagonal white cross on a blue ground","A red cross on a white ground","A diagonal red cross on a white ground","A blue cross on a white ground"],"St Andrew is the patron saint of Scotland.","St Andrew 十字是藍底白色斜十字，代表蘇格蘭。"],["34ba7d6","s",3,"Why does the Welsh dragon not appear on the Union Flag?",["Wales was already united with England when the flag was created","Wales asked not to be included when the flag was designed","The dragon appears only on the flag of the Royal Family","Wales did not become part of the UK until the 20th century"],"The first Union Flag was created in 1606 from the flags of Scotland and England.","第一面英國國旗於 1606 年設計時，威爾斯已與英格蘭合併，所以國旗上沒有威爾斯紅龍。"],["7e79c27","s",3,"How old was Queen Victoria when she became queen in 1837?",["18","12","25","40"],"She reigned until 1901, almost 64 years.","Queen Victoria 於 1837 年登基時 18 歲，在位至 1901 年，接近 64 年。"],["066bcc6","s",3,"In which year did Queen Victoria's reign end?",["1901","1837","1851","1918"],"Her reign from 1837 to 1901 is known as the Victorian Age.","Queen Victoria 在位至 1901 年，這段時期稱為維多利亞時代。"],["1dcfe60","t",3,"During the Victorian period the British Empire became the largest empire the world has ever seen.",1,"It grew to cover all of India, Australia and large parts of Africa, with a population of more than 400 million.","維多利亞時期的大英帝國是世界歷來最大的帝國，人口超過四億。"],["5b8e28e","s",3,"What did the repeal of the Corn Laws in 1846 allow?",["The import of cheap grain","The export of British wool","Women to own property","Children to work in factories"],"The Corn Laws had prevented the import of cheap grain. Their repeal helped the development of free trade.","Corn Laws 禁止進口廉價穀物，1846 年廢除後促進了自由貿易。"],["a1f3edc","s",3,"In 1847, the number of hours that women and children could work was limited by law to how many per day?",["10 hours","6 hours","8 hours","14 hours"],"Working conditions in factories gradually became better during the Victorian period.","1847 年法例規定婦女和兒童每天最多工作 10 小時。"],["c937ed0","s",3,"Who pioneered the railway engine?",["George and Robert Stephenson","Isambard Kingdom Brunel","James Watt","Richard Arkwright"],"The father and son George and Robert Stephenson pioneered the railway engine.","George Stephenson 和兒子 Robert Stephenson 是鐵路機車的先驅。"],["acff2ab","s",3,"What did Isambard Kingdom Brunel build?",["The Great Western Railway","The Crystal Palace","St Paul's Cathedral","Hadrian's Wall"],"It was the first major railway built in Britain, running from Paddington Station in London to the south west of England, the West Midlands and Wales.","Brunel 興建了 Great Western Railway，是英國第一條主要鐵路，由倫敦 Paddington 站通往英格蘭西南部、West Midlands 和威爾斯。"],["2022b58","s",3,"Which bridge spanning the Avon Gorge was designed by Isambard Kingdom Brunel?",["The Clifton Suspension Bridge","Tower Bridge","The Forth Bridge","Westminster Bridge"],"Many of Brunel's bridges are still in use today.","橫跨 Avon Gorge 的 Clifton Suspension Bridge 由 Brunel 設計。"],["0084125","s",3,"Where was the Great Exhibition of 1851 held?",["In the Crystal Palace in Hyde Park","In the Royal Albert Hall in Kensington","In the White Tower at the Tower of London","In Trafalgar Square"],"The Crystal Palace was a huge building made of steel and glass.","1851 年的萬國博覽會在海德公園的 Crystal Palace 舉行，那是一座用鋼鐵和玻璃建成的巨型建築。"],["f8d023b","s",3,"Which countries did Britain fight alongside in the Crimean War?",["Turkey and France","Russia and Prussia","Spain and Portugal","Austria and Italy"],"From 1853 to 1856 Britain fought with Turkey and France against Russia.","1853 至 1856 年的克里米亞戰爭，英國聯同土耳其和法國對抗俄國。"],["b79727e","s",3,"Which medal was introduced by Queen Victoria during the Crimean War?",["The Victoria Cross","The George Cross","The Order of Merit","The Military Medal"],"It honours acts of valour by soldiers.","Victoria Cross 是 Queen Victoria 在克里米亞戰爭期間設立的勳章，表揚軍人的英勇行為。"],["9f6dbb6","t",3,"The Crimean War was the first war to be extensively covered by the media through news stories and photographs.",1,"The conditions were very poor and many soldiers died from illnesses caught in the hospitals.","克里米亞戰爭是第一場被傳媒以新聞和照片廣泛報道的戰爭。"],["028bef7","s",3,"Florence Nightingale is often regarded as the founder of what?",["Modern nursing","The National Health Service","The Red Cross","The suffragette movement"],"She worked in military hospitals in Turkey and in 1860 set up a training school for nurses at St Thomas' Hospital in London.","Florence Nightingale 被視為現代護理學的創始人，1860 年在倫敦 St Thomas' Hospital 成立護士訓練學校。"],["6aa7e98","s",3,"What caused the famine in Ireland in the middle of the 19th century?",["The potato crop failed","A long drought","The Black Death","War with France"],"A million people died from disease and starvation and another million and a half left Ireland.","19 世紀中葉愛爾蘭的馬鈴薯失收，引致饑荒，一百萬人死亡，另有一百五十萬人離開愛爾蘭。"],["43fb144","s",3,"Which Irish leader advocated 'Home Rule', in which Ireland would remain in the UK but have its own parliament?",["Charles Stuart Parnell","Robert the Bruce","William Wilberforce","Kenneth MacAlpin"],"The Fenians, by contrast, favoured complete independence.","Charles Stuart Parnell 主張 Home Rule，即愛爾蘭留在英國但有自己的議會；Fenians 則主張完全獨立。"],["0d17085","s",3,"What did the Reform Act of 1832 do?",["It greatly increased the number of people who could vote","It gave the vote to all women over the age of 30","It removed all the bishops from the House of Lords","It lowered the voting age for men from 21 to 18"],"It also abolished the old pocket and rotten boroughs and gave more parliamentary seats to the towns and cities.","1832 年的 Reform Act 大幅增加有投票權的人數，並廢除 pocket boroughs 和 rotten boroughs。"],["d0eed9c","s",3,"Who were the Chartists?",["Campaigners who demanded the vote for the working classes","Supporters of King Charles I during the Civil War","Map makers who worked for the Royal Navy","Members of the first group of anti-slavery Quakers"],"They presented petitions to Parliament in the 19th century.","Chartists 是 19 世紀爭取工人階級投票權的運動人士。"],["efe5f22","t",3,"Until 1870, when a woman got married, her earnings, property and money automatically belonged to her husband.",1,"Acts of Parliament in 1870 and 1882 gave wives the right to keep their own earnings and property.","1870 年之前，女性結婚後的收入、財產和金錢自動歸丈夫所有。1870 和 1882 年的法例才讓妻子保留自己的收入和財產。"],["08d4d42","s",3,"What name was given to the women who campaigned for the right to vote?",["Suffragettes","Chartists","Roundheads","Fenians"],"In 1903 Emmeline Pankhurst helped found the Women's Social and Political Union, the first group whose members were called suffragettes.","爭取女性投票權的人稱為 suffragettes。Emmeline Pankhurst 於 1903 年參與創立 Women's Social and Political Union。"],["26f9807","s",3,"Emmeline Pankhurst is famous for campaigning for what?",["Women's right to vote","The abolition of slavery","Free school meals","Better conditions for nurses"],"She set up the Women's Franchise League in 1889 and helped found the Women's Social and Political Union in 1903.","Emmeline Pankhurst 以爭取女性投票權聞名，1889 年成立 Women's Franchise League。"],["32bf83f","s",3,"In which year were women over the age of 30 given the right to vote?",["1918","1903","1928","1969"],"This was partly in recognition of women's contribution to the war effort during the First World War.","1918 年 30 歲以上的女性獲得投票權，部分原因是肯定女性在第一次世界大戰期間的貢獻。"],["4295a25","s",3,"In which year were women given the right to vote at the age of 21, the same as men?",["1928","1918","1945","1969"],"Women over 30 gained the vote in 1918. Equal voting rights at 21 came in 1928.","1928 年女性獲得與男性相同的投票權，即 21 歲可以投票。"],["19ee0db","s",3,"Who did Britain fight in the Boer War of 1899 to 1902?",["Settlers from the Netherlands in South Africa","Russian forces on the Crimean peninsula","French settlers in the east of Canada","American colonists on the east coast"],"The settlers were called the Boers. The war raised public discussion about the future of the Empire.","1899 至 1902 年的 Boer War 是英國在南非與荷蘭裔移民（Boers）的戰爭。"],["dc9a7c7","s",3,"Which of these was written by Rudyard Kipling?",["The Jungle Book","Oliver Twist","Treasure Island","Pride and Prejudice"],"Kipling also wrote the Just So Stories and the poem If. He won the Nobel Prize in Literature in 1907.","The Jungle Book 是 Rudyard Kipling 的作品，他亦寫了 Just So Stories 和詩作 If，1907 年獲諾貝爾文學獎。"],["84adab5","s",3,"In which country was Rudyard Kipling born?",["India","England","South Africa","Australia"],"He was born in India in 1865 and later lived in India, the UK and the USA.","Rudyard Kipling 1865 年生於印度，其後曾在印度、英國和美國居住。"],["74052ec","t",3,"Between 1853 and 1913, as many as 13 million British citizens left the country.",1,"Many emigrated to other parts of the Empire and elsewhere during this period.","1853 至 1913 年間，多達 1,300 萬英國公民移居海外。"],["7d180f7","s",3,"In the 19th century, the UK produced more than half of the world's supply of which goods?",["Iron, coal and cotton cloth","Tea, sugar and tobacco","Gold, silver and tin","Wheat, wool and timber"],"British industry led the world in the 19th century.","19 世紀英國生產了全球過半的鐵、煤和棉布。"],["565ddfe","m",3,"Which TWO of these were introduced in Britain in the early 20th century, before the First World War?",["Free school meals","Old-age pensions","The National Health Service","Free secondary education"],"Financial help for the unemployed was also introduced at this time. The NHS came in 1948.","20 世紀初引入了免費學校膳食、老年退休金和失業援助。NHS 要到 1
