ere his parents from?",["Norway","Ireland","Germany","Scotland"],"He served in the Royal Air Force during the Second World War.","Roald Dahl 生於威爾斯，父母是挪威人。"],["83ab931","s",3,"The Northern Ireland Assembly was suspended in 2002. In which year was it reinstated?",["2007","2003","2010","2016"],"It had first been elected in 1999 after the Good Friday Agreement.","北愛爾蘭議會於 2002 年被中止運作，2007 年恢復。"],["7394f14","s",3,"In the 1990s, Britain played a leading role in coalition forces involved in the liberation of which country?",["Kuwait","Kosovo","Afghanistan","The Falkland Islands"],"This followed the Iraqi invasion of Kuwait in 1990.","1990 年代，英國在解放科威特的聯軍中擔當領導角色。"],["1b75102","s",3,"In which year did British combat troops leave Iraq?",["2009","2003","2014","1991"],"British forces also operated in Afghanistan as part of the International Security Assistance Force.","英國作戰部隊於 2009 年撤離伊拉克。"],["1887518","t",3,"In May 2010, for the first time since February 1974, no political party won an overall majority in the General Election.",1,"The Conservative and Liberal Democrat parties formed a coalition.","2010 年 5 月大選是自 1974 年 2 月以來首次沒有政黨取得過半議席。"],["848aca0","s",3,"In which year did the UK hold a referendum in which a majority voted to leave the European Union?",["2016","2010","2014","2019"],"The UK formally left the EU on 31 January 2020.","英國於 2016 年舉行公投，多數選民贊成脫離歐盟。"],["34ff5a1","s",3,"Which of these statements about the Reform Acts is correct?",["The Reform Act of 1832 came before the Reform Act of 1867","The Reform Act of 1867 was the first to increase the number of voters"],"The 1832 Act abolished the old pocket and rotten boroughs.","1832 年的 Reform Act 早於 1867 年的 Reform Act。"],["7d15fbc","s",3,"Which of these statements about Sir Winston Churchill is correct?",["He was given a state funeral when he died in 1965","He was Prime Minister without a break from 1940 to 1964"],"He lost the General Election in 1945 and returned as Prime Minister in 1951.","邱吉爾於 1965 年去世，獲舉行國葬。他在 1945 年大選落敗，1951 年再度出任首相。"],["a377b0f","s",4,"Where do most people in the UK live?",["In towns and cities","In small villages","On farms in the countryside","On islands off the coast"],"Much of Britain is still countryside, where many people go for holidays and leisure.","英國大部分人住在城鎮和城市。"],["a3cf15f","s",4,"Where is John O'Groats?",["On the north coast of Scotland","On the south coast of England","On the west coast of Wales","On the north coast of Northern Ireland"],"It is about 870 miles from Land's End in the south-west corner of England.","John O'Groats 位於蘇格蘭北岸。"],["96e6c92","m",4,"Which TWO of these cities are in Wales?",["Cardiff","Swansea","Plymouth","Aberdeen"],"Newport is also a city in Wales.","Cardiff 和 Swansea 都在威爾斯；Plymouth 在英格蘭，Aberdeen 在蘇格蘭。"],["985e6a8","s",4,"Which of these is a denomination of UK banknote?",["£20","£15","£25","£30"],"The notes are £5, £10, £20 and £50.","英國鈔票的面額有 £5、£10、£20 和 £50。"],["72a1a71","s",4,"What was the population of the UK in 1951?",["50 million","20 million","40 million","70 million"],"The population was 40 million in 1901 and 50 million in 1951.","1951 年英國人口為 5,000 萬。"],["66e9b76","s",4,"About what percentage of the UK's population lives in Scotland?",["Just over 8%","Less than 3%","Around 15%","About 25%"],"England has 84%, Wales around 5% and Northern Ireland less than 3%.","蘇格蘭人口佔全國略多於 8%。"],["d751cb2","s",4,"About what percentage of the UK's population lives in Wales?",["Around 5%","Around 12%","Less than 1%","About 20%"],"England has 84%, Scotland just over 8% and Northern Ireland less than 3%.","威爾斯人口約佔全國 5%。"],["69b9dd3","m",4,"Which TWO reasons explain why the UK population has grown faster in recent years?",["Migration into the UK","Longer life expectancy","A fall in the number of jobs","A rise in the number of farms"],"The population is also ageing, with a record number of people aged 85 and over.","近年英國人口增長加快，主要因為移入人口增加和預期壽命延長。"],["5d4a29b","t",4,"In Wales, the Welsh language is taught in schools and universities.",1,"Many people in Wales speak Welsh, a completely different language from English.","威爾斯的學校和大學都有教授威爾斯語。"],["b6dbf29","t",4,"More women than men study at university in the UK.",1,"On average, girls also leave school with better qualifications than boys.","英國讀大學的女性比男性多，女生離校時的平均成績亦比男生好。"],["949569d","s",4,"Which is the biggest Christian denomination in the UK after the Protestant churches?",["Roman Catholic","Greek Orthodox","Methodist","Quaker"],"There are also other denominations of Christianity, the biggest of which is Roman Catholic.","新教以外，英國最大的基督教教派是羅馬天主教。"],["1a0ebaa","s",4,"What is a Sikh place of worship called?",["A gurdwara","A synagogue","A mosque","A chapel"],"In the UK there are buildings for many religions, including Hindu temples, Jewish synagogues and Muslim mosques.","錫克教的禮拜場所稱為 gurdwara。"],["c58dee5","s",4,"Who usually makes the choice of a new Archbishop of Canterbury?",["The Prime Minister and a committee appointed by the Church","The House of Commons, by a free vote","The bishops who sit in the House of Lords","The General Assembly of the Church of Scotland"],"The monarch has the right to select the Archbishop, but usually the choice is made in this way.","君主有權選任 Archbishop of Canterbury，但通常由首相和教會委任的委員會作出選擇。"],["b941199","t",4,"Several Church of England bishops sit in the House of Lords.",1,"The Church of England is the official Church of the state in England.","有數位 Church of England 的主教是上議院議員。"],["2f9175a","s",4,"When is St David's Day?",["1 March","17 March","23 April","30 November"],"St David is the patron saint of Wales.","St David's Day 是 3 月 1 日，St David 是威爾斯的主保聖人。"],["8b520e2","s",4,"When is St Andrew's Day?",["30 November","1 March","17 March","23 April"],"St Andrew is the patron saint of Scotland.","St Andrew's Day 是 11 月 30 日。"],["ab128c6","s",4,"Who is the patron saint of England?",["St George","St Andrew","St David","St Augustine"],"St George's Day is 23 April.","英格蘭的主保聖人是 St George，紀念日是 4 月 23 日。"],["0d1f98a","s",4,"Who is the patron saint of Northern Ireland?",["St Patrick","St Columba","St George","St David"],"St Patrick's Day is 17 March.","北愛爾蘭的主保聖人是 St Patrick，紀念日是 3 月 17 日。"],["a4a13cf","s",4,"What is the national flower of England?",["The rose","The daffodil","The thistle","The shamrock"],"Scotland has the thistle, Wales the daffodil and Northern Ireland the shamrock.","英格蘭的國花是玫瑰。"],["ac7f819","s",4,"For how long is the Moderator of the Church of Scotland appointed?",["One year","Three years","Five years","For life"],"The Moderator chairs the General Assembly of the Church of Scotland.","Church of Scotland 的 Moderator 任期只有一年。"],["57ac155","s",4,"When is Christmas Eve?",["24 December","25 December","26 December","31 December"],"Many Christians go to church on Christmas Eve or on Christmas Day itself.","平安夜是 12 月 24 日。"],["db7110a","s",4,"What do young children believe Father Christmas does during the night before Christmas Day?",["Brings them presents","Lights the Christmas tree","Cooks the turkey","Rings the church bells"],"Father Christmas is also known as Santa Claus.","小朋友相信聖誕老人（Father Christmas）會在聖誕節前夕的晚上送來禮物。"],["433cc91","s",4,"Chocolate Easter eggs are a symbol of what?",["New life","The end of winter","Good luck","The harvest"],"Easter eggs are often given as presents at Easter.","復活蛋象徵新生命。"],["aa46365","s",4,"In which months does Easter take place?",["March or April","January or February","May or June","October or November"],"It marks the death of Jesus Christ on Good Friday and his rising from the dead on Easter Sunday.","復活節在 3 月或 4 月。"],["486978d","s",4,"What happens at church services on Ash Wednesday?",["Christians are marked with an ash cross on their forehead","Christians exchange chocolate eggs as a symbol of new life","Christians light one candle on a menorah each day","Christians lay wreaths of poppies"],"The cross is a symbol of death and sorrow for sin. Ash Wednesday is the first day of Lent.","Ash Wednesday 的崇拜中，基督徒會在額上畫上灰十字，象徵死亡和為罪懺悔。"],["d76d432","s",4,"For how many days does Diwali last?",["Five","Two","Eight","Forty"],"It normally falls in October or November.","Diwali 為期五天，一般在 10 或 11 月。"],["8bfb00e","s",4,"What does Diwali celebrate?",["The victory of good over evil and the gaining of knowledge","The end of a month of fasting from dawn until sunset","The founding of the Sikh community called the Khalsa","The struggle for religious freedom"],"It is often called the Festival of Lights.","Diwali 慶祝善戰勝惡和獲得知識，常被稱為 Festival of Lights。"],["ada7fc3","s",4,"What do Muslims do during the month of Ramadan?",["They fast","They exchange gifts","They light fireworks","They make a pilgrimage to Leicester"],"Eid al-Fitr celebrates the end of Ramadan.","穆斯林在 Ramadan 齋戒月期間禁食。"],["f7e4431","s",4,"What do many Muslims do during the festival of Eid ul Adha?",["They sacrifice an animal to eat","They fast from dawn until sunset","They light candles for eight days","They decorate their homes with lanterns"],"In Britain this has to be done in a slaughterhouse.","很多穆斯林在 Eid ul Adha 宰牲食用；在英國必須在屠場進行。"],["f3eb879","s",4,"Which day is a public holiday in Scotland but not in the rest of the UK?",["2 January","26 December","1 May","5 November"],"New Year's Day, 1 January, is a public holiday across the UK.","1 月 2 日在蘇格蘭是公眾假期，英國其他地方則不是。"],["8edd778","s",4,"What do young people often do at Halloween?",["Dress up in frightening costumes to play 'trick or treat'","Wear poppies and keep a two-minute silence at 11.00 am","Play jokes on each other until midday","Send anonymous cards to people they secretly admire"],"People also carve lanterns out of pumpkins and put a candle inside.","萬聖節時年青人會穿上恐怖服裝玩 'trick or treat'，亦會雕南瓜燈。"],["5678981","s",4,"When is Bonfire Night?",["5 November","31 October","11 November","1 January"],"People set off fireworks at home or in special displays.","Bonfire Night 是 11 月 5 日，當晚人們會放煙花。"],["b560541","s",4,"How long is the silence observed at 11.00 am on Remembrance Day?",["Two minutes","One minute","Five minutes","Eleven minutes"],"Wreaths are laid at the Cenotaph in Whitehall, London.","Remembrance Day 上午 11 時默哀兩分鐘。"],["7ad697f","s",4,"Where did Britain finish in the medal table at the 2012 Olympic Games?",["Third","First","Second","Tenth"],"The Games were hosted in London.","2012 年倫敦奧運，英國在獎牌榜排第三。"],["4bc10c2","m",4,"Which TWO of these sportspeople are Paralympians?",["Baroness Tanni Grey-Thompson","Ellie Simmonds","Dame Kelly Holmes","Sir Chris Hoy"],"David Weir is another British Paralympian.","Baroness Tanni Grey-Thompson 和 Ellie Simmonds 都是殘奧運動員。"],["db7b68d","s",4,"In which year did England win the football World Cup?",["1966","1948","1954","2012"],"It is England's only international tournament victory. The team was captained by Bobby Moore.","英格蘭足球隊於 1966 年贏得世界盃。"],["2246a77","s",4,"In which country was Sir Mo Farah born?",["Somalia","Kenya","Ethiopia","England"],"He is a British distance runner who won two gold medals at the 2012 Olympics.","Sir Mo Farah 生於索馬里。"],["d41e48d","s",4,"The expressions 'rain stopped play' and 'batting on a sticky wicket' come from which sport?",["Cricket","Tennis","Rugby","Golf"],"Cricket's influence on British life can be seen in everyday phrases such as these.","'Rain stopped play' 和 'batting on a sticky wicket' 等常用語都來自板球。"],["48f447e","s",4,"When were the first professional football clubs formed in the UK?",["In the late 19th century","In the early 17th century","In the 1920s","After the Second World War"],"Football has a long history in the UK.","英國最早的職業足球會在 19 世紀後期成立。"],["c7a9971","m",4,"What are the TWO different types of rugby?",["Union","League","Premier","National"],"They have different rules and separate leagues and national teams.","欖球分為 union 和 league 兩種，各有不同規則。"],["b541ac1","s",4,"Where is the Scottish Grand National held?",["Ayr","Aintree","St Andrews","Edinburgh"],"The Grand National itself is held at Aintree, near Liverpool.","Scottish Grand National 在 Ayr 舉行。"],["8837e41","s",4,"Where do the Wimbledon Championships take place?",["At the All England Lawn Tennis and Croquet Club","At the Royal Albert Hall","At the Scottish Exhibition and Conference Centre","At the National Tennis Museum in Leamington Spa"],"It is the most famous tennis tournament hosted in Britain.","溫布頓網球錦標賽在 All England Lawn Tennis and Croquet Club 舉行。"],["d241882","s",4,"What did Sir Robin Knox-Johnston achieve?",["He was the first person to sail single-handed around the world without stopping","He was the first person to win the Formula 1 championship three times","He was the first person to run a mile in under four minutes","He was the first person to win gold at five Olympic Games in a row"],"He did this two years after Sir Francis Chichester first sailed single-handed around the world.","Sir Robin Knox-Johnston 是首位不停站完成單人環球航行的人。"],["4e11c5b","s",4,"Near which city is Europe's longest dry ski slope?",["Edinburgh","Cardiff","Belfast","Manchester"],"There are also five ski centres in Scotland.","歐洲最長的人造滑雪道位於愛丁堡附近。"],["8130d4c","s",4,"Which of these statements about the Six Nations Championship is correct?",["It is a rugby union competition","It is a rugby league competition"],"The Super League is the best-known rugby league competition.","Six Nations Championship 是 rugby union 賽事。"],["482a9fb","s",4,"What is the best-known concert of the Proms?",["The Last Night of the Proms","The First Night of the Proms","The Royal Variety Performance","The New Year's Day Concert"],"It is broadcast on television.","The Proms 最著名的一場音樂會是 Last Night of the Proms。"],["ec7eadb","s",4,"When is Handel's oratorio Messiah often sung by choirs?",["At Easter time","On Remembrance Day","On Bonfire Night","On St George's Day"],"Handel also wrote the Water Music and Music for the Royal Fireworks.","Handel 的神劇 Messiah 常在復活節期間由合唱團演唱。"],["7012d75","s",4,"In which country was the composer George Frederick Handel born?",["Germany","England","Italy","Austria"],"He spent many years in the UK and became a British citizen in 1727.","作曲家 Handel 生於德國，在英國生活多年，1727 年成為英國公民。"],["419c15a","s",4,"For which king did Handel write Music for the Royal Fireworks?",["George II","George I","Charles II","William III"],"He wrote the Water Music for George I.","Music for the Royal Fireworks 是 Handel 為 George II 創作的；Water Music 則為 George I 而作。"],["b7e151d","s",4,"Gustav Holst adapted Jupiter, part of The Planets, as the tune for which hymn?",["I Vow to Thee My Country","Land of Hope and Glory","Jerusalem","Auld Lang Syne"],"The Planets is a suite of pieces themed around the planets of the solar system.","Holst 把 The Planets 中的 Jupiter 改編成聖詩 I Vow to Thee My Country 的旋律。"],["ccf1e06","s",4,"In which city was Sir Edward Elgar born?",["Worcester","Manchester","Bristol","York"],"His best-known work is probably the Pomp and Circumstance Marches.","Sir Edward Elgar 生於 Worcester。"],["3f00595","s",4,"Benjamin Britten's A Young Person's Guide to the Orchestra is based on a piece of music by which composer?",["Purcell","Handel","Elgar","Holst"],"It introduces the listener to the various sections of an orchestra.","Britten 的 A Young Person's Guide to the Orchestra 以 Purcell 的作品為基礎。"],["7523a8c","s",4,"In which city is the Scottish Exhibition and Conference Centre (SECC)?",["Glasgow","Edinburgh","Aberdeen","Dundee"],"Other large venues include Wembley Stadium and The O2 in Greenwich, south-east London.","Scottish Exhibition and Conference Centre（SECC）位於 Glasgow。"],["eb87c8d","s",4,"What kind of event are the Brit Awards?",["An annual event that gives awards for music","An annual prize for the best British novel","A festival of film and television","A competition for garden design"],"Awards include best British group and best British solo artist.","Brit Awards 是每年舉行的音樂頒獎禮。"],["83fb5c2","s",4,"Who wrote the play The Mousetrap?",["Dame Agatha Christie","Sir Arthur Conan Doyle","Harold Pinter","Andrew Lloyd Webber"],"It is a murder-mystery play that has been running in the West End since 1952.","The Mousetrap 是 Dame Agatha Christie 的劇作。"],["e75a628","s",4,"With whom did Andrew Lloyd Webber collaborate on Jesus Christ Superstar and Evita?",["Tim Rice","W S Gilbert","Benjamin Britten","Nick Park"],"Lloyd Webber wrote the music for these shows.","Andrew Lloyd Webber 與 Tim Rice 合作創作了 Jesus Christ Superstar 和 Evita。"],["a0f47ee","s",4,"In a pantomime, what is the Dame?",["A woman's part played by a man","A fairy played by a child","A horse played by two actors","The villain of the story"],"Pantomimes are based on fairy stories and are light-hearted plays with music and comedy.","Pantomime 中的 Dame 是由男人扮演的女角。"],["1d27bed","s",4,"Lucian Freud was a German-born British artist. What is he best known for?",["His portraits","His landscapes","His sculptures","His stained glass"],"Freud lived from 1922 to 2011.","Lucian Freud 是生於德國的英國藝術家，以肖像畫聞名。"],["c4c2c0f","m",4,"Which TWO artists have won the Turner Prize?",["Damien Hirst","Richard Wright","Thomas Gainsborough","John Constable"],"The Turner Prize is recognised as one of the most prestigious visual art awards in Europe.","Damien Hirst 和 Richard Wright 都是 Turner Prize 得主。"],["e62fecb","s",4,"In which city is the National Museum of Wales?",["Cardiff","Swansea","Newport","Bangor"],"The National Gallery, Tate Britain and Tate Modern are in London.","威爾斯的 National Museum 位於 Cardiff。"],["8371c67","m",4,"Which TWO of these cathedrals were built in the Middle Ages?",["Durham","Salisbury","St Paul's","Liverpool"],"Lincoln and Canterbury are other medieval cathedrals. The present St Paul's was built after the Great Fire of 1666.","Durham 和 Salisbury 的大教堂建於中世紀；現時的 St Paul's 是 1666 年大火後重建的。"],["a870f48","m",4,"Which TWO are British architects of the modern era?",["Sir Norman Foster","Dame Zaha Hadid","Inigo Jones","Robert Adam"],"Lord (Richard) Rogers is another. They have continued to work on major projects throughout the world.","Sir Norman Foster 和 Dame Zaha Hadid 都是當代英國建築師。"],["9123a89","s",4,"With which architect did the garden designer Gertrude Jekyll often work?",["Sir Edwin Lutyens","Sir Christopher Wren","Robert Adam","Inigo Jones"],"She designed colourful gardens around the houses he designed.","園林設計師 Gertrude Jekyll 經常與建築師 Sir Edwin Lutyens 合作，為他設計的房屋配上色彩豐富的花園。"],["e6eb7e1","s",4,"What did Clarice Cliff design?",["Art Deco ceramics","Furniture in the 18th century","Country house gardens","Railway stations"],"Britain has produced many great designers.","Clarice Cliff 設計 Art Deco 風格的陶瓷。"],["d58f087","s",4,"Who created the character James Bond?",["Ian Fleming","Graham Greene","Sir Arthur Conan Doyle","Roald Dahl"],"Fleming's books introduced James Bond.","占士邦這個角色由 Ian Fleming 創作。"],["b015dd2","m",4,"Which TWO authors have won the Man Booker Prize for Fiction?",["Ian McEwan","Hilary Mantel","Jane Austen","Thomas Hardy"],"Julian Barnes is another past winner.","Ian McEwan 和 Hilary Mantel 都曾獲 Man Booker Prize，Julian Barnes 亦是。"],["7ae416c","s",4,"The characters Scrooge and Mr Micawber appear in novels by which author?",["Charles Dickens","Jane Austen","Evelyn Waugh","Robert Louis Stevenson"],"These characters' names are still used to describe people today.","Scrooge 和 Mr Micawber 是 Charles Dickens 小說中的角色。"],["296e250","s",4,"What are Jane Austen's novels concerned with?",["Marriage and family relationships","Crime and the work of detectives","War and life in the Empire","Science and invention"],"Many of her books have been made into television programmes or films.","Jane Austen 的小說以婚姻和家庭關係為題材。"],["7a8234e","s",4,"Who wrote Dr Jekyll and Mr Hyde?",["Robert Louis Stevenson","Sir Arthur Conan Doyle","Charles Dickens","Graham Greene"],"He also wrote Treasure Island and Kidnapped.","Dr Jekyll and Mr Hyde 是 Robert Louis Stevenson 的作品。"],["ca8db19","s",4,"The Middle English poem Sir Gawain and the Green Knight is about a knight at the court of which king?",["King Arthur","King Alfred","King John","King Harold"],"It was written in the Middle Ages, like Chaucer's Canterbury Tales.","中世紀英文詩 Sir Gawain and the Green Knight 講述 King Arthur 宮廷中的一位騎士。"],["c1a2a52","s",4,"Who wrote the poem She Walks in Beauty?",["Lord Byron","William Blake","John Keats","Sir Walter Scott"],"Byron was one of the poets of the 19th century.","She Walks in Beauty 是 Lord Byron 的詩作。"],["5b6d4ea","s",4,"Who wrote the poem Anthem for Doomed Youth?",["Wilfred Owen","Siegfried Sassoon","Ted Hughes","Robert Browning"],"Owen was inspired to write about his experiences in the First World War.","Anthem for Doomed Youth 是 Wilfred Owen 以第一次世界大戰經歷寫成的詩。"],["a1b8d82","s",4,"In which country is the garden at Mount Stewart?",["Northern Ireland","Scotland","Wales","England"],"Bodnant Garden is in Wales, and Kew Gardens, Sissinghurst and Hidcote are in England.","Mount Stewart 的花園位於北愛爾蘭。"],["cb2555f","s",4,"Who directed the film The Third Man in 1949?",["Carol Reed","David Lean","Sir Alfred Hitchcock","Ridley Scott"],"It is one of the famous British films listed in the handbook.","1949 年的電影 The Third Man 由 Carol Reed 執導。"],["8d648f2","s",4,"In the Middle Ages, who told jokes and made fun of people at the courts of kings and rich nobles?",["Jesters","Bards","Heralds","Yeomen"],"The traditions of comedy and satire are an important part of the UK character.","中世紀的國王和富有貴族的宮廷中有弄臣（jesters）說笑話和取笑他人。"],["f95c860","s",4,"In Northern Ireland, some television programmes are broadcast in which language as well as English?",["Irish Gaelic","Scots","Welsh","Cornish"],"There is also a Welsh-language channel in Wales, and there are programmes specific to Scotland.","北愛爾蘭有些電視節目以愛爾蘭蓋爾語播出；威爾斯則有威爾斯語頻道。"],["56930f0","s",4,"What are the 'biomes' at the Eden Project?",["Giant greenhouses","Underground caves","Wind turbines","Stone circles"],"They house plants from all over the world.","Eden Project 的 biomes 是巨型溫室，種有世界各地的植物。"],["f30f2da","s",4,"Why was the London Eye originally built?",["As part of the UK's celebration of the new millennium","To mark Queen Elizabeth II's Diamond Jubilee","As a viewing tower for the 2012 Olympic Games","To celebrate the 150th anniversary of Big Ben"],"It continues to be an important part of New Year celebrations.","London Eye 最初是為慶祝千禧年而興建的。"],["3e8d092","s",4,"What is the biggest stretch of water in the Lake District?",["Windermere","Wastwater","Loch Lomond","Loch Ness"],"The Lake District is England's largest national park.","Lake District 最大的湖是 Windermere。"],["1160c1a","s",4,"What are the columns of the Giant's Causeway made from?",["Volcanic lava","White chalk","Red sandstone","Welsh slate"],"The land formation is about 50 million years old.","Giant's Causeway 的石柱由火山熔岩形成。"],["5d4f059","s",4,"Which of these statements about pubs is correct?",["People under 18 may be allowed in some pubs with an adult, but cannot buy alcohol","People aged 16 can buy alcohol in a pub if they are with an adult"],"To buy alcohol in a pub or night club you must be 18 or over.","18 歲以下人士如有成年人陪同，可以進入部分酒吧，但不可以買酒。"],["ed83738","t",4,"Bank holidays in the UK take place at the beginning of May, in late May or early June, and in August.",1,"On these days banks and many other businesses are closed.","英國的銀行假期在 5 月初、5 月底或 6 月初，以及 8 月。"],["4a11a0c","s",5,"How often did the Chartists want elections to be held?",["Every year","Every three years","Every five years","Every seven years"],"This was one of their six demands, along with the vote for every man and secret ballots.","Chartists 的六項訴求之一是每年舉行選舉。"],["b6edbc2","s",5,"In 1928, at what age were both men and women given the right to vote?",["21","18","25","30"],"The voting age was reduced to 18 in 1969.","1928 年起，年滿 21 歲的男女都有投票權；1969 年降至 18 歲。"],["a3d759d","m",5,"Which TWO Houses make up the UK Parliament?",["The House of Commons","The House of Lords","The House of Windsor","The House of Representatives"],"Parliament is one of the main institutions of the British constitution.","英國國會由下議院（House of Commons）和上議院（House of Lords）組成。"],["5c77f9e","s",5,"Who is the wife of King Charles III?",["Queen Camilla","Queen Catherine","Queen Anne","Queen Mary"],"The King's eldest son, Prince William, is the heir to the throne.","King Charles III 的妻子是 Queen Camilla。"],["b71b973","s",5,"For how many years did Queen Elizabeth II reign?",["70 years","50 years","60 years","64 years"],"She reigned from 1952 until her death in September 2022.","Queen Elizabeth II 在位 70 年，由 1952 年至 2022 年 9 月逝世。"],["675fc13","s",5,"Who invites the leader of the party with the largest number of MPs to become Prime Minister?",["The monarch","The Speaker","The outgoing Prime Minister","The Archbishop of Canterbury"],"This is part of the monarch's role in a constitutional monarchy.","由君主邀請擁有最多議席的政黨領袖出任首相。"],["dffb90a","s",5,"Why is the House of Commons regarded as the more important of the two chambers in Parliament?",["Its members are democratically elected","It is older than the House of Lords","It has more members than the Lords","The monarch sits in it"],"The Prime Minister and almost all the members of the cabinet are members of the House of Commons.","下議院被視為國會兩院中較重要的一個，因為議員由民主選舉產生。"],["6edf51f","m",5,"Until 1958, all peers were one of three kinds. Which TWO of these were among them?",["Hereditary peers","Bishops of the Church of England","Former Members of Parliament","Elected mayors"],"The third kind was senior judges. Life peers were introduced in 1958.","1958 年之前，所有上議院議員都是世襲貴族、高級法官或 Church of England 主教。"],["228cec9","s",5,"What can the House of Lords do with new laws?",["Suggest amendments or propose new laws, which MPs then discuss","Pass any law without the agreement of the House of Commons","Stop a law from ever being passed","Change laws after the monarch has agreed to them"],"The House of Lords checks laws that have been passed by the House of Commons to make sure they are fit for purpose.","上議院可以提出修訂或新法例，再交由下議院議員討論。"],["d0c39d2","s",5,"How can you contact your MP?",["By letter or telephone at their constituency office","Only by visiting 10 Downing Street in person","Only by writing to the Speaker of the House of Commons","Only through your local council's complaints office"],"You can also contact them at their office in the House of Commons. Many MPs hold regular local surgeries.","你可以致函或致電議員的選區辦事處或下議院辦公室聯絡國會議員。"],["32c139f","m",5,"In which TWO situations can the Prime Minister be changed?",["If the MPs in the governing party decide to do so","If he or she wishes to resign","If the House of Lords votes for it","If the Speaker asks him or her to go"],"The Prime Minister usually resigns if his or her party loses a General Election.","執政黨的國會議員決定更換首相，或首相本人請辭，都可以令首相換人。"],["4a9ecf1","s",5,"About how many senior MPs does the Prime Minister appoint to become ministers in the cabinet?",["About 20","About 5","About 50","About 100"],"The cabinet is a committee which usually meets weekly.","首相任命約 20 名資深國會議員出任內閣大臣。"],["188c642","t",5,"The leader of the opposition usually becomes Prime Minister if his or her party wins the next General Election.",1,"The opposition is the second-largest party in the House of Commons.","反對黨領袖所屬政黨如果在下次大選勝出，他通常會成為首相。"],["f3b3aef","s",5,"What does the CBI (Confederation of British Industry) represent?",["British business","Trade unions","Local councils","Environmental groups"],"It is an example of a pressure and lobby group.","CBI（Confederation of British Industry）代表英國商界，是壓力團體的例子。"],["e7e831d","s",5,"To whom are civil servants accountable?",["Ministers","The monarch","The Speaker","Judges"],"Civil servants support the government in developing and implementing its policies.","公務員向大臣負責。"],["0f17322","s",5,"What are democratically elected local councils often called?",["Local authorities","Devolved administrations","Constituencies","Parish assemblies"],"Some areas have both district and county councils, which have different functions.","民選的地方議會常稱為 local authorities（地方政府）。"],["f4b8b8e","s",5,"What is the role of the mayor that many local authorities appoint?",["The ceremonial leader of the council","The chief of the local police","The judge of the local court","The head of the civil service"],"In some towns, a mayor is elected to be the effective leader of the administration.","很多地方政府委任市長作為議會的禮儀領袖；部分城鎮的市長則由選舉產生，是實際的行政首長。"],["50f1c58","s",5,"Since which year have some powers been devolved from the central government?",["1997","1973","1982","2010"],"The aim was to give people in Wales, Scotland and Northern Ireland more control over matters that directly affect them.","自 1997 年起，中央政府把部分權力下放。"],["93fc352","m",5,"In which TWO areas does the Senedd have the power to make laws for Wales?",["Education and training","Health and social services","Defence","Foreign affairs"],"Economic development and housing are other examples.","Senedd 可就教育及培訓、醫療及社會服務等範疇為威爾斯立法；國防和外交仍由英國中央政府負責。"],["166740e","t",5,"Since 2011, the Welsh Parliament has been able to pass laws in its areas of responsibility without the agreement of the UK Parliament.",1,"It was first set up in 1999 as the National Assembly for Wales.","自 2011 年起，威爾斯議會可以在其職權範圍內自行立法，毋須英國國會同意。"],["514c510","s",5,"In which year was the Scottish Parliament formed?",["1999","1707","1973","2011"],"It sits in Edinburgh, the capital city of Scotland.","蘇格蘭議會於 1999 年成立，位於愛丁堡。"],["7af3b16","s",5,"In which year was a Northern Ireland Parliament first established?",["1922","1801","1972","1998"],"It was established when Ireland was divided, and was abolished in 1972.","北愛爾蘭議會最初於 1922 年愛爾蘭分治時成立，1972 年被廢除。"],["00f1082","m",5,"On which TWO matters can the Northern Ireland Assembly make decisions?",["Education","Agriculture","Defence","Immigration"],"It can also make decisions on the environment, health and social services.","北愛爾蘭議會可就教育和農業等事務作決定，亦包括環境、醫療和社會服務。"],["30327b7","s",5,"What does MLA stand for?",["Member of the Legislative Assembly","Minister for Local Affairs","Member of the Lords' Appointments","Mayor of the Local Authority"],"MLAs are the elected members of the Northern Ireland Assembly.","MLA 即 Member of the Legislative Assembly，是北愛爾蘭議會的民選議員。"],["ca96881","s",5,"What does it mean that the UK has a free press?",["What is written in newspapers is free from government control","Newspapers are given away without charge in every town and city","Newspapers do not have to pay tax","Journalists may enter any building"],"Newspaper owners and editors can hold strong political opinions and run campaigns.","新聞自由是指報章的內容不受政府控制。"],["e5c412b","s",5,"What is the present voting age in the UK?",["18","16","17","21"],"It was set in 1969.","英國現時的投票年齡是 18 歲，於 1969 年訂立。"],["84137eb","s",5,"Where can the public view the electoral register?",["At the local electoral registration office","At any police station in your constituency","At the nearest Crown Court","At the Houses of Parliament only"],"It is also possible to see it at some public buildings such as libraries.","公眾可以在當地的選民登記辦事處查閱選民登記冊，部分圖書館等公共建築亦可查閱。"],["639318a","s",5,"What can you do if it is difficult for you to get to a polling station?",["Register for a postal ballot","Vote by telephone","Ask the police to collect your vote","Vote at any post office"],"Your ballot paper will be sent to your home before the election.","如果不便前往投票站，可以登記郵寄投票，選票會在選舉前寄到你家。"],["feb6e0a","s",5,"What does a poll card tell you?",["Where your polling station is and when the election will take place","Which of the candidates you are allowed to vote for in your area","How many votes each party received last time","The result of the election in your area"],"It is sent to you before the election.","投票通知卡會告訴你投票站的位置和選舉日期。"],["6ec4b7b","s",5,"At the polling station, where do you fill in your ballot paper?",["In a polling booth","At the staff desk","Outside the building","In the ballot box"],"You then fold it and put it in the ballot box. You should not write anything else on the paper.","在投票站，你要在投票間內填寫選票，然後放入投票箱。"],["37f4946","s",5,"From what age can most citizens of the UK, the Irish Republic or the Commonwealth stand for public office?",["18","16","21","25"],"There are some exceptions, such as members of the armed forces and civil servants.","英國、愛爾蘭共和國或英聯邦的公民一般年滿 18 歲便可以參選公職。"],["4f44afa","m",5,"Which TWO are core values of the Commonwealth?",["Democracy","The rule of law","Free trade","A single currency"],"Good government is the third core value.","民主和法治都是英聯邦的核心價值，另一項是良好管治。"],["0b962d3","t",5,"The Commonwealth has the power to suspend the membership of a country.",1,"It has no other power over its members, and membership is voluntary.","英聯邦可以暫停成員國的資格，但除此之外無權管轄成員國。"],["f613687","s",5,"Which is the most well-known convention drawn up by the Council of Europe?",["The European Convention on Human Rights","The Geneva Convention","The Treaty of Rome","The Charter of the United Nations"],"The Council of Europe draws up conventions and charters but has no power to make laws.","Council of Europe 最著名的公約是《歐洲人權公約》。"],["e0514e3","s",5,"About how many countries are members of the United Nations?",["More than 190","About 50","Exactly 100","Fewer than 30"],"The UN was set up after the Second World War.","聯合國有超過 190 個成員國。"],["417841e","t",5,"Every person in the UK receives equal treatment under the law.",1,"The law applies in the same way to everyone, no matter who they are or where they are from.","在英國，法律面前人人平等。"],["ade3b33","s",5,"Where is it against the law to smoke tobacco products?",["In nearly all enclosed public places","Only in schools and hospitals","Anywhere outside your own home","Only on public transport"],"There are signs displayed to tell you where you cannot smoke.","在差不多所有室內公眾場所吸煙都屬違法。"],["6cccc96","t",5,"In alcohol-free zones, the police can confiscate alcohol or move young people on from public places.",1,"You can be fined or arrested.","在禁酒區內，警方可以沒收酒精飲品或要求年青人離開公眾地方。"],["d534d17","s",5,"If something goes wrong and you want to complain about the police, what can you do?",["Go to a police station or write to the Chief Constable","Write to the Speaker of the House of Commons","Complain only through a solicitor in court","Contact the nearest Magistrates' Court"],"Complaints can also be made to an independent body.","如果想投訴警方，可以前往警署或致函該警隊的 Chief Constable。"],["1ed9231","s",5,"In Northern Ireland, which independent body deals with complaints about the police?",["The Police Ombudsman for Northern Ireland","The Northern Ireland Human Rights Commission","The Northern Ireland Assembly","The Court of Session"],"England and Wales, and Scotland, have their own independent bodies.","在北愛爾蘭，投訴警方由 Police Ombudsman for Northern Ireland 處理。"],["cbf439a","s",5,"What can judges do if a public body is not respecting someone's legal rights?",["Order it to change its practices and/or pay compensation","Close the public body down and dismiss all of its staff","Send its staff to prison without a trial","Ask Parliament to pass a new law"],"Judges also make decisions in disputes between members of the public or organisations.","如果公共機構沒有尊重某人的法律權利，法官可以命令它改變做法及／或作出賠償。"],["0a80f70","s",5,"Who supports magistrates and Justices of the Peace in their work?",["A legal adviser","A jury","A police officer","A Member of Parliament"],"They do not need legal qualifications but receive training to do the job.","裁判官和太平紳士有法律顧問協助。"],["f258099","s",5,"In Scotland, where are serious criminal cases heard with either a sheriff or a sheriff with a jury?",["In a Sheriff Court","In a Crown Court","In a Magistrates' Court","In a County Court"],"The most serious cases, such as murder, are heard at a High Court with a judge and jury.","在蘇格蘭，嚴重刑事案件在 Sheriff Court 由 sheriff 或 sheriff 聯同陪審團審理。"],["188aff2","s",5,"Who may be excused from jury service when summoned?",["People who are not eligible or who have a good reason such as ill health","Anyone who would rather not take time away from their job or their family","Anyone who has lived in the area for less than a year","People who do not agree with the law being applied"],"Everyone else who is summoned must do jury service.","獲傳召出任陪審員的人，除非不符合資格（例如有刑事定罪）或有充分理由（例如健康欠佳），否則必須出任。"],["b60f25a","t",5,"The parents or carers of a young person appearing in a Youth Court are expected to attend the hearing.",1,"The most serious cases will go to the Crown Court.","少年法庭開庭時，被告的父母或照顧者應當出席。"],["83fcfcc","m",5,"Which TWO documents are part of Britain's long history of respecting an individual's rights?",["The Magna Carta","The Bill of Rights of 1689","The Domesday Book","The Statute of Rhuddlan"],"The Habeas Corpus Act is another.","《大憲章》和 1689 年的《權利法案》都是英國尊重個人權利的悠久傳統的一部分，Habeas Corpus Act 亦然。"],["a5b6783","m",5,"Which TWO freedoms are protected by the Human Rights Act?",["Freedom of thought, conscience and religion","Freedom of expression","Freedom from paying taxes","Freedom to carry weapons"],"The Act also includes the right to liberty and security and the right to a fair trial.","思想、良心和宗教自由，以及表達自由，都受 Human Rights Act 保障。"],["4da0804","s",5,"Where can victims of domestic violence find a safe place to stay?",["In refuges or shelters","In any police station","In the Magistrates' Court","In council offices"],"It is important for anyone facing domestic violence to get help as soon as possible.","家庭暴力的受害人可以到庇護所（refuges 或 shelters）暫住。"],["882aa7f","s",5,"What is the maximum time someone can be jailed for breaching a Forced Marriage Protection Order?",["Two years","Six months","Five years","Ten years"],"Breaching an order is contempt of court.","違反 Forced Marriage Protection Order 屬藐視法庭，最高可判監兩年。"],["b61d0e4","m",5,"Which TWO government services are paid for with money raised from income tax?",["Roads","The armed forces","The National Lottery","The National Trust"],"Education and the police are also paid for in this way.","入息稅收入用於道路、軍隊、教育和警隊等政府服務。"],["6d658bf","s",5,"What can happen to someone who does not pay enough National Insurance Contributions?",["They will not be able to receive certain contributory benefits","They will lose the right to vote in General Elections until they pay","They will have to leave their job","They will not be able to use the NHS at all"],"Examples are Jobseeker's Allowance and a full state retirement pension.","國民保險供款不足的人，將不能領取某些供款性福利，例如 Jobseeker's Allowance 或全額國家退休金。"],["6ee2533","s",5,"How do employees pay their National Insurance Contributions?",["Their employer deducts them from their pay","They pay them at the post office each week","They are added to their council tax bill","They pay once a year at the bank"],"People who are self-employed need to pay the contributions themselves.","僱員的國民保險供款由僱主從薪金中扣除；自僱人士則要自行繳交。"],["a57caf9","s",5,"What does the driving test check?",["Both your knowledge and your practical skills","Only your knowledge of road signs","Only your ability to park a car","Only your eyesight and reaction time"],"You must pass it to get a UK driving licence.","駕駛考試會測試你的知識和實際駕駛技術。"],["f359b38","s",5,"How old must you be to ride a moped in the UK?",["16","14","17","18"],"You must be at least 17 to drive a car or motorcycle.","在英國駕駛 moped（輕便電單車）必須年滿 16 歲。"],["a7256e2","s",5,"After the age of 70, for how long is a driving licence valid at a time?",["Three years","One year","Five years","Ten years"],"Drivers can use their driving licence until they are 70.","70 歲之後，駕駛執照每次有效期為三年。"],["643b897","s",5,"What must you do if you have a car which is not being used on the road?",["Inform the DVLA with a Statutory Off Road Notification (SORN)","Hand your driving licence in at the nearest police station","Cancel the registration of the car","Take the car for an extra MOT test"],"If your car is being used, you must pay the annual vehicle tax.","如果汽車不在道路上使用，必須向 DVLA 提交 SORN（Statutory Off Road Notification）。"],["e1d0909","t",5,"If you have a driving licence from a country in the European Union, you can drive in the UK for as long as your licence is valid.",1,"The same applies to licences from Iceland, Liechtenstein and Norway.","持有歐盟國家的駕駛執照，在執照有效期內可以在英國駕駛。"],["e6be2cf","s",5,"What do parent–teacher associations (PTAs) often do?",["Organise events to raise money for extra equipment or activities","Decide which pupils are admitted to the school each September","Set the salaries of the teachers","Write the national examination papers"],"Parents can also help in classrooms and by /* ---------- cloud (per-person document, optional) ---------- */
const cloud = {ref:null, dirty:false, writing:false, timer:null, fails:0, pulled:0};
function setSync(v){ S.sync = v; const el = document.getElementById('sync'); if (el) el.innerHTML = syncHTML(); }
function syncHTML(){ return '<span class="dot' + (S.sync === 'ok' ? ' ok' : '') + '"></span>' + esc(t('sync.' + S.sync)); }
function timeout(p, ms){ return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(Object.assign(new Error('timeout'), {code:'unavailable'})), ms))]); }

async function initCloud(){
  try {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') { setSync('local'); return; }
    const pair = await Promise.all([c.use('db'), c.use('user')]);
    const db = pair[0], user = pair[1];
    if (!db || !user || typeof user.id !== 'function') { setSync('local'); return; }
    const id = await user.id();
    if (!id) { setSync('local'); return; }
    cloud.ref = db.doc('data/users/' + id + '/progress');
    await pull();
  } catch (e) { cloud.ref = null; setSync('local'); }
}
async function readRemote(){
  try { return snapData(await timeout(cloud.ref.get(), 10000)); }
  catch (e) { if (e && (e.code === 'not_found' || e.code === 'not-found')) return null; throw e; }
}
async function pull(){
  if (!cloud.ref) return;

      if (ms !== sig(P)) { P = merged; store.set(K.prog, P); if (S.view !== 'test' && S.view !== 'result' && !M.open) render(); }

}

}

/* ---------- question statistics and selection ---------- */
const today = () => Math.floor(Date.now() / 864e5);
const isWeak = q => { const s = P.s[q.id]; return !!s && s[1] > 0 && s[2] < 2; };
const isMastered = q => { const s = P.s[q.id]; return !!s && s[2] >= 2; };
function record(q, ok){
  const s = P.s[q.id] || [0, 0, 0, 0];
  s[0]++; if (ok) s[2]++; else { s[1]++; s[2] = 0; }
  s[3] = today(); P.s[q.id] = s;
}
function shuffle(arr, rnd){

}
function wsample(pool, n, w){

}
function pickMock(){
  let out = [];
  for (const ch in QUOTA) out = out.concat(shuffle(Q.filter(q => q.ch === +ch)).slice(0, QUOTA[ch]));
  return shuffle(out);
}
function pickWeak(){
  const weak = Q.filter(isWeak);
  const a = wsample(weak, Math.min(PAPER / 2, weak.length), q => {
    const s = P.s[q.id];
    return 1 + Math.min(s[1], 5) + (s[2] === 0 ? 2 : 0) + Math.min(Math.max(today() - s[3], 0), 7) * 0.3;
  });
  const got = new Set(a);

    const s = P.s[q.id];
    const w = !s ? 3 : isWeak(q) ? 1 : s[2] >= 2 ? 0.4 : 1.5;
    return w * QUOTA[q.ch] / CHN[q.ch] * 100;

}
function pickChapter(ch){

}
function hash(str){ let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

function revItem(q, a, num, seed){
  const ok = isRight(q, a), rs = rightSet(q);
  let h = '<li class="rev ' + (ok ? 'ok' : 'bad') + '"><div class="revhead">' + (num ? '<b>' + num + '</b>' : '') + '<span class="tag">' + esc(t(ok ? 'res.right' : a.length ? 'res.wrongTag' : 'res.none')) + '</span><span>' + esc(t('res.ch', {n:q.ch})) + '</span></div>' +
    stem(q) + '<p class="qtext sm" lang="en-GB">' + esc(q.q) + '</p><ul class="ropts">';
  order(seed, q).forEach(oi => {
    const right = rs.includes(oi), sel = a.includes(oi);
    h += '<li class="' + (right ? 'right' : sel ? 'wrong' : '') + '"><span lang="en-GB">' + esc(optText(q, oi)) + '</span>' +
      (right ? '<span class="mark ok">' + esc(t('test.answer')) + (sel ? ' · ' + esc(t('res.yours')) : '') + '</span>' : sel ? '<span class="mark bad">' + esc(t('res.yours')) + '</span>' : '') + '</li>';
  });
  return h + '</ul>' + expHTML(q) + '</li>';
}
function vResult(){
  const r = S.res, need = Math.ceil(r.n * PASS_RATE), pass = r.sc >= need;
  let h = '<header class="mast"><h1>' + esc(kindLabel(r)) + '</h1><p class="sub">' + esc(fmtDate(r.t)) + ' · ' + esc(t('fb.' + (r.f === 'i' ? 'i' : 'e'))) + '</p></header>';
  h += '<section class="card paper"><div class="score"><div class="big">' + r.sc + '<small> / ' + r.n + '</small></div>' +
    '<div class="stamp ' + (pass ? 'pass' : 'fail') + '">' + (S.set.lang === 'zh' ? (pass ? 'PASS' : 'FAIL') + '<br>' : '') + esc(t(pass ? 'res.pass' : 'res.fail')) + '</div></div>' +
    '<div class="meta"><span>' + Math.round(100 * r.sc / r.n) + '%</span><span>' + esc(t('res.need', {n:need})) + '</span><span>' + esc(t('res.time', {t:fmt(r.d || 0)})) + '</span>' + (r.to ? '<span>' + esc(t('res.timeout')) + '</span>' : '') + '</div>' +
    '<div class="cardfoot"><button class="btn ghost" id="btn-home" data-act="home">' + esc(t('res.home')) + '</button><button class="btn" id="btn-again" data-act="again">' + esc(t('res.again')) + '</button></div></section>';
  if (!r.q || !r.a) return h + '<section class="card"><p class="muted">' + esc(t('res.nodetail')) + '</p></section>';
  const rows = [];
  r.q.forEach((id, i) => { const q = BYID.get(id); if (q) rows.push({q, a:String(r.a[i] || '').split('').map(Number), num:i + 1}); });
  h += '<section class="card"><h2>' + esc(t('res.byCh')) + '</h2><div class="chlist">';
  for (let ch = 1; ch <= 5; ch++) {
    const rs = rows.filter(x => x.q.ch === ch); if (!rs.length) continue;
    const ok = rs.filter(x => isRight(x.q, x.a)).length;
    h += '<div class="chrow"><div><b>' + ch + '. ' + esc(chName(ch)) + '</b></div><b>' + ok + ' / ' + rs.length + '</b><div class="meter" aria-hidden="true"><i class="m" style="width:' + (100 * ok / rs.length) + '%"></i></div></div>';
  }
  h += '</div></section>';
  const wrong = rows.filter(x => !isRight(x.q, x.a)), list = S.resFilter === 'all' ? rows : wrong;
  h += '<section><h2>' + esc(t('res.review')) + '</h2><div class="chips">' +
    '<button class="chip" id="flt-wrong" data-act="filter" data-f="wrong" aria-pressed="' + (S.resFilter !== 'all') + '">' + esc(t('res.wrong', {n:wrong.length})) + '</button>' +
    '<button class="chip" id="flt-all" data-act="filter" data-f="all" aria-pressed="' + (S.resFilter === 'all') + '">' + esc(t('res.all', {n:rows.length})) + '</button></div>';
  h += list.length ? '<ol class="revlist">' + list.map(x => revItem(x.q, x.a, x.num, r.t)).join('') + '</ol>' : '<p class="muted" style="margin-top:12px">' + esc(t('res.allRight')) + '</p>';
  return h + '</section>';
}
function vWeak(){
  const all = Q.filter(isWeak).sort((a, b) => P.s[b.id][1] - P.s[a.id][1] || a.ch - b.ch);
  const list = S.weakCh ? all.filter(q => q.ch === S.weakCh) : all;
  let h = mast() + '<section class="card"><h2>' + esc(t('wk.title')) + '</h2><p class="muted">' + esc(t('wk.desc')) + '</p>';
  if (!all.length) return h + '<p style="margin-top:12px">' + esc(t('wk.empty')) + '</p></section>' + footHTML();
  h += '<div class="cardfoot"><span></span><button class="btn" id="start-weak2" data-act="start" data-kind="w">' + esc(t('wk.start')) + '</button></div></section>';
  h += '<div class="chips"><button class="chip" id="wk-all" data-act="weakch" data-ch="0" aria-pressed="' + (!S.weakCh) + '">' + esc(t('wk.all', {n:all.length})) + '</button>';
  for (let ch = 1; ch <= 5; ch++) { const c = all.filter(q => q.ch === ch).length; if (c) h += '<button class="chip" id="wk-ch-' + ch + '" data-act="weakch" data-ch="' + ch + '" aria-pressed="' + (S.weakCh === ch) + '">' + esc(t('res.ch', {n:ch})) + '（' + c + '）</button>'; }
  h += '</div><ul class="revlist">' + list.map(q => {
    const s = P.s[q.id];
    return '<li class="rev bad"><div class="revhead"><span class="tag">' + esc(t('wk.stat', {w:s[1], s:s[0]})) + '</span><span>' + esc(t('res.ch', {n:q.ch})) + '</span></div>' + stem(q) + '<p class="qtext sm" lang="en-GB">' + esc(q.q) + '</p><ul class="ropts">' +
      rightSet(q).map(oi => '<li class="right"><span lang="en-GB">' + esc(optText(q, oi)) + '</span><span class="mark ok">' + esc(t('test.answer')) + '</span></li>').join('') + '</ul>' + expHTML(q) + '</li>';
  }).join('') + '</ul>';
  return h + footHTML();
}
function vHistory(){
  let h = mast() + '<section class="card"><h2>' + esc(t('hs.title')) + '</h2>';
  if (!P.h.length) return h + '<p class="muted" style="margin-top:8px">' + esc(t('hs.empty')) + '</p></section>' + footHTML();
  h += P.h.slice().reverse().map(r => {
    const pass = r.sc >= Math.ceil(r.n * PASS_RATE);
    return '<div class="hrow"><div><b>' + esc(kindLabel(r)) + '</b><br><span class="muted small">' + esc(fmtDate(r.t)) + '</span></div>' +
      '<div><b>' + r.sc + ' / ' + r.n + '</b> <span class="pill ' + (pass ? 'pass' : 'fail') + '">' + esc(t(pass ? 'res.pass' : 'res.fail')) + '</span></div>' +
      '<button class="btn sm ghost" data-act="open" data-t="' + r.t + '">' + esc(t('hs.view')) + '</button></div>';
  }).join('');
  return h + '</section>' + footHTML();
}
function radios(name, cur, opts){
  return '<div class="seg" role="radiogroup" aria-labelledby="lbl-' + name + '">' + opts.map(o =>
    '<label><input type="radio" name="set-' + name + '" id="set-' + name + '-' + o[0] + '" value="' + o[0] + '" data-set="' + name + '"' + (String(cur) === String(o[0]) ? ' checked' : '') + '><span>' + esc(o[1]) + '</span></label>').join('') + '</div>';
}
function vSettings(){
  return mast() + '<section class="card"><h2>' + esc(t('set.title')) + '</h2>' +
    '<div class="setrow"><span class="lbl" id="lbl-lang">' + esc(t('set.lang')) + '</span>' + radios('lang', S.set.lang, [['zh', '中文'], ['en', 'English']]) + '</div>' +
    '<div class="setrow"><span class="lbl" id="lbl-zh">' + esc(t('set.zh')) + '</span>' + radios('zh', zhOn() ? 1 : 0, [[1, t('set.zhOn')], [0, t('set.zhOff')]]) + '<p class="muted small">' + esc(t('set.zhHint')) + '</p></div>' +
    '<div class="setrow"><span class="lbl" id="lbl-theme">' + esc(t('set.theme')) + '</span>' + radios('theme', S.set.theme, [['auto', t('th.auto')], ['light', t('th.light')], ['dark', t('th.dark')]]) + '</div>' +
    '<div class="setrow"><span class="lbl">' + esc(t('set.sync')) + '</span><p id="sync" style="margin-top:0">' + syncHTML() + '</p></div>' +
    '<div class="setrow"><span class="lbl">' + esc(t('io.title')) + '</span><p class="muted small" style="margin:0 0 10px">' + esc(t('io.hint')) + '</p>' +
      '<div class="acts" style="margin-top:0"><button class="btn sm" id="btn-export" data-act="exp">' + esc(t('io.export')) + '</button></div>' +
      '<div id="exp-box" hidden style="margin-top:10px"><textarea id="exp-text" class="iobox" readonly rows="5"></textarea>' +
      '<div class="acts" style="margin-top:8px"><button class="btn sm ghost" id="btn-copy" data-act="copyexp">' + esc(t('io.copy')) + '</button>' +
      (inArtifact() ? '' : '<button class="btn sm ghost" id="btn-dl" data-act="dlexp">' + esc(t('io.download')) + '</button>') + '</div></div>' +
      '<label class="lbl" for="imp-file" style="margin-top:16px">' + esc(t('io.file')) + '</label><input type="file" id="imp-file" accept=".json,.txt,application/json,text/plain">' +
      '<label class="lbl" for="imp-text" style="margin-top:10px">' + esc(t('io.paste')) + '</label><textarea id="imp-text" class="iobox" rows="4"></textarea>' +
      '<div class="acts" style="margin-top:8px"><button class="btn sm" id="btn-import" data-act="imp">' + esc(t('io.import')) + '</button></div>' +
      '<p class="small" id="io-msg" role="status" style="margin-top:8px"></p></div>' +
    '<div class="setrow"><button class="btn danger" id="btn-reset" data-act="reset">' + esc(t('set.reset')) + '</button><p class="muted small">' + esc(t('set.resetHint')) + '</p></div></section>' +
    '<footer class="foot"><p>' + esc(t('foot.note')) + '</p></footer>';
}
function render(){
  document.documentElement.lang = uiLang();
  if (S.view === 'test' && !S.ses) S.view = 'home';
  if (S.view === 'result' && !S.res) S.view = 'home';
  app.innerHTML = S.view === 'test' ? vTest() : S.view === 'result' ? vResult() : S.view === 'weak' ? vWeak() : S.view === 'history' ? vHistory() : S.view === 'settings' ? vSettings() : vHome();
}
function show(v){
  S.view = v;
  if (HASHV.includes(v) && location.hash !== '#' + v) { try { location.hash = v; return; } catch (e) {} }
  render(); window.scrollTo(0, 0);
}
function applyTheme(){
  const th = S.set.theme;
  if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th);
  else document.documentElement.removeAttribute('data-theme');
}

/* ---------- modal ---------- */
function modal(o){
  M.open = true; M.onOk = o.onOk; M.back = document.activeElement;
  mroot.innerHTML = '<div class="modal-bg" data-act="modal-cancel"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">' + esc(o.title) + '</h2><p>' + esc(o.body) + '</p>' +
    '<div class="row"><button class="btn ghost" id="modal-cancel" data-act="modal-cancel">' + esc(o.cancel) + '</button><button class="btn' + (o.danger ? ' danger' : '') + '" id="modal-ok" data-act="modal-ok">' + esc(o.ok) + '</button></div></div></div>';
  const b = document.getElementById('modal-ok'); if (b) b.focus();
}
function closeModal(){
  if (!M.open) return;
  M.open = false; M.onOk = null; mroot.innerHTML = '';
  if (M.back && document.contains(M.back) && M.back.focus) M.back.focus();
}

/* ---------- test interactions ---------- */
function choose(oi){
  const z = S.ses; if (!z || S.view !== 'test') return;
  const k = z.cur, q = BYID.get(z.q[k]); if (z.chk[k]) return;
  let a = z.ans[k];
  if (q.type === 'm') {
    if (a.includes(oi)) a = a.filter(x => x !== oi);
    else if (a.length < 2) a = a.concat(oi);
    else { const hEl = document.getElementById('hint'); if (hEl) { hEl.classList.add('flash'); setTimeout(() => hEl.classList.remove('flash'), 1200); } }
  } else a = [oi];
  z.ans[k] = a; saveSes(); syncOpts();
}
function syncOpts(){
  const z = S.ses, k = z.cur, q = BYID.get(z.q[k]), a = z.ans[k];
  document.querySelectorAll('#opts input').forEach(inp => {
    const on = a.includes(+inp.value); inp.checked = on;
    inp.closest('.opt').classList.toggle('sel', on);
  });
  const c = document.getElementById('btn-check'); if (c) c.disabled = !ready(q, a);
  const cell = document.getElementById('cell-' + k); if (cell) cell.className = cellCls(z, k);
  const bar = document.getElementById('bar'); if (bar) bar.style.width = (100 * answered(z) / z.q.length) + '%';
}
function goto(i){
  const z = S.ses; if (!z) return;
  z.cur = Math.max(0, Math.min(z.q.length - 1, i)); saveSes(); render(); window.scrollTo(0, 0);
  const qh = document.getElementById('qh'); if (qh) qh.focus({preventScroll:true});
}
function check(){
  const z = S.ses, i = z.cur, q = BYID.get(z.q[i]);
  if (z.chk[i] || !ready(q, z.ans[i])) return;
  z.chk[i] = 1; record(q, isRight(q, z.ans[i])); saveSes(); saveProg(false); render();
  const f = document.getElementById('fbk'); if (f) { f.focus({preventScroll:true}); if (f.scrollIntoView) f.scrollIntoView({block:'nearest'}); }
}
function askFinish(){
  const z = S.ses, un = z.q.length - z.ans.filter(a => a.length).length;
  modal({title:t('m.finish.title'), body:un ? t('m.finish.un', {n:un}) : t('m.finish.all'), ok:t('m.finish.ok'), cancel:t('m.back'), onOk:() => finish(false)});
}
function askQuit(){
  const z = S.ses;
  modal({title:t('m.quit.title'), body:t(z.fb === 'i' ? 'm.quit.i' : 'm.quit.e'), ok:t('m.quit.ok'), cancel:t('m.back'), danger:true, onOk:quit});
}
function begin(kind, ch){
  if (S.ses) modal({title:t('m.new.title'), body:t('m.new.body'), ok:t('m.new.ok'), cancel:t('m.cancel'), onOk:() => startSession(kind, ch)});
  else startSession(kind, ch);
}
function inArtifact(){ return /claudeusercontent\.com$/.test(location.hostname) || !!(window.claude && window.claude.use); }
function parseImport(txt){
  let o = JSON.parse(String(txt).trim().replace(/^\uFEFF/, ''));
  if (o && typeof o.p === 'string') o = JSON.parse(o.p);
  else if (o && o.app === 'lituk') o = o.progress;
  if (!valid(o)) throw new Error('bad');
  const s = {};
  for (const k in o.s) { const v = o.s[k]; if (Array.isArray(v) && v.length >= 4 && v.slice(0, 4).every(x => typeof x === 'number')) s[k] = v.slice(0, 4); }
  const h = o.h.filter(x => x && typeof x.t === 'number' && typeof x.sc === 'number' && typeof x.n === 'number' && ['m', 'w', 'c'].includes(x.k));
  return {v:1, r:o.r || 0, s, h};
}
const ACT = {
  start(el){ begin(el.dataset.kind, +el.dataset.ch || 0); },
  resume(){ show('test'); tick(); },
  drop(){ askQuit(); },
  prev(){ goto(S.ses.cur - 1); },
  next(){ goto(S.ses.cur + 1); },
  goto(el){ goto(+el.dataset.i); },
  flag(){ const z = S.ses; z.flag[z.cur] = z.flag[z.cur] ? 0 : 1; saveSes(); render(); const b = document.getElementById('btn-flag'); if (b) b.focus(); },
  check(){ check(); },
  finish(){ askFinish(); },
  quit(){ askQuit(); },
  home(){ show('home'); },
  again(){ const r = S.res; begin(r.k, r.c || 0); },
  filter(el){ S.resFilter = el.dataset.f; render(); const b = document.getElementById('flt-' + S.resFilter); if (b) b.focus(); },
  weakch(el){ S.weakCh = +el.dataset.ch; render(); },
  open(el){ const r = P.h.find(x => String(x.t) === el.dataset.t); if (r) { S.res = r; S.resFilter = 'wrong'; show('result'); } },
  exp(){
    const box = document.getElementById('exp-box'), ta = document.getElementById('exp-text');
    ta.value = JSON.stringify({app:'lituk', v:1, exported:Date.now(), progress:P, settings:S.set});
    box.hidden = false; ta.focus(); ta.select();
  },
  copyexp(){
    const ta = document.getElementById('exp-text'), msg = document.getElementById('io-msg');
    const ok = () => { msg.textContent = t('io.copied'); };
    const manual = () => { ta.focus(); ta.select(); let done = false; try { done = document.execCommand('copy'); } catch (e) {} msg.textContent = t(done ? 'io.copied' : 'io.copyFail'); };
    try { navigator.clipboard.writeText(ta.value).then(ok, manual); } catch (e) { manual(); }
  },
  dlexp(){
    const ta = document.getElementById('exp-text');
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ta.value], {type:'application/json'})); a.download = 'lituk-backup-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(a); a.click(); a.remove(); } catch (e) {}
  },
  imp(){
    const msg = document.getElementById('io-msg'); let inc;
    try { inc = parseImport(document.getElementById('imp-text').value); } catch (e) { msg.textContent = t('io.bad'); return; }
    const have = new Set(P.h.map(h => h.t));
    modal({title:t('m.imp.title'), body:t('m.imp.body', {h:inc.h.length, nh:inc.h.filter(h => !have.has(h.t)).length, s:Object.keys(inc.s).length}), ok:t('m.imp.ok'), cancel:t('m.cancel'), onOk:() => {
      inc.r = P.r || 0; P = merge(P, inc); saveProg(true); render();
      const m = document.getElementById('io-msg'); if (m) m.textContent = t('io.done');
    }});
  },
  reset(){
    modal({title:t('m.reset.title'), body:t('m.reset.body'), ok:t('m.reset.ok'), cancel:t('m.cancel'), danger:true, onOk:() => {
      P = blank(Date.now()); S.ses = null; S.res = null; saveSes(); saveProg(true); render();
    }});
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest ? e.target.closest('[data-act]') : null; if (!el) return;
  const a = el.dataset.act;
  if (a === 'modal-cancel') { if (el.classList.contains('modal-bg') && e.target !== el) return; closeModal(); return; }
  if (a === 'modal-ok') { const fn = M.onOk; closeModal(); if (fn) fn(); return; }
  if (el.disabled) return;
  if ((a === 'prev' || a === 'next' || a === 'goto' || a === 'flag' || a === 'check' || a === 'finish' || a === 'quit') && !S.ses) return;
  if (ACT[a]) ACT[a](el);
});
document.addEventListener('change', e => {
  const el = e.target; if (!el || !el.dataset) return;
  if (el.name === 'opt') { choose(+el.value); return; }
  if (el.dataset.fb) { S.set.fb[el.dataset.fb] = el.value === 'i' ? 'i' : 'e'; saveSet(); return; }
  if (el.id === 'imp-file' && el.files && el.files[0]) {
    const r = new FileReader();
    r.onload = () => { const ta = document.getElementById('imp-text'); if (ta) ta.value = String(r.result || ''); };
    r.readAsText(el.files[0]); return;
  }
  if (el.dataset.set) {
    const k = el.dataset.set;
    if (k === 'lang') S.set.lang = el.value === 'en' ? 'en' : 'zh';
    if (k === 'zh') S.set.zh = el.value === '1';
    if (k === 'theme') S.set.theme = el.value;
    saveSet(); applyTheme(); render();
    const b = document.getElementById(el.id); if (b) b.focus();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && M.open) { closeModal(); return; }
  if (S.view !== 'test' || M.open || !S.ses || e.metaKey || e.ctrlKey || e.altKey) return;
  const n = ['1', '2', '3', '4'].indexOf(e.key); if (n < 0) return;
  const z = S.ses, q = BYID.get(z.q[z.cur]), ord = order(z.id, q);
  if (n < ord.length) { choose(ord[n]); e.preventDefault(); }
});
window.addEventListener('hashchange', () => {
  const v = location.hash.slice(1);
  if (HASHV.includes(v)) { closeModal(); S.view = v; render(); window.scrollTo(0, 0); }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { if (cloud.dirty) { clearTimeout(cloud.timer); flushCloud(); } }
  else if (cloud.ref && Date.now() - cloud.pulled > 5 * 60 * 1000 && !cloud.writing) pull();
});
function tick(){
  if (S.view !== 'test' || !S.ses || !S.ses.limit) return;
  const r = remaining();
  if (r <= 0) { closeModal(); finish(true); return; }
  const el = document.getElementById('timer');
  if (el) { el.textContent = fmt(r); el.classList.toggle('low', r <= 300); }
}
setInterval(tick, 500);

/* ---------- boot ---------- */
let booted = false;
function boot(data){
  if (booted) return; booted = true;
  loadLocal(); applyTheme();
  const hv = location.hash.slice(1);
  S.view = HASHV.includes(hv) ? hv : 'home';
  if (data && data.view === 'test' && S.ses) S.view = 'test';
  render();
  initCloud();
}
try { const hot = window.claude && window.claude.hot; if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({view:S.view})); } catch (e) {}
try {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.ready === 'function') { hot.ready(boot); setTimeout(() => boot({}), 1500); }
  else boot(hot && hot.data ? hot.data : {});
} catch (e) { boot({}); }
})();
</script>
</body>
