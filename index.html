948 年才成立。"],["ed7175f","s",3,"Whose assassination on 28 June 1914 set off a chain of events leading to the First World War?",["Archduke Franz Ferdinand of Austria","Emperor Napoleon III of France","Tsar Nicholas II of Russia and his family","Kaiser Wilhelm II of Germany"],"The assassination triggered the war, but other factors such as nationalism and militarism were also behind it.","1914 年 6 月 28 日奧地利 Archduke Franz Ferdinand 遇刺，引發連串事件導致第一次世界大戰。"],["d2c0875","m",3,"Which TWO of these were Central Powers, fighting against Britain in the First World War?",["Germany","The Ottoman Empire","France","Russia"],"The Central Powers were mainly Germany, the Austro-Hungarian Empire and the Ottoman Empire, later joined by Bulgaria.","同盟國主要有德國、奧匈帝國和鄂圖曼帝國，後來保加利亞加入。法國和俄國是英國的盟友。"],["f8b94c4","s",3,"More than a million people from which country fought on behalf of Britain in the First World War?",["India","China","Brazil","Egypt"],"Around 40,000 Indians were killed. Men from the West Indies, Africa, Australia, New Zealand and Canada also fought.","第一次世界大戰期間有超過一百萬印度人為英國作戰，約四萬人陣亡。"],["809a318","s",3,"About how many British casualties were there on the first day of the attack on the Somme in July 1916?",["60,000","600","6,000","600,000"],"The British attack on the Somme resulted in about 60,000 casualties on the first day alone.","1916 年 7 月 Somme 戰役第一天，英軍已有約六萬人傷亡。"],["26caa35","s",3,"When did the First World War end?",["At 11.00 am on 11 November 1918","At midnight on 31 December 1918","At noon on 8 May 1945","At 11.00 am on 28 June 1914"],"The war ended with victory for Britain and its allies.","第一次世界大戰於 1918 年 11 月 11 日上午 11 時結束，英國及盟國勝利。"],["8de85ba","s",3,"What was the Easter Rising of 1916?",["An uprising against the British in Dublin","A strike by coal miners in Wales","A protest by the suffragettes in London","A rebellion by the Scottish clans"],"The leaders of the uprising were executed under military law.","1916 年的 Easter Rising 是愛爾蘭民族主義者在都柏林發動的反英起義，領袖其後被處決。"],["cd7819f","s",3,"What happened to Ireland in 1922?",["It became two countries","It joined the United Kingdom","It became a British colony","It was united under one parliament in Belfast"],"Six counties in the north remained part of the UK as Northern Ireland. The rest became the Irish Free State.","1922 年愛爾蘭分成兩個國家：北部六個郡留在英國成為北愛爾蘭，其餘成為 Irish Free State。"],["9b41019","s",3,"In which year did the Irish Free State become a republic?",["1949","1922","1916","1973"],"The Irish Free State had its own government from 1922 and became a republic in 1949.","Irish Free State 於 1949 年成為共和國。"],["36762da","s",3,"In which year did the world enter the Great Depression?",["1929","1914","1939","1951"],"Some parts of the UK suffered mass unemployment, and heavy industries such as shipbuilding were badly affected.","大蕭條始於 1929 年，英國部分地區出現大規模失業。"],["21205a6","s",3,"In which year did the BBC start radio broadcasts?",["1922","1901","1936","1948"],"The BBC began the world's first regular television service in 1936.","BBC 於 1922 年開始電台廣播，1936 年開辦全球第一個定期電視服務。"],["fc919b7","s",3,"In which year did the BBC begin the world's first regular television service?",["1936","1922","1948","1953"],"The BBC started radio broadcasts in 1922 and regular television in 1936.","BBC 於 1936 年開辦全球第一個定期電視服務。"],["2277030","s",3,"Which event led Britain and France to declare war on Germany in 1939?",["Germany invaded Poland","Germany invaded Belgium","Japan bombed Pearl Harbor","Germany bombed London"],"Adolf Hitler had come to power in Germany in 1933.","1939 年德國入侵波蘭，英國和法國因此向德國宣戰。"],["2a8370c","m",3,"Which TWO countries were part of the Axis powers in the Second World War?",["Italy","Japan","Poland","Canada"],"The Axis powers were Germany, Italy and Japan.","軸心國是德國、意大利和日本。"],["83240eb","s",3,"When did Winston Churchill become Prime Minister?",["May 1940","September 1939","June 1944","May 1945"],"Churchill became Prime Minister and Britain's war leader in May 1940.","邱吉爾於 1940 年 5 月出任首相，領導英國作戰。"],["e70366b","s",3,"What was the evacuation of Dunkirk?",["The rescue of more than 300,000 men from the beaches of France","The removal of children from London during the Blitz","The withdrawal of British troops from Singapore","The landing of allied forces in Normandy"],"Many civilian volunteers in small pleasure and fishing boats helped. It gave rise to the phrase 'the Dunkirk spirit'.","Dunkirk 大撤退把超過 30 萬名士兵由法國海灘救回英國，很多平民駕駛小船協助，「Dunkirk spirit」一詞由此而來。"],["2ff48a3","s",3,"What was the Battle of Britain?",["An air battle against Germany in the summer of 1940","A sea battle against the Spanish Armada in 1588","A land battle against Napoleon's army in 1815","The allied landings on the beaches of France in 1944"],"The British won this crucial aerial battle.","Battle of Britain 是 1940 年夏天英國與德國之間的空戰，英國勝出。"],["2aaeaff","m",3,"Which TWO were important British fighter planes in the Battle of Britain?",["The Spitfire","The Hurricane","The Concorde","The Harrier"],"The Spitfire and the Hurricane were designed and built in Britain.","Spitfire 和 Hurricane 是 Battle of Britain 中最重要的英國戰機，兩者都在英國設計和製造。"],["ee59a35","s",3,"What was the Blitz?",["The night-time bombing of London and other British cities","The evacuation of British troops from the beaches of France","The allied invasion of Normandy on 6 June 1944","The British attack on the Somme in July 1916"],"Coventry was almost totally destroyed. The phrase 'the Blitz spirit' is still used today.","Blitz 是德國空軍在晚間轟炸倫敦及其他英國城市，Coventry 幾乎全毀。"],["f10fed2","s",3,"Why did the United States enter the Second World War?",["Japan bombed its naval base at Pearl Harbor","Germany invaded Poland and then France","Italy attacked British forces in North Africa","Germany broke its treaty with the Soviet Union"],"The attack on Pearl Harbor took place in December 1941.","1941 年 12 月日本轟炸美國在珍珠港的海軍基地，美國因此參戰。"],["00f9028","s",3,"What happened on D-Day, 6 June 1944?",["Allied forces landed in Normandy","Germany surrendered","The Battle of Britain began","The evacuation of Dunkirk was completed"],"Following the landings, allied forces pressed on through France and eventually into Germany.","1944 年 6 月 6 日 D-Day，盟軍在法國諾曼第登陸。"],["b44efb2","s",3,"When did the Allies comprehensively defeat Germany?",["May 1945","November 1918","June 1944","August 1947"],"The war against Japan ended in August 1945.","盟軍於 1945 年 5 月徹底擊敗德國，對日戰爭則於同年 8 月結束。"],["d2ed2d7","s",3,"How did the war against Japan end in August 1945?",["The United States dropped atomic bombs on two Japanese cities","British forces recaptured Singapore and Burma","The Soviet Union invaded and occupied Japan","A peace treaty was signed at a conference in London"],"Scientists led by Ernest Rutherford were the first to 'split the atom' and some took part in the Manhattan Project.","1945 年 8 月美國在廣島和長崎投下原子彈，對日戰爭結束。"],["c2f3bf5","s",3,"Who led the scientists at Manchester and then Cambridge University who were the first to 'split the atom'?",["Ernest Rutherford","Alexander Fleming","Alan Turing","Francis Crick"],"Rutherford was born in New Zealand. Some British scientists went on to take part in the Manhattan Project.","Ernest Rutherford 先後在 Manchester 和 Cambridge 大學帶領科學家首次分裂原子。"],["432f820","s",3,"What did Alexander Fleming discover in 1928?",["Penicillin","Insulin","The structure of DNA","Radar"],"It was developed into a usable drug by Howard Florey and Ernst Chain. Fleming won the Nobel Prize in Medicine in 1945.","Alexander Fleming 於 1928 年發現盤尼西林，其後由 Howard Florey 和 Ernst Chain 發展成可用的藥物。"],["aabffef","s",3,"In 2002, who was voted the greatest Briton of all time by the public?",["Winston Churchill","William Shakespeare","Isaac Newton","Queen Victoria"],"Churchill is remembered for his inspiring speeches during the Second World War.","2002 年邱吉爾被公眾選為史上最偉大的英國人。"],["d2e86eb","t",3,"Winston Churchill lost the General Election in 1945 but returned as Prime Minister in 1951.",1,"He was an MP until he stood down at the 1964 General Election.","邱吉爾在 1945 年大選落敗，1951 年再度出任首相。"],["4904086","s",3,"Which party won the General Election in 1945?",["Labour","Conservative","Liberal","National"],"Clement Attlee became Prime Minister and promised to introduce the welfare state outlined in the Beveridge Report.","工黨在 1945 年大選勝出，Clement Attlee 出任首相。"],["919eae7","s",3,"Who was Prime Minister from 1945 to 1951?",["Clement Attlee","Winston Churchill","Harold Macmillan","Margaret Thatcher"],"Attlee had been Churchill's Deputy Prime Minister in the wartime coalition government.","Clement Attlee 於 1945 至 1951 年任首相，戰時曾任邱吉爾的副首相。"],["8a4c772","s",3,"Which minister led the establishment of the National Health Service in 1948?",["Aneurin Bevan","William Beveridge","R A Butler","Clement Attlee"],"Bevan, known as Nye, was the Minister for Health. The NHS guaranteed a minimum standard of health care for all, free at the point of use.","衛生大臣 Aneurin (Nye) Bevan 於 1948 年領導成立 NHS，保證人人享有免費的基本醫療服務。"],["81551c5","s",3,"In which year was the National Health Service established?",["1948","1918","1945","1979"],"The NHS was set up under the Labour government elected in 1945.","NHS 於 1948 年成立。"],["457ffbd","s",3,"What was the Beveridge Report of 1942?",["A report that provided the basis of the modern welfare state","A report on how the Second World War could be brought to an end","A plan for rebuilding London and Coventry after the Blitz","A review of the railway network"],"Its full title was Social Insurance and Allied Services.","1942 年的 Beveridge Report 是現代福利國家的基礎。"],["2914706","m",3,"Which TWO were among the five 'Giant Evils' named in the Beveridge Report?",["Want","Idleness","Greed","War"],"The five Giant Evils were Want, Disease, Ignorance, Squalor and Idleness.","Beveridge Report 指出五大禍害：匱乏（Want）、疾病、無知、污穢和懶散（Idleness）。"],["b0f0c52","s",3,"What did the Education Act of 1944, often called 'The Butler Act', introduce?",["Free secondary education in England and Wales","Free university education for everyone in the UK","Free school meals for all children under 11","Compulsory Welsh lessons in schools in Wales"],"R A Butler oversaw the Act. It divided education into primary and secondary stages.","1944 年的 Education Act（The Butler Act）在英格蘭和威爾斯引入免費中學教育。"],["d9e27a5","s",3,"Who wrote the radio play Under Milk Wood?",["Dylan Thomas","Roald Dahl","Rudyard Kipling","Graham Greene"],"Dylan Thomas was a Welsh poet and writer, born in Swansea.","Under Milk Wood 是威爾斯詩人 Dylan Thomas 的廣播劇，他生於 Swansea。"],["843c042","s",3,"Which industries did the Labour government of 1945 to 1951 nationalise?",["Railways, coal mines and gas, water and electricity","Banks, shops, newspapers and cinemas","Farms, fishing fleets, forests and food shops","Airlines, hotels, theatres and football clubs"],"The government took into public ownership the railways, coal mines and gas, water and electricity supplies.","1945 至 1951 年的工黨政府把鐵路、煤礦以及煤氣、水和電力供應收歸國有。"],["0a36fb8","s",3,"In 1947, independence was granted to nine countries. Which of these was one of them?",["India","Australia","Canada","Ireland"],"The nine countries included India, Pakistan and Ceylon, now Sri Lanka.","1947 年有九個國家獲得獨立，包括印度、巴基斯坦和錫蘭（今斯里蘭卡）。"],["c8f8dd7","s",3,"In 1948, people from which region were invited to come to the UK to work?",["The West Indies","South America","East Asia","Eastern Europe"],"There was a shortage of labour for rebuilding Britain after the war.","戰後英國重建缺乏人手，1948 年邀請西印度群島的人來英工作。"],["278cab1","s",3,"In the 1950s, centres were set up in the West Indies to recruit people for which job?",["Bus drivers","Coal miners","Nurses only","Soldiers"],"Textile and engineering firms from the north of England and the Midlands also sent agents to India and Pakistan to find workers.","1950 年代在西印度群島設立招聘中心聘請巴士司機；英格蘭北部和中部的紡織及工程公司亦派人到印度和巴基斯坦招聘。"],["664f637","s",3,"Which decade is known as 'the Swinging Sixties'?",["The 1960s","The 1920s","The 1940s","The 1980s"],"It was a period of growth in British fashion, cinema and popular music, with groups such as The Beatles and The Rolling Stones.","1960 年代被稱為 Swinging Sixties，是英國時裝、電影和流行音樂蓬勃發展的時期。"],["d71989b","s",3,"In the early 1970s, Britain admitted 28,000 people of Indian origin who had been forced to leave which country?",["Uganda","Kenya","South Africa","Pakistan"],"Although immigration was restricted in the late 1960s, Britain admitted these people from Uganda.","1970 年代初，英國接收了 28,000 名被迫離開烏干達的印度裔人士。"],["611f545","s",3,"Who developed the television in the 1920s?",["John Logie Baird","Sir Robert Watson-Watt","Sir Frank Whittle","Alan Turing"],"Baird was Scottish. In 1932 he made the first television broadcast between London and Glasgow.","蘇格蘭人 John Logie Baird 在 1920 年代發明電視，1932 年在倫敦與 Glasgow 之間首次進行電視廣播。"],["4ae0e4b","s",3,"Who developed radar?",["Sir Robert Watson-Watt","John Logie Baird","Sir Bernard Lovell","Sir Christopher Cockerell"],"Watson-Watt was a Scotsman. The first successful radar test took place in 1935.","蘇格蘭人 Sir Robert Watson-Watt 發明雷達，1935 年首次測試成功。"],["e3fa9ab","s",3,"What did Sir Bernard Lovell build at Jodrell Bank in Cheshire?",["A radio telescope","A jet engine","A hovercraft","A nuclear reactor"],"For many years it was the biggest radio telescope in the world.","Sir Bernard Lovell 在 Cheshire 的 Jodrell Bank 建造了無線電望遠鏡，多年來是全球最大的。"],["d26da59","s",3,"Alan Turing invented the Turing machine in the 1930s. What field did it influence?",["Computer science","Medicine","Aviation","Architecture"],"The theoretical mathematical device was influential in the development of computer science and the modern-day computer.","Alan Turing 在 1930 年代發明 Turing machine，對電腦科學和現代電腦的發展影響深遠。"],["b1c5844","s",3,"John Macleod co-discovered insulin. What is insulin used to treat?",["Diabetes","Influenza","Cancer","Malaria"],"Macleod was a Scottish physician and researcher.","蘇格蘭醫生 John Macleod 是胰島素的共同發現者，胰島素用於治療糖尿病。"],["0af62f8","s",3,"Francis Crick was one of those awarded the Nobel Prize for which discovery?",["The structure of the DNA molecule","The antibiotic called penicillin","The first working MRI scanner","The use of radar to detect aircraft"],"The structure of DNA was discovered in 1953 through work at British universities in London and Cambridge.","Francis Crick 因發現 DNA 分子結構而獲諾貝爾獎，該結構於 1953 年被發現。"],["4b3acc9","s",3,"Who developed the jet engine in Britain in the 1930s?",["Sir Frank Whittle","Sir Christopher Cockerell","James Goodfellow","Sir Robert Watson-Watt"],"Whittle was a British Royal Air Force engineer officer.","噴射引擎由英國皇家空軍工程軍官 Sir Frank Whittle 在 1930 年代研發。"],["f97fd70","s",3,"What did Sir Christopher Cockerell invent in the 1950s?",["The hovercraft","The jet engine","The cash machine","The radio telescope"],"Cockerell was a British inventor.","Sir Christopher Cockerell 在 1950 年代發明氣墊船。"],["63718d3","s",3,"Which two countries developed Concorde, the world's only supersonic commercial airliner?",["Britain and France","Britain and the USA","France and Germany","Britain and Italy"],"Concorde first flew in 1969, began carrying passengers in 1976 and was retired from service in 2003.","Concorde 由英國和法國合作研發，1969 年首航，1976 年開始載客，2003 年退役。"],["7c7943f","s",3,"What is special about the Harrier jump jet?",["It is capable of taking off vertically","It was the first supersonic passenger aircraft","It can fly without a pilot","It was the first aircraft to cross the Atlantic"],"The Harrier was designed and developed in the UK.","Harrier jump jet 在英國設計和研發，能夠垂直起飛。"],["8f41c9e","s",3,"What did James Goodfellow invent in the 1960s?",["The cash-dispensing ATM","The World Wide Web","The MRI scanner","The hovercraft"],"The first of these was put into use by Barclays Bank in Enfield, north London, in 1967.","James Goodfellow 在 1960 年代發明自動櫃員機，第一部於 1967 年在倫敦北部 Enfield 的 Barclays Bank 啟用。"],["14b4eec","s",3,"IVF therapy was pioneered in Britain. In which year was the world's first 'test-tube baby' born?",["1978","1953","1967","1996"],"The baby was born in Oldham, Lancashire. The pioneers were Sir Robert Edwards and Patrick Steptoe.","全球首名試管嬰兒於 1978 年在 Lancashire 的 Oldham 出生，先驅是 Sir Robert Edwards 和 Patrick Steptoe。"],["20ced44","s",3,"In 1996, Sir Ian Wilmut and Keith Campbell led a team which was the first to do what?",["Clone a mammal","Transplant a heart","Map human DNA","Grow a human organ"],"The result was Dolly the sheep.","1996 年 Sir Ian Wilmut 和 Keith Campbell 帶領團隊首次成功複製哺乳類動物，即 Dolly 羊。"],["31b88e1","s",3,"Sir Peter Mansfield is the co-inventor of what?",["The MRI scanner","The cash machine","The jet engine","The television"],"The MRI scanner gives exact and non-invasive images of human internal organs.","Sir Peter Mansfield 是磁力共振掃描器（MRI）的共同發明者。"],["1b54a9a","s",3,"Who invented the World Wide Web?",["Sir Tim Berners-Lee","Alan Turing","James Goodfellow","Sir Bernard Lovell"],"Information was successfully transferred via the web for the first time on 25 December 1990.","萬維網由英國人 Sir Tim Berners-Lee 發明，1990 年 12 月 25 日首次成功經網絡傳送資訊。"],["e9949f9","s",3,"In which sport did Mary Peters win an Olympic gold medal in 1972?",["Pentathlon","Swimming","Rowing","Cycling"],"She was born in Manchester and moved to Northern Ireland as a child. She was made a Dame in 2000.","Mary Peters 於 1972 年奧運贏得五項全能金牌。她生於 Manchester，童年移居北愛爾蘭。"],["9c51c42","s",3,"In which year did the UK join the European Economic Community?",["1973","1957","1945","1997"],"The EEC was formed in 1957 by six countries. The UK became a full member in 1973.","歐洲經濟共同體於 1957 年由六國成立，英國於 1973 年加入。"],["86b2a46","s",3,"When did the UK formally leave the European Union?",["31 January 2020","23 June 2016","1 January 1999","31 December 2010"],"The UK joined in 1973 and formally left on 31 January 2020.","英國於 2020 年 1 月 31 日正式脫離歐盟。"],["cf715ea","s",3,"Who was Britain's first woman Prime Minister?",["Margaret Thatcher","Emmeline Pankhurst","Theresa May","Florence Nightingale"],"Thatcher led the Conservative government from 1979 to 1990.","戴卓爾夫人（Margaret Thatcher）是英國首位女首相，1979 至 1990 年在任。"],["38e9357","t",3,"Margaret Thatcher was the longest-serving Prime Minister of the 20th century.",1,"She was Prime Minister from 1979 until 1990.","戴卓爾夫人由 1979 年任首相至 1990 年，是 20 世紀在任最長的首相。"],["28dfefe","s",3,"Before entering politics, Margaret Thatcher trained as what?",["A chemist and lawyer","A doctor and teacher","A journalist and soldier","An economist and banker"],"She was the daughter of a grocer from Grantham in Lincolnshire.","戴卓爾夫人從政前曾受訓成為化學家和律師，父親在 Lincolnshire 的 Grantham 開雜貨店。"],["e2d112b","s",3,"Which islands did Argentina invade in 1982?",["The Falkland Islands","The Channel Islands","The Shetland Islands","The Isle of Man"],"A naval taskforce was sent from the UK and military action led to the recovery of the islands.","1982 年阿根廷入侵福克蘭群島，英國派出海軍特遣部隊收復。"],["a7fa352","s",3,"Who was Prime Minister after Margaret Thatcher and helped establish the Northern Ireland peace process?",["John Major","Tony Blair","Gordon Brown","David Cameron"],"John Major was Prime Minister after Thatcher.","戴卓爾夫人之後由 John Major 接任首相，他協助開展北愛爾蘭和平進程。"],["a17fa4c","s",3,"Which of these books was written by Roald Dahl?",["Charlie and the Chocolate Factory","The Jungle Book and Just So Stories","Treasure Island","The Lord of the Rings"],"Dahl was born in Wales to Norwegian parents and served in the Royal Air Force during the Second World War.","Charlie and the Chocolate Factory 是 Roald Dahl 的作品。他生於威爾斯，父母是挪威人。"],["b597566","s",3,"Which Prime Minister's government introduced a Scottish Parliament and a Welsh Assembly?",["Tony Blair","Margaret Thatcher","John Major","Clement Attlee"],"The Labour Party led by Tony Blair was elected in 1997.","貝理雅（Tony Blair）領導的工黨於 1997 年當選，其政府設立了蘇格蘭議會和威爾斯議會。"],["f535228","s",3,"In which year was the Good Friday Agreement signed?",["1998","1972","1982","2007"],"The Northern Ireland Assembly was elected in 1999, suspended in 2002 and reinstated in 2007.","Good Friday Agreement 於 1998 年簽署，北愛爾蘭議會於 1999 年選出。"],["e9bf008","s",3,"Who took over from Tony Blair as Prime Minister in 2007?",["Gordon Brown","David Cameron","John Major","Nick Clegg"],"Gordon Brown was Prime Minister from 2007 until the 2010 General Election.","白高敦（Gordon Brown）於 2007 年接替貝理雅出任首相。"],["5f32dbc","s",3,"Which two parties formed a coalition government after the General Election in May 2010?",["The Conservatives and the Liberal Democrats","Labour and the Liberal Democrats","The Conservatives and Labour","Labour and the Scottish National Party"],"No party won an overall majority. David Cameron, the Conservative leader, became Prime Minister.","2010 年 5 月大選沒有政黨取得過半議席，保守黨與自由民主黨組成聯合政府，由卡梅倫出任首相。"],["7e9187e","s",3,"What happened to the Northern Ireland Parliament in 1972?",["It was suspended and Northern Ireland was ruled directly from London","It was moved from Belfast to a new building in Londonderry","It was given new powers over taxation and defence","It was merged with the parliament in Dublin"],"This followed the outbreak of the Troubles.","1972 年北愛爾蘭議會被中止運作，由英國政府直接管治。"],["95a9906","s",4,"What is the longest distance on the mainland of the UK?",["From John O'Groats to Land's End, about 870 miles","From Dover to Cardiff, about 250 miles","From London to Edinburgh, about 400 miles","From Belfast to Aberdeen, about 600 miles"],"John O'Groats is on the north coast of Scotland and Land's End is in the south-west corner of England.","英國本土最長的距離是由蘇格蘭北岸的 John O'Groats 到英格蘭西南角的 Land's End，約 870 英里（約 1,400 公里）。"],["30faea6","s",4,"Where is Land's End?",["In the south-west corner of England","On the north coast of Scotland","On the west coast of Wales","On the east coast of Northern Ireland"],"It is about 870 miles from John O'Groats on the north coast of Scotland.","Land's End 位於英格蘭西南角。"],["56a2b33","m",4,"Which TWO of these cities are in Scotland?",["Dundee","Aberdeen","Swansea","Bradford"],"Swansea is in Wales and Bradford is in England.","Dundee 和 Aberdeen 在蘇格蘭；Swansea 在威爾斯，Bradford 在英格蘭。"],["958ea29","s",4,"Which of these cities is in Wales?",["Newport","Plymouth","Norwich","Dundee"],"Cardiff, Swansea and Newport are cities in Wales.","Newport 位於威爾斯，威爾斯的城市還有 Cardiff 和 Swansea。"],["2939a47","s",4,"In which country of the UK is the city of Sheffield?",["England","Scotland","Wales","Northern Ireland"],"Sheffield is one of the main cities of England.","Sheffield 位於英格蘭。"],["434f72d","s",4,"What is the currency of the UK?",["The pound sterling","The euro","The British dollar","The crown"],"There are 100 pence in a pound.","英國的貨幣是英鎊（pound sterling），一英鎊等於 100 便士。"],["dab0698","s",4,"Which of these coins is in circulation in the UK?",["20p","15p","25p","75p"],"The coins are 1p, 2p, 5p, 10p, 20p, 50p, £1 and £2.","英國流通的硬幣有 1p、2p、5p、10p、20p、50p、£1 和 £2。"],["abbd16a","t",4,"Northern Ireland and Scotland have their own banknotes, which are valid everywhere in the UK.",1,"However, shops and businesses do not have to accept them.","北愛爾蘭和蘇格蘭有自己的鈔票，在全英國都有效，但商戶不一定要接受。"],["00f4665","s",4,"In which part of the UK is Gaelic spoken in some parts of the Highlands and Islands?",["Scotland","England","Wales","Cornwall"],"Welsh is spoken in Wales, and some people in Northern Ireland speak Irish Gaelic.","蘇格蘭高地和群島部分地區的人說蓋爾語；威爾斯有威爾斯語，北愛爾蘭有些人說愛爾蘭蓋爾語。"],["53e91c8","s",4,"What was the population of the UK in 1901?",["40 million","4 million","20 million","60 million"],"The population has grown faster in recent years because of migration and longer life expectancy.","1901 年英國人口為 4,000 萬。"],["a92f70f","s",4,"What percentage of the UK's population lives in England?",["84%","50%","65%","95%"],"Scotland has just over 8%, Wales around 5% and Northern Ireland less than 3%.","英格蘭佔全國人口 84%，蘇格蘭略多於 8%，威爾斯約 5%，北愛爾蘭少於 3%。"],["7437570","s",4,"Which country of the UK has less than 3% of the total population?",["Northern Ireland","Wales","Scotland","England"],"England has 84%, Scotland just over 8% and Wales around 5%.","北愛爾蘭的人口佔全國少於 3%。"],["5d36802","t",4,"People in the UK are living longer than ever before, and there is a record number of people aged 85 and over.",1,"This has an impact on the cost of pensions and health care.","英國人比以往長壽，85 歲或以上的人口創新高，對退休金和醫療開支有影響。"],["324d094","s",4,"Women in Britain today make up about what proportion of the workforce?",["Half","A quarter","A third","Three quarters"],"On average girls leave school with better qualifications than boys, and more women than men study at university.","女性約佔英國勞動人口一半。"],["a4fb010","t",4,"In the UK it is legal to discriminate against people because of their gender or because they are married.",0,"It is a legal requirement that men and women are not discriminated against because of their gender or marital status.","法律規定不得因性別或婚姻狀況而歧視任何人。"],["f2244a4","s",4,"Historically, the UK is what kind of country?",["A Christian country","A Buddhist country","A country with no religion","A Hindu country"],"In surveys most people identify themselves as Christian, and many other religions are also practised.","從歷史上看英國是基督教國家，同時亦有很多人信奉其他宗教或沒有宗教信仰。"],["041b76d","t",4,"Everyone in the UK has the legal right to choose their religion, or to choose not to practise a religion.",1,"Freedom of belief and religion is one of the freedoms offered by the UK.","在英國人人都有法律權利選擇宗教，或選擇不信奉任何宗教。"],["2da04fd","s",4,"What is the official Church of the state in England?",["The Church of England","The Roman Catholic Church","The Methodist Church","The Church of Scotland"],"It is a Protestant Church and has existed since the Reformation in the 1530s.","英格蘭的官方教會是 Church of England，屬新教，自 1530 年代宗教改革起存在。"],["7a064ad","s",4,"Who is the head of the Church of England?",["The monarch","The Archbishop of Canterbury","The Prime Minister","The Pope"],"The monarch is the Supreme Governor. The spiritual leader is the Archbishop of Canterbury.","Church of England 的元首是君主（Supreme Governor），精神領袖則是 Archbishop of Canterbury。"],["1dce5f8","s",4,"Who is the spiritual leader of the Church of England?",["The Archbishop of Canterbury","The monarch","The Moderator","The Bishop of London"],"The monarch is the head of the Church, and the Archbishop of Canterbury is its spiritual leader.","Church of England 的精神領袖是 Archbishop of Canterbury。"],["c54fb0c","s",4,"What is the Church of England known as in other countries?",["The Anglican Church","The Presbyterian Church","The Baptist Church","The Catholic Church"],"In Scotland and the United States it is called the Episcopal Church.","Church of England 在其他國家稱為 Anglican Church，在蘇格蘭和美國稱為 Episcopal Church。"],["227d191","s",4,"What kind of Church is the national Church in Scotland?",["Presbyterian","Anglican","Roman Catholic","Methodist"],"The Church of Scotland is governed by ministers and elders.","蘇格蘭的國家教會 Church of Scotland 屬長老宗（Presbyterian），由牧師和長老管理。"],["6b895fb","s",4,"What is the chairperson of the General Assembly of the Church of Scotland called?",["The Moderator","The Archbishop","The Speaker","The Elder"],"The Moderator is appointed for one year only and often speaks on behalf of that Church.","Church of Scotland 大會的主席稱為 Moderator，任期只有一年。"],["fed1fe4","t",4,"There is an established Church in Wales and in Northern Ireland.",0,"There is no established Church in Wales or Northern Ireland.","威爾斯和北愛爾蘭都沒有官方教會。"],["eee9546","m",4,"Which TWO are Protestant Christian groups in the UK?",["Baptists","Quakers","Hindus","Buddhists"],"Other Protestant groups include Methodists and Presbyterians.","Baptists 和 Quakers 都是新教教派，其他還有 Methodists 和 Presbyterians。"],["7ed3f69","s",4,"Who is the patron saint of Wales?",["St David","St Patrick","St George","St Andrew"],"St David's Day is 1 March.","威爾斯的主保聖人是 St David，紀念日是 3 月 1 日。"],["cf90927","s",4,"When is St Patrick's Day?",["17 March","1 March","23 April","30 November"],"St Patrick is the patron saint of Northern Ireland.","St Patrick's Day 是 3 月 17 日，St Patrick 是北愛爾蘭的主保聖人。"],["55e2b25","s",4,"When is St George's Day?",["23 April","1 March","17 March","30 November"],"St George is the patron saint of England.","St George's Day 是 4 月 23 日，St George 是英格蘭的主保聖人。"],["cd4c42b","s",4,"Who is the patron saint of Scotland?",["St Andrew","St David","St George","St Columba"],"St Andrew's Day is 30 November.","蘇格蘭的主保聖人是 St Andrew，紀念日是 11 月 30 日。"],["4ee6266","s",4,"In which parts of the UK is the patron saint's day an official holiday?",["Scotland and Northern Ireland","England and Wales","England only","All four countries"],"Events are held across the whole country, but only Scotland and Northern Ireland have an official holiday.","只有蘇格蘭和北愛爾蘭把主保聖人日定為公眾假期。"],["4f51f72","s",4,"What is the national flower of Scotland?",["The thistle","The rose","The daffodil","The shamrock"],"England has the rose, Wales the daffodil and Northern Ireland the shamrock.","蘇格蘭的國花是薊（thistle）；英格蘭是玫瑰，威爾斯是水仙，北愛爾蘭是三葉草。"],["7549cdd","s",4,"What is the national flower of Wales?",["The daffodil","The thistle","The shamrock","The rose"],"The daffodil is worn on St David's Day.","威爾斯的國花是水仙（daffodil）。"],["b1204b9","s",4,"Which country's national flower is the shamrock?",["Northern Ireland","Scotland","Wales","England"],"The shamrock is the national flower of Northern Ireland.","三葉草（shamrock）是北愛爾蘭的國花。"],["c2d0704","s",4,"What does Christmas Day, 25 December, celebrate?",["The birth of Jesus Christ","The death of Jesus Christ","The start of the new year","The end of Lent"],"It is a public holiday. Many Christians go to church on Christmas Eve or Christmas Day.","12 月 25 日聖誕節紀念耶穌基督誕生，是公眾假期。"],["c86ebc9","m",4,"Which TWO foods are traditionally eaten at Christmas?",["Roast turkey","Mince pies","Pancakes","Haggis"],"The traditional Christmas meal is roast turkey, Christmas pudding and mince pies.","傳統聖誕大餐有烤火雞、聖誕布甸和 mince pies。"],["c5240ba","s",4,"When is Boxing Day?",["26 December","24 December","31 December","1 January"],"Boxing Day is the day after Christmas Day and is a public holiday.","Boxing Day 是聖誕節翌日（12 月 26 日），屬公眾假期。"],["061d2c9","s",4,"What does Good Friday mark?",["The death of Jesus Christ","The birth of Jesus Christ","The rising of Jesus from the dead","The start of Lent"],"Easter Sunday celebrates his rising from the dead. Good Friday and Easter Monday are public holidays.","Good Friday 紀念耶穌受難，Easter Sunday 紀念耶穌復活。"],["ef89f61","s",4,"How long is Lent, the period before Easter?",["40 days","7 days","12 days","30 days"],"Lent is a time when Christians reflect and prepare for Easter. It begins on Ash Wednesday.","Lent（四旬期）是復活節前的 40 日，由 Ash Wednesday 開始。"],["836d4df","s",4,"What is Shrove Tuesday also known as?",["Pancake Day","Boxing Day","Ash Wednesday","Hogmanay"],"It is the day before Lent starts. People eat pancakes, traditionally to use up foods before fasting.","Shrove Tuesday 又稱 Pancake Day，是 Lent 開始前一天。"],["cd7cfc1","s",4,"Diwali is celebrated by which two religious groups?",["Hindus and Sikhs","Muslims and Jews","Buddhists and Christians","Sikhs and Muslims"],"Diwali is often called the Festival of Lights. It normally falls in October or November and lasts for five days.","Diwali（排燈節）由印度教徒和錫克教徒慶祝，一般在 10 或 11 月，為期五天。"],["aecd2b8","s",4,"Which English city has a famous celebration of Diwali?",["Leicester","Bristol","Norwich","Plymouth"],"There are different stories about how Diwali came about, and there is a famous celebration in Leicester.","Leicester 的 Diwali 慶祝活動很有名。"],["3a50162","s",4,"For how many days is Hannukah celebrated?",["Eight","Three","Five","Twelve"],"It remembers the Jews' struggle for religious freedom. A candle is lit on a menorah on each day.","Hannukah（猶太教光明節）為期八天，紀念猶太人爭取宗教自由，每天在燭台上點一支蠟燭。"],["6f116e9","s",4,"What does Eid al-Fitr celebrate?",["The end of Ramadan","The founding of the Khalsa","The Festival of Lights","The start of the new year"],"Muslims thank Allah for giving them the strength to complete the month-long fast.","Eid al-Fitr（開齋節）慶祝齋戒月 Ramadan 結束。"],["b673f9e","s",4,"What does Eid ul Adha remember?",["The prophet Ibrahim's willingness to sacrifice his son","The end of the month-long fast of Ramadan","The founding of the community called the Khalsa","The Jews' struggle for religious freedom"],"It reminds Muslims of their own commitment to God.","Eid ul Adha（宰牲節）紀念先知 Ibrahim 願意遵從神的命令獻上兒子。"],["dfb355e","s",4,"Vaisakhi is a festival of which religion?",["Sikhism","Hinduism","Islam","Judaism"],"It celebrates the founding of the Sikh community known as the Khalsa and is on 14 April each year.","Vaisakhi 是錫克教節日，紀念錫克教社群 Khalsa 的創立，每年 4 月 14 日舉行。"],["36caf92","s",4,"What is 31 December called in Scotland?",["Hogmanay","Burns Night","Boxing Day","St Andrew's Day"],"In Scotland, 2 January is also a public holiday.","蘇格蘭把 12 月 31 日稱為 Hogmanay，1 月 2 日在蘇格蘭亦是公眾假期。"],["22882bc","s",4,"When is Valentine's Day?",["14 February","14 April","1 April","31 October"],"Lovers exchange cards and gifts. Sometimes people send anonymous cards to someone they secretly admire.","情人節是 2 月 14 日。"],["e6c2c11","s",4,"On April Fool's Day, until what time do people play jokes on each other?",["Midday","Midnight","9.00 am","Sunset"],"April Fool's Day is 1 April.","4 月 1 日愚人節，人們互相開玩笑直至中午。"],["573acb4","s",4,"When is Mothering Sunday?",["The Sunday three weeks before Easter","The first Sunday in the month of May","The third Sunday in the month of June","The Sunday after Christmas Day"],"Children send cards or buy gifts for their mothers.","Mothering Sunday（母親節）是復活節前三個星期的星期日。"],["9f96f3a","s",4,"When is Father's Day?",["The third Sunday in June","The Sunday three weeks before Easter","The first Sunday in March","The last Sunday in August"],"Children send cards or buy gifts for their fathers.","父親節是 6 月的第三個星期日。"],["6b29286","s",4,"When is Halloween?",["31 October","5 November","11 November","1 April"],"It is an ancient festival with roots in the pagan festival to mark the beginning of winter.","萬聖節是 10 月 31 日，源自標誌冬季開始的古老異教節日。"],["db5c8fb","s",4,"What happened in 1605 that is remembered on Bonfire Night?",["A group of Catholics led by Guy Fawkes failed to kill the king","The Great Fire destroyed much of the City of London","The Spanish Armada was defeated by the English fleet","King Charles I was executed after the Civil War"],"They planned to use a bomb in the Houses of Parliament. Bonfire Night is 5 November.","1605 年以 Guy Fawkes 為首的一群天主教徒企圖在國會大樓用炸彈刺殺新教國王但失敗。Bonfire Night 是 11 月 5 日。"],["6d53b74","s",4,"When is Remembrance Day?",["11 November","5 November","8 May","6 June"],"It commemorates those who died fighting for the UK and its allies. There is a two-minute silence at 11.00 am.","Remembrance Day 是 11 月 11 日，紀念為英國及盟國捐軀的人，上午 11 時默哀兩分鐘。"],["a4d4bcb","s",4,"What do people wear on Remembrance Day?",["Poppies","Daffodils","Shamrocks","Thistles"],"Poppies are the red flower found on the battlefields of the First World War.","Remembrance Day 人們佩戴罌粟花（poppy），那是第一次世界大戰戰場上的紅花。"],["2685805","s",4,"Where in London do people lay wreaths on Remembrance Day?",["At the Cenotaph in Whitehall","At Nelson's Column","At the Tower of London","At Buckingham Palace"],"The Cenotaph was designed by Sir Edwin Lutyens.","Remembrance Day 當日人們在 Whitehall 的 Cenotaph（紀念碑）獻花圈。"],["c526327","s",4,"Which event's anniversary is a public holiday in July in Northern Ireland?",["The Battle of the Boyne","The Easter Rising","The Good Friday Agreement","The Battle of Hastings"],"Bank holidays elsewhere fall at the beginning of May, in late May or early June, and in August.","北愛爾蘭在 7 月有紀念 Battle of the Boyne 的公眾假期。"],["5a70080","s",4,"In which years has the UK hosted the Olympic Games?",["1908, 1948 and 2012","1900, 1936 and 2000","1924, 1966 and 2012","1948, 1984 and 2016"],"The main Olympic site for the 2012 Games was in Stratford, East London.","英國曾於 1908、1948 和 2012 年主辦奧運會。"],["320a503","s",4,"Where was the main Olympic site for the 2012 Games?",["Stratford, East London","Wembley, North London","Greenwich, South London","Stoke Mandeville, Buckinghamshire"],"The British team was very successful, finishing third in the medal table.","2012 年奧運主場館位於倫敦東部的 Stratford，英國隊在獎牌榜排第三。"],["b430e01","s",4,"The Paralympic Games have their origin in the work of Dr Sir Ludwig Guttman at which hospital?",["Stoke Mandeville","St Thomas'","Great Ormond Street","Addenbrooke's"],"Guttman was a German refugee who developed new methods of treatment for people with spinal injuries at Stoke Mandeville in Buckinghamshire.","殘奧會源自德國難民 Dr Sir Ludwig Guttman 在 Buckinghamshire 的 Stoke Mandeville 醫院的工作。"],["26a866a","s",4,"What did Sir Roger Bannister achieve in 1954?",["He was the first man to run a mile in under four minutes","He was the first winner of the London Marathon","He was the first man to swim across the Channel and back","He won Olympic gold medals in the 5,000 and 10,000 metres"],"Bannister ran the first sub-four-minute mile in 1954.","Sir Roger Bannister 於 1954 年成為首位在四分鐘內跑完一英里的人。"],["a595595","s",4,"In which sport did Sir Jackie Stewart win the world championship three times?",["Formula 1 motor racing","Cycling","Golf","Sailing"],"Stewart is a Scottish former racing driver.","蘇格蘭人 Sir Jackie Stewart 曾三奪一級方程式世界冠軍。"],["7e2988d","s",4,"Who captained the England football team that won the World Cup in 1966?",["Bobby Moore","Sir Ian Botham","Sir Steve Redgrave","David Weir"],"The 1966 World Cup was hosted in the UK and is England's only international tournament victory.","Bobby Moore 是 1966 年贏得世界盃的英格蘭足球隊隊長。"],["3af51f3","s",4,"In which sport did Sir Ian Botham captain England?",["Cricket","Rugby","Football","Tennis"],"He holds a number of English Test cricket records, both for batting and for bowling.","Sir Ian Botham 曾任英格蘭板球隊隊長，在擊球和投球方面都保持多項紀錄。"],["d742644","s",4,"In which sport did Jayne Torvill and Christopher Dean win Olympic gold medals in 1984?",["Ice dancing","Rowing","Sailing","Gymnastics"],"They also won four consecutive world championships.","Jayne Torvill 和 Christopher Dean 於 1984 年奧運贏得冰上舞蹈金牌，並連續四屆奪得世界冠軍。"],["98fc0b2","s",4,"Sir Steve Redgrave won gold medals in five consecutive Olympic Games in which sport?",["Rowing","Cycling","Swimming","Athletics"],"He is one of Britain's greatest Olympians.","Sir Steve Redgrave 連續五屆奧運贏得賽艇金牌。"],["58b4d10","s",4,"How many Paralympic medals did Baroness Tanni Grey-Thompson win?",["16, including 11 gold medals","6, all gold","8, including 4 gold medals","30, including 20 gold medals"],"She is an athlete who uses a wheelchair. She also won the London Marathon six times and broke 30 world records.","Baroness Tanni Grey-Thompson 是輪椅運動員，共贏得 16 面殘奧獎牌，其中 11 面是金牌。"],["cd9dce8","s",4,"What did Dame Kelly Holmes win at the 2004 Olympic Games?",["Two gold medals for running","A gold medal in the heptathlon","Two gold medals for swimming","A gold medal in rowing"],"She has also held a number of British and European records.","Dame Kelly Holmes 在 2004 年奧運贏得兩面跑步金牌。"],["e12fce5","s",4,"What did Dame Ellen MacArthur achieve in 2004?",["She became the fastest person to sail around the world singlehanded","She became the first woman to row across the Atlantic Ocean alone","She won two gold medals for sailing at the Olympic Games in Athens","She was the first woman to finish the Tour de France"],"Dame Ellen MacArthur is a yachtswoman.","Dame Ellen MacArthur 是帆船運動員，2004 年成為單人環球航行最快的人。"],["60a7cc9","s",4,"Sir Chris Hoy is a Scottish sportsman who won six gold Olympic medals in which sport?",["Cycling","Rowing","Sailing","Athletics"],"He has also won 11 world championship titles.","蘇格蘭人 Sir Chris Hoy 是單車運動員，贏得六面奧運金牌和 11 個世界冠軍。"],["962fa07","s",4,"In 2012, who became the first Briton to win the Tour de France?",["Sir Bradley Wiggins","Sir Chris Hoy","Sir Mo Farah","David Weir"],"Wiggins is a cyclist who has also won Olympic medals.","Sir Bradley Wiggins 於 2012 年成為首位贏得環法單車賽的英國人。"],["fdf7084","s",4,"Sir Mo Farah won gold medals at the 2012 Olympics in which events?",["The 5,000 and 10,000 metres","The 100 and 200 metres","The marathon and the 1,500 metres","The heptathlon and the long jump"],"He is a British distance runner, born in Somalia, and was the first Briton to win Olympic gold in the 10,000 metres.","Sir Mo Farah 在 2012 年奧運贏得 5,000 米和 10,000 米金牌。他生於索馬里，是英國長跑運動員。"],["18421e3","s",4,"In which event did Dame Jessica Ennis win gold at the 2012 Olympics?",["The heptathlon","The pentathlon","The 10,000 metres","The high jump"],"The heptathlon includes seven different track and field events.","Dame Jessica Ennis 在 2012 年奧運贏得七項全能金牌。"],["8e6dfd6","s",4,"What did Sir Andy Murray win in 2012?",["The men's singles at the US Open","The Tour de France","The Open Championship","The Formula 1 world championship"],"He was the first British man to win a singles title in a Grand Slam tournament since 1936.","Sir Andy Murray 於 2012 年贏得美國網球公開賽男單冠軍，是自 1936 年以來首位贏得大滿貫單打冠軍的英國男子。"],["17e46b1","s",4,"In which sport did Ellie Simmonds win gold medals at the 2008 and 2012 Paralympic Games?",["Swimming","Cycling","Athletics","Rowing"],"She was the youngest member of the British team at the 2008 Games.","Ellie Simmonds 在 2008 和 2012 年殘奧會贏得游泳金牌，2008 年時是英國隊最年輕的成員。"],["c84ca69","s",4,"David Weir is a Paralympian who uses a wheelchair. How many times has he won the London Marathon?",["Six","Two","Ten","Fifteen"],"He has also won six gold medals over two Paralympic Games.","David Weir 是輪椅運動員，曾六次贏得倫敦馬拉松，並在兩屆殘奧會共奪六面金牌。"],["a8599d7","t",4,"Cricket matches can last up to five days but still result in a draw.",1,"Cricket originated in England and is now played in many countries.","板球比賽最長可以打五天，但仍可能以和局收場。板球起源於英格蘭。"],["500cfa8","s",4,"What are the Ashes?",["A series of cricket Test matches between England and Australia","A rugby union tournament played each year between six nations","An annual horse race held at Aintree near Liverpool","A football competition between English and Scottish clubs"],"It is the most famous competition in cricket.","The Ashes 是英格蘭與澳洲之間的板球對抗賽系列，是板球界最著名的賽事。"],["cab8c81","s",4,"Which is the UK's most popular sport?",["Football","Cricket","Rugby","Tennis"],"It has a long history in the UK and the first professional football clubs were formed in the late 19th century.","足球是英國最受歡迎的運動，最早的職業足球會在 19 世紀後期成立。"],["f10c1c3","t",4,"England, Scotland, Wales and Northern Ireland each have their own national football team.",1,"Each also has its own separate league in which clubs compete.","英格蘭、蘇格蘭、威爾斯和北愛爾蘭各有自己的國家足球隊和聯賽。"],["07f5a58","s",4,"Where did rugby originate?",["England","Wales","New Zealand","France"],"Rugby originated in England in the early 19th century. There are two types: union and league.","欖球於 19 世紀初起源於英格蘭，分為 union 和 league 兩種。"],["3f73b25","m",4,"Which TWO countries take part in the Six Nations Championship alongside England, Ireland, Scotland and Wales?",["France","Italy","Spain","Germany"],"The Six Nations is the most famous rugby union competition.","Six Nations 是最著名的欖球（union）賽事，參賽的有英格蘭、愛爾蘭、蘇格蘭、威爾斯、法國和意大利。"],["c9ed808","s",4,"The Super League is the most well-known competition in which sport?",["Rugby league","Rugby union","Football","Cricket"],"The Six Nations Championship, by contrast, is a rugby union competition.","Super League 是最著名的 rugby league 賽事；Six Nations 則屬 rugby union。"],["b147863","s",4,"What is Royal Ascot?",["A five-day horse-racing meeting in Berkshire","A sailing event on the Isle of Wight","A golf tournament in Scotland","A tennis championship in London"],"It is attended by members of the Royal Family.","Royal Ascot 是在 Berkshire 舉行的五天賽馬盛事，王室成員會出席。"],["d3ad823","s",4,"Where is the Grand National horse race held?",["Aintree, near Liverpool","Ayr, in Scotland","Newmarket, in Suffolk","Ascot, in Berkshire"],"The Scottish Grand National is held at Ayr.","Grand National 賽馬在 Liverpool 附近的 Aintree 舉行；Scottish Grand National 則在 Ayr 舉行。"],["1920b69","s",4,"Where is the National Horseracing Museum?",["Newmarket, Suffolk","Aintree, Liverpool","Epsom, Surrey","Cheltenham, Gloucestershire"],"Horse racing has a long association with royalty in Britain.","National Horseracing Museum 位於 Suffolk 的 Newmarket。"],["5d68a49","s",4,"Which place in Scotland is known as the home of golf?",["St Andrews","Ayr","Dundee","Inverness"],"The modern game of golf can be traced back to 15th century Scotland.","蘇格蘭的 St Andrews 被稱為高爾夫球的發源地，高爾夫球可追溯至 15 世紀的蘇格蘭。"],["a2e7984","t",4,"The Open Championship is the only 'Major' golf tournament held outside the United States.",1,"It is hosted by a different golf course every year.","The Open Championship 是唯一在美國以外舉行的高爾夫球大滿貫賽，每年在不同球場舉行。"],["003cbe3","s",4,"Where was the first tennis club founded in 1872?",["Leamington Spa","Wimbledon","Eastbourne","St Andrews"],"Modern tennis evolved in England in the late 19th century.","第一間網球會於 1872 年在 Leamington Spa 成立。"],["b1a8a30","m",4,"Which TWO statements about the Wimbledon Championships are correct?",["It is the oldest tennis tournament in the world","It is the only Grand Slam event played on grass","It is held in Scotland every other year","It is open only to British players"],"It takes place each year at the All England Lawn Tennis and Croquet Club.","溫布頓是全球最古老的網球賽事，亦是唯一在草地進行的大滿貫賽。"],["c922381","s",4,"Who was the first person to sail single-handed around the world, in 1966/67?",["Sir Francis Chichester","Sir Robin Knox-Johnston","Dame Ellen MacArthur","Sir Francis Drake"],"Two years later, Sir Robin Knox-Johnston became the first person to do this without stopping.","Sir Francis Chichester 於 1966/67 年成為首位單人環球航行的人；兩年後 Sir Robin Knox-Johnston 成為首位不停站完成的人。"],["5aaf3d5","s",4,"Which place on the Isle of Wight is famous for sailing events?",["Cowes","Ryde","Newport","Sandown"],"Many sailing events are held throughout the UK, the most famous of which is at Cowes.","Isle of Wight 的 Cowes 以帆船賽事聞名。"],["41f2798","s",4,"Which two universities compete in a famous annual rowing race on the River Thames?",["Oxford and Cambridge","Durham and York","Edinburgh and Glasgow","London and Bristol"],"Rowing is popular both as a leisure activity and as a competitive sport.","牛津和劍橋大學每年在泰晤士河舉行著名的賽艇比賽。"],["b4c56d4","s",4,"In which year did motor-car racing start in the UK?",["1902","1850","1936","1966"],"The UK continues to be a world leader in the development and manufacture of motor-sport technology.","英國的賽車運動始於 1902 年。"],["f514d1c","m",4,"Which TWO of these British drivers have won the Formula 1 World Championship?",["Damon Hill","Lewis Hamilton","Sir Chris Hoy","Bobby Moore"],"Jenson Button is another recent British winner.","Damon Hill 和 Lewis Hamilton 都贏過一級方程式世界冠軍，Jenson Button 亦是。"],["b11a35e","s",4,"How many ski centres are there in Scotland?",["Five","One","Twelve","Twenty"],"Europe's longest dry ski slope is near Edinburgh.","蘇格蘭有五個滑雪中心，歐洲最長的人造滑雪道就在愛丁堡附近。"],["8cbe09d","s",4,"What are the Proms?",["An eight-week summer season of orchestral classical music","A series of pop concerts held each year at Wembley Stadium","A Welsh festival of poetry, music and dance","A film festival held every August in Edinburgh"],"The Proms have been organised by the BBC since 1927. Venues include the Royal Albert Hall in London.","The Proms 是為期八星期的夏季古典管弦音樂會，自 1927 年起由 BBC 主辦，場地包括倫敦 Royal Albert Hall。"],["1f96a59","s",4,"Which composer was the organist at Westminster Abbey?",["Henry Purcell","George Frederick Handel","Gustav Holst","Benjamin Britten"],"Purcell wrote church music, operas and other pieces.","Henry Purcell 曾任 Westminster Abbey 的風琴師，創作了教堂音樂和歌劇。"],["26922c6","s",4,"Who wrote the Water Music for King George I?",["George Frederick Handel","Henry Purcell","Sir Edward Elgar","Sir William Walton"],"Handel was born in Germany and became a British citizen in 1727. He also wrote Music for the Royal Fireworks and the oratorio Messiah.","Water Music 是 George Frederick Handel 為 King George I 創作的。他生於德國，1727 年成為英國公民。"],["637189a","s",4,"Who composed The Planets?",["Gustav Holst","Ralph Vaughan Williams","Sir Edward Elgar","Benjamin Britten"],"He adapted Jupiter, part of the Planets suite, as the tune for I Vow to Thee My Country.","The Planets 由 Gustav Holst 創作。"],["2590fea","s",4,"Which composer wrote the Pomp and Circumstance Marches?",["Sir Edward Elgar","Gustav Holst","Henry Purcell","Sir William Walton"],"March No 1, Land of Hope and Glory, is usually played at the Last Night of the Proms.","Pomp and Circumstance Marches 由 Sir Edward Elgar 創作，其中第一首 Land of Hope and Glory 通常在 Last Night of the Proms 演奏。"],["4e5c36c","s",4,"Whose music was strongly influenced by traditional English folk music?",["Ralph Vaughan Williams","George Frederick Handel","Sir William Walton","Henry Purcell"],"Vaughan Williams wrote music for orchestras and choirs.","Ralph Vaughan Williams 的音樂深受英格蘭傳統民謠影響。"],["cce232f","s",4,"Which composer wrote marches for the coronations of King George VI and Queen Elizabeth II?",["Sir William Walton","Benjamin Britten","Gustav Holst","Sir Edward Elgar"],"His best-known works include Façade and Belshazzar's Feast.","Sir William Walton 為 King George VI 和 Queen Elizabeth II 的加冕禮創作進行曲。"],["a4cea4f","s",4,"Which composer wrote the operas Peter Grimes and Billy Budd?",["Benjamin Britten","Henry Purcell","Gustav Holst","Ralph Vaughan Williams"],"Britten also wrote A Young Person's Guide to the Orchestra and founded the Aldeburgh festival in Suffolk.","歌劇 Peter Grimes 和 Billy Budd 由 Benjamin Britten 創作，他亦創辦了 Suffolk 的 Aldeburgh 音樂節。"],["d8580ec","m",4,"Which TWO are major music festivals held in the UK?",["Glastonbury","The Isle of Wight Festival","The Turner Festival","The Booker Festival"],"Festival season takes place across the UK every summer.","Glastonbury 和 Isle of Wight Festival 都是英國的大型音樂節。"],["755e586","s",4,"What is the National Eisteddfod of Wales?",["An annual cultural festival of music, dance and art","A rugby competition between Welsh clubs","The opening ceremony of the Welsh Parliament","A prize for novels written in Welsh"],"The performances are largely in Welsh.","National Eisteddfod of Wales 是威爾斯每年一度的文化節，有音樂、舞蹈、藝術和原創表演，主要以威爾斯語進行。"],["ba4b0d9","s",4,"What is the Mercury Music Prize awarded for?",["The best album from the UK and Ireland","The best new classical composer in Europe","The best musical in London's West End","The best film soundtrack"],"It is awarded each September.","Mercury Music Prize 每年 9 月頒發，表揚英國和愛爾蘭的最佳專輯。"],["31fedca","s",4,"What is London's West End also known as?",["Theatreland","The Square Mile","The South Bank","Poets' Corner"],"The Mousetrap by Dame Agatha Christie has been running in the West End since 1952.","倫敦 West End 又稱 Theatreland。"],["2c61adc","s",4,"Which play has had the longest initial run of any show in history?",["The Mousetrap","Hamlet","The Phantom of the Opera","The Mikado"],"It is a murder-mystery play by Dame Agatha Christie and has been running in the West End since 1952.","Dame Agatha Christie 的 The Mousetrap 自 1952 年起在 West End 上演，是史上首輪公演最長的劇目。"],["6b22cd3","m",4,"Which TWO comic operas were written by Gilbert and Sullivan?",["HMS Pinafore","The Mikado","Cats","Evita"],"Gilbert and Sullivan wrote comic operas in the 19th century, including The Pirates of Penzance.","HMS Pinafore 和 The Mikado 都是 Gilbert and Sullivan 的喜歌劇。"],["8e2d10f","s",4,"Who wrote the music for Cats and The Phantom of the Opera?",["Andrew Lloyd Webber","Benjamin Britten","Tim Rice","Gilbert and Sullivan"],"He also wrote the music for Jesus Christ Superstar and Evita, in collaboration with Tim Rice.","Cats 和 The Phantom of the Opera 的音樂由 Andrew Lloyd Webber 創作。"],["034cefc","s",4,"When do many theatres in the UK produce a pantomime?",["At Christmas time","At Easter","On Bonfire Night","During the summer holidays"],"Pantomimes are based on fairy stories. One traditional character is the Dame, a woman played by a man.","很多劇院在聖誕期間上演 pantomime（童話鬧劇），傳統角色 Dame 是由男人扮演的女角。"],["a9ff1b1","s",4,"What is 'the Fringe'?",["The best-known festival within the Edinburgh Festival","A style of decoration used in medieval cathedrals","A comedy club in the middle of London's West End","The public gallery in the House of Commons"],"The Edinburgh Festival takes place every summer. The Fringe is a showcase of mainly theatre and comedy performances.","The Fringe 是每年夏天 Edinburgh Festival 中最大、最著名的藝術節，以戲劇和喜劇表演為主。"],["f7bc644","s",4,"What do the Laurence Olivier Awards celebrate?",["Theatre","Film","Pop music","Literature"],"They take place annually at different venues in London.","Laurence Olivier Awards 是每年在倫敦頒發的戲劇獎。"],["caf4505","s",4,"Thomas Gainsborough was a painter known for what?",["Portraits of people in country or garden scenery","Large abstract sculptures cast in bronze","Pop art prints made during the 1960s","Stained glass windows for cathedrals"],"Gainsborough lived from 1727 to 1788.","Thomas Gainsborough 是肖像畫家，常以鄉郊或花園為背景。"],["d89e832","s",4,"David Allan was a Scottish painter best known for painting what?",["Portraits","Seascapes","Battle scenes","Abstract shapes"],"One of his most famous works is called The Origin of Painting.","David Allan 是蘇格蘭畫家，以肖像畫聞名，名作有 The Origin of Painting。"],["840589a","s",4,"Which artist is considered the painter who raised the profile of landscape painting?",["Joseph Turner","Henry Moore","Sir John Lavery","David Hockney"],"Turner was an influential landscape painter in a modern style. The Turner Prize is named after him.","Joseph Turner 是具影響力的風景畫家，提升了風景畫的地位，Turner Prize 以他命名。"],["9e7a605","s",4,"John Constable is famous for his paintings of which area?",["Dedham Vale on the Suffolk–Essex border","The fells and lakes of the Lake District","The mountains of the Scottish Highlands","The fishing villages of the Cornish coast"],"Constable was a landscape painter.","John Constable 是風景畫家，以描繪 Suffolk 與 Essex 交界的 Dedham Vale 聞名。"],["08266f0","m",4,"Which TWO artists were members of the Pre-Raphaelites?",["Dante Gabriel Rossetti","Sir John Millais","David Hockney","Lucian Freud"],"The Pre-Raphaelites were an important group of artists in the second half of the 19th century, including Holman Hunt.","Dante Gabriel Rossetti 和 Sir John Millais 都是 19 世紀後半的 Pre-Raphaelites 畫派成員。"],["a5234b8","s",4,"Sir John Lavery was a successful portrait painter from which part of the UK?",["Northern Ireland","Wales","Scotland","England"],"His work included painting the Royal Family.","Sir John Lavery 是來自北愛爾蘭的肖像畫家，曾為王室成員繪畫。"],["c43ebd5","s",4,"What is Henry Moore best known for?",["Large bronze abstract sculptures","Landscape paintings of Suffolk","Engravings and stained glass","Portraits of the Royal Family"],"Moore was an English sculptor and artist.","Henry Moore 是英格蘭雕塑家，以大型抽象銅雕聞名。"],["90b466f","s",4,"John Petts was a Welsh artist best known for what?",["Engravings and stained glass","Pop art","Bronze sculpture","Landscape painting"],"Petts lived from 1914 to 1991.","John Petts 是威爾斯藝術家，以版畫和彩繪玻璃聞名。"],["70fabea","s",4,"David Hockney was an important contributor to which art movement of the 1960s?",["Pop art","The Pre-Raphaelites","Gothic revival","Art Deco"],"Hockney continues to be influential today.","David Hockney 是 1960 年代「普普藝術」運動的重要人物。"],["11b07a7","s",4,"What does the Turner Prize celebrate?",["Contemporary art","Landscape gardening","Classical music","Historical novels"],"It was established in 1984. Four works are shortlisted every year and shown at Tate Britain.","Turner Prize 於 1984 年設立，表揚當代藝術，每年有四件入圍作品在 Tate Britain 展出。"],["3823c8b","s",4,"Where is the National Gallery of Scotland?",["Edinburgh","Glasgow","Aberdeen","Dundee"],"The National Gallery, Tate Britain and Tate Modern are in London, and the National Museum is in Cardiff.","National Gallery of Scotland 位於愛丁堡。"],["0428d87","s",4,"Who ordered the building of the White Tower in the Tower of London?",["William the Conqueror","Henry VIII","Elizabeth I","King John"],"The White Tower is an example of a Norman castle keep.","倫敦塔內的 White Tower 是 William the Conqueror 下令興建的，是諾曼式城堡主樓的例子。"],["587ab3f","m",4,"Which TWO buildings were designed by Inigo Jones?",["The Queen's House at Greenwich","The Banqueting House in Whitehall","St Paul's Cathedral","The Houses of Parliament"],"Inigo Jones took inspiration from classical architecture in the 17th century.","Greenwich 的 Queen's House 和 Whitehall 的 Banqueting House 都是 17 世紀建築師 Inigo Jones 的作品。"],["bf78510","s",4,"Robert Adam was an 18th-century architect from which country?",["Scotland","Wales","Ireland","Italy"],"He designed the inside decoration as well as the building itself, for example at Dumfries House in Scotland.","Robert Adam 是 18 世紀的蘇格蘭建築師，作品包括蘇格蘭的 Dumfries House。"],["3f5b726","m",4,"Which TWO buildings are examples of the 19th-century 'Gothic' style?",["The Houses of Parliament","St Pancras Station","The Queen's House at Greenwich","The Royal Crescent in Bath"],"In the 19th century the medieval Gothic style became popular again.","國會大樓和 St Pancras 車站都是 19 世紀哥德式建築的例子。"],["3659135","s",4,"Which architect designed New Delhi to be the seat of government in India?",["Sir Edwin Lutyens","Sir Norman Foster","Sir Christopher Wren","Inigo Jones"],"After the First World War he designed many war memorials, including the Cenotaph in Whitehall.","Sir Edwin Lutyens 設計了印度政府所在地新德里，亦設計了 Whitehall 的 Cenotaph。"],["8b9e63f","s",4,"What was Lancelot 'Capability' Brown famous for in the 18th century?",["Designing the grounds around country houses","Designing cathedrals in the Gothic style","Building canals for the new factories","Painting portraits of the Royal Family"],"He designed landscapes to look natural, with grass, trees and lakes.","Lancelot 'Capability' Brown 是 18 世紀的園林設計師，為鄉村大宅設計園景。"],["b65c42c","s",4,"Which annual event showcases garden design from Britain and around the world?",["The Chelsea Flower Show","The Great Exhibition","The Edinburgh Festival","The Eden Project Fair"],"Gardens continue to be an important part of homes in the UK.","Chelsea Flower Show 每年展示英國和世界各地的園藝設計。"],["0a42f38","s",4,"Thomas Chippendale was an 18th-century designer of what?",["Furniture","Ceramics","Clothing","Gardens"],"Clarice Cliff designed Art Deco ceramics, and Sir Terence Conran was a 20th-century interior designer.","Thomas Chippendale 是 18 世紀的傢俬設計師。"],["3ae8c57","m",4,"Which TWO are leading British fashion designers of recent years?",["Mary Quant","Vivienne Westwood","Clarice Cliff","Gertrude Jekyll"],"Alexander McQueen is another leading fashion designer.","Mary Quant 和 Vivienne Westwood 都是著名的英國時裝設計師，Alexander McQueen 亦是。"],["39aba09","m",4,"Which TWO British writers have won the Nobel Prize in Literature?",["Sir William Golding","Harold Pinter","Jane Austen","Charles Dickens"],"Several British writers have won the Nobel Prize in Literature, including the novelist Sir William Golding and the playwright Harold Pinter.","小說家 Sir William Golding 和劇作家 Harold Pinter 都曾獲諾貝爾文學獎。"],["6df0094","s",4,"Which novel was voted the country's best-loved novel in 2003?",["The Lord of the Rings","Pride and Prejudice","Oliver Twist","Harry Potter and the Philosopher's Stone"],"It was written by JRR Tolkien.","2003 年 JRR Tolkien 的 The Lord of the Rings 獲選為全國最受喜愛的小說。"],["8ebacb1","s",4,"What is the Man Booker Prize awarded for?",["Fiction","Poetry","Journalism","Drama"],"It has been awarded since 1968. Winners include Ian McEwan, Hilary Mantel and Julian Barnes.","Man Booker Prize 自 1968 年起頒發，表揚小說作品。"],["d1485e1","s",4,"Who wrote Pride and Prejudice and Sense and Sensibility?",["Jane Austen","Charles Dickens","Thomas Hardy","J K Rowling"],"Her novels are concerned with marriage and family relationships.","Pride and Prejudice 和 Sense and Sensibility 都是 Jane Austen 的作品。"],["2b4bf1c","s",4,"Who wrote Oliver Twist and Great Expectations?",["Charles Dickens","Thomas Hardy","Robert Louis Stevenson","Evelyn Waugh"],"Characters such as Scrooge and Mr Micawber come from his novels.","Oliver Twist 和 Great Expectations 是 Charles Dickens 的作品。"],["420801c","s",4,"Who wrote Treasure Island and Kidnapped?",["Robert Louis Stevenson","Sir Arthur Conan Doyle","Rudyard Kipling","Graham Greene"],"He also wrote Dr Jekyll and Mr Hyde.","Treasure Island 和 Kidnapped 是 Robert Louis Stevenson 的作品。"],["bc3240b","s",4,"Who wrote Far from the Madding Crowd and Jude the Obscure?",["Thomas Hardy","Jane Austen","Sir Kingsley Amis","Charles Dickens"],"Hardy was an author and poet whose best-known novels focus on rural society.","Far from the Madding Crowd 和 Jude the Obscure 是 Thomas Hardy 的作品。"],["fa3d367","s",4,"Which fictional detective was created by Sir Arthur Conan Doyle?",["Sherlock Holmes","Hercule Poirot","Miss Marple","James Bond"],"Conan Doyle was a Scottish doctor and writer.","蘇格蘭醫生兼作家 Sir Arthur Conan Doyle 創作了偵探 Sherlock Holmes。"],["a791c9e","s",4,"Who wrote Brideshead Revisited?",["Evelyn Waugh","Graham Greene","Sir Kingsley Amis","Thomas Hardy"],"Waugh wrote satirical novels, including Decline and Fall and Scoop.","Brideshead Revisited 是 Evelyn Waugh 的作品。"],["ca95e73","s",4,"Who wrote the novel Lucky Jim?",["Sir Kingsley Amis","Evelyn Waugh","Roald Dahl","Graham Greene"],"Amis was an English novelist and poet who wrote more than 20 novels.","Lucky Jim 是 Sir Kingsley Amis 的小說。"],["dbb88f9","s",4,"Which of these novels was written by Graham Greene?",["Brighton Rock","Scoop","Kidnapped","Sense and Sensibility"],"His novels are often influenced by his religious beliefs and include The Heart of the Matter and Our Man in Havana.","Brighton Rock 是 Graham Greene 的小說。"],["716e925","s",4,"Who wrote the Harry Potter series?",["J K Rowling","Roald Dahl","JRR Tolkien","Dame Agatha Christie"],"The series has had enormous international success.","Harry Potter 系列由 J K Rowling 創作。"],["a4ada86","s",4,"What is Beowulf?",["An Anglo-Saxon poem","A Viking king","A Norman castle","A medieval play"],"It tells of the hero's battles against monsters and is still translated into modern English.","Beowulf 是一首盎格魯撒克遜時代的詩，講述英雄與怪物戰鬥。"],["db89ca4","s",4,"Who wrote the poem Paradise Lost?",["John Milton","William Blake","Lord Byron","William Wordsworth"],"Milton wrote poetry inspired by his religious views.","Paradise Lost 是 John Milton 的詩作。"],["6048dcd","s",4,"Which poet was inspired by nature and wrote The Daffodils?",["William Wordsworth","Robert Browning","Wilfred Owen","John Milton"],"Other poets, including Sir Walter Scott, wrote poems inspired by Scotland.","William Wordsworth 的詩受大自然啟發，The Daffodils 是他的作品。"],["dafb829","m",4,"Which TWO poets were inspired to write about their experiences in the First World War?",["Wilfred Owen","Siegfried Sassoon","John Milton","William Blake"],"Owen wrote Anthem for Doomed Youth.","Wilfred Owen 和 Siegfried Sassoon 都以第一次世界大戰的經歷寫詩。"],["022d6f0","s",4,"Where is Poets' Corner, in which some of the best-known poets are buried or commemorated?",["Westminster Abbey","St Paul's Cathedral","Canterbury Cathedral","York Minster"],"Poets' Corner is in Westminster Abbey in London.","Poets' Corner 位於倫敦 Westminster Abbey，很多著名詩人葬於此處或在此受紀念。"],["711df2a","s",4,"Who wrote the poem The Tyger?",["William Blake","Lord Byron","John Keats","Robert Browning"],"Blake was one of the poets of the 19th century.","The Tyger 是 William Blake 的詩作。"],["b5342d1","s",4,"Who wrote the poem Home Thoughts from Abroad?",["Robert Browning","William Wordsworth","Lord Byron","Wilfred Owen"],"Robert Browning and his wife Elizabeth Browning were both poets.","Home Thoughts from Abroad 是 Robert Browning 的詩作。"],["c79bf91","s",4,"What is an allotment?",["A piece of land rented to grow fruit and vegetables","A share of the profits of a local business","A seat reserved for a peer in the House of Lords","A discount on council tax for people living alone"],"A lot of people have gardens at home, and some rent additional land called an allotment.","Allotment 是供人租用來種植蔬果的小塊土地。"],["6ba73b4","m",4,"Which TWO famous gardens are in England?",["Kew Gardens","Sissinghurst","Bodnant Garden","Mount Stewart"],"Hidcote is also in England. Bodnant Garden is in Wales and Mount Stewart is in Northern Ireland.","Kew Gardens 和 Sissinghurst 在英格蘭；Bodnant Garden 在威爾斯，Mount Stewart 在北愛爾蘭。"],["78e0d97","s",4,"In which country is Bodnant Garden?",["Wales","Scotland","England","Northern Ireland"],"Crathes Castle and Inveraray Castle are in Scotland and Mount Stewart is in Northern Ireland.","Bodnant Garden 位於威爾斯。"],["adffa6c","s",4,"In which country are the gardens of Crathes Castle and Inveraray Castle?",["Scotland","Wales","England","Northern Ireland"],"These are two of the famous gardens to visit in Scotland.","Crathes Castle 和 Inveraray Castle 的花園位於蘇格蘭。"],["449e0a0","s",4,"Which traditional food is associated with Scotland?",["Haggis","Ulster fry","Welsh cakes","Yorkshire pudding"],"Haggis is a sheep's stomach stuffed with offal, suet, onions and oatmeal.","Haggis 是蘇格蘭傳統食物，在羊胃內釀入內臟、板油、洋蔥和燕麥。"],["fe87d41","s",4,"What is an Ulster fry?",["A fried meal with bacon, eggs, sausage and soda bread","A cake made from flour, dried fruits and spices","Roast beef served with potatoes and Yorkshire puddings","A sheep's stomach stuffed with offal, onions and oatmeal"],"It is a traditional food of Northern Ireland and also includes white pudding, tomatoes, mushrooms and potato bread.","Ulster fry 是北愛爾蘭的傳統煎製餐，有煙肉、蛋、香腸、黑布甸和梳打麵包等。"],["f78192d","s",4,"Welsh cakes are a traditional Welsh snack. What are they made from?",["Flour, dried fruits and spices","Oatmeal, suet and onions","Potatoes and cabbage","Bread and cheese"],"They can be served either hot or cold.","Welsh cakes 是威爾斯傳統小食，用麵粉、乾果和香料製成，冷熱皆可食用。"],["2fa0093","s",4,"Which meal is a traditional food of England?",["Roast beef with Yorkshire puddings","Haggis with turnips and potatoes","An Ulster fry with soda bread","Welsh cakes with dried fruit"],"Fish and chips are also popular.","烤牛肉配馬鈴薯、蔬菜和 Yorkshire pudding 是英格蘭的傳統食物，炸魚薯條亦很受歡迎。"],["0fb3ec6","s",4,"In which year were films first shown publicly in the UK?",["1896","1851","1922","1936"],"Film screenings soon became very popular.","電影於 1896 年首次在英國公開放映。"],["f9a567f","s",4,"Sir Charles (Charlie) Chaplin became famous in silent movies for playing what kind of character?",["A tramp","A detective","A king","A soldier"],"He was one of many British actors who made a career in Hollywood.","Sir Charlie Chaplin 在默片中以流浪漢角色成名。"],["874dc5a","s",4,"Who directed the film The 39 Steps in 1935?",["Sir Alfred Hitchcock","David Lean","Ridley Scott","Sir Alexander Korda"],"Hitchcock later left for Hollywood and remained an important film director until his death in 1980.","1935 年的電影 The 39 Steps 由 Sir Alfred Hitchcock 執導。"],["7e94397","m",4,"Which TWO films were directed by David Lean?",["Brief Encounter","Lawrence of Arabia","Chariots of Fire","The Third Man"],"Brief Encounter was made in 1945 and Lawrence of Arabia in 1962.","Brief Encounter（1945）和 Lawrence of Arabia（1962）都由 David Lean 執導。"],["8235c95","s",4,"What claim is made by Ealing Studios?",["To be the oldest continuously working film studio in the world","To have made the first British film with sound and colour","To be the largest cinema complex anywhere in Europe","To be the place where television was first demonstrated"],"British studios flourished in the 1930s.","Ealing Studios 自稱是全球持續運作時間最長的電影製片廠。"],["868692d","s",4,"Which animated characters feature in three of the films for which Nick Park has won Oscars?",["Wallace and Gromit","Scrooge and Mr Micawber","Morecambe and Wise","Torvill and Dean"],"Nick Park has won four Oscars for his animated films.","Nick Park 憑動畫電影贏得四座奧斯卡，其中三部的主角是 Wallace and Gromit。"],["d3383e3","s",4,"What are the BAFTAs?",["The British equivalent of the Oscars","Annual awards for British pop music","Prizes for the best contemporary art","Awards for theatre in London's West End"],"The annual British Academy Film Awards are hosted by the British Academy of Film and Television Arts.","BAFTA（British Academy Film Awards）相當於英國的奧斯卡。"],["6f236d7","m",4,"Which TWO are British actors who have won Oscars?",["Kate Winslet","Tilda Swinton","Mary Quant","Dame Kelly Holmes"],"Others include Colin Firth, Sir Antony Hopkins and Dame Judi Dench.","Kate Winslet 和 Tilda Swinton 都是奧斯卡得獎的英國演員，其他還有 Colin Firth、Sir Antony Hopkins 和 Dame Judi Dench。"],["36cd1ef","s",4,"Which are the two highest-grossing film franchises produced in the UK?",["James Bond and Harry Potter","Carry On and Monty Python","Sherlock Holmes and Miss Marple","Wallace and Gromit and Paddington"],"Britain continues to be particularly strong in special effects and animation.","占士邦和哈利波特是英國製作的兩個最高票房電影系列。"],["944a8b8","s",4,"What was Punch, first published in the 1840s?",["A satirical magazine","A radio comedy","A music hall in London","A daily newspaper"],"Today political cartoons continue to be published in newspapers, and magazines such as Private Eye continue the tradition of satire.","Punch 是 1840 年代創刊的諷刺雜誌，今天 Private Eye 等雜誌延續這個傳統。"],["0494e2b","s",4,"Who were Morecambe and Wise?",["Comedians who became stars of television","Composers of 19th-century comic operas","Olympic gold medallists in ice dancing","Scientists who pioneered IVF therapy"],"They started in music hall and went on to become television stars.","Morecambe and Wise 是喜劇演員，後來成為電視明星。"],["e975a8b","s",4,"Which television programme introduced a new type of progressive comedy in 1969?",["Monty Python's Flying Circus","Coronation Street","That Was The Week That Was","Spitting Image"],"Satire shows included That Was The Week That Was in the 1960s and Spitting Image in the 1980s.","1969 年的 Monty Python's Flying Circus 帶來了嶄新的喜劇風格。"],["4c08960","m",4,"Which TWO are popular soap operas on British television?",["Coronation Street","EastEnders","The Mousetrap","Under Milk Wood"],"Regular soap operas such as these are popular in the UK.","Coronation Street 和 EastEnders 都是英國受歡迎的電視肥皂劇。"],["7353429","s",4,"Who needs a television licence in the UK?",["Everyone who watches TV on a television, computer or other device","Only people who own more than one television set","Only people who watch programmes on the BBC","Only people over 30 who own their home"],"One licence covers all of the equipment in one home.","凡擁有用來收看電視的電視機、電腦或其他裝置的人，都要有電視牌照。一個牌照涵蓋同一住所的所有裝置。"],["95d2238","s",4,"People rent different rooms in a shared house. What is the rule about TV licences?",["Each person must buy a separate TV licence","One licence covers the whole house","Only the landlord needs a licence","No licence is needed in a shared house"],"One licence covers all of the equipment in one home, except when people rent different rooms in a shared house.","如果多人在同一間屋分租不同房間，每人都要各自購買電視牌照。"],["7306553","s",4,"What is the maximum fine for watching TV without a licence?",["£1,000","£100","£250","£5,000"],"You will receive a fine of up to £1,000 if you watch TV but do not have a TV licence.","沒有電視牌照而收看電視，最高可罰款 £1,000。"],["f953a51","s",4,"What discount on a TV licence can blind people get?",["50%","10%","25%","100%"],"Blind people can get a 50% discount.","失明人士可享電視牌照半價優惠。"],["3fa5e84","s",4,"What does the money from TV licences pay for?",["The BBC","The National Lottery","Commercial television channels","The National Trust"],"The BBC is a British public service broadcaster providing television and radio programmes.","電視牌照費用於資助 BBC。"],["6edc535","t",4,"The BBC is the only wholly state-funded media organisation that is independent of government.",1,"It is the largest broadcaster in the world.","BBC 是唯一完全由國家資助而又獨立於政府的傳媒機構，亦是全球最大的廣播機構。"],["4ec6c26","s",4,"How old must you be to buy alcohol in a pub or night club?",["18","16","17","21"],"People under 18 may be allowed in some pubs with an adult.","在酒吧或夜店買酒必須年滿 18 歲。"],["f3e08f6","s",4,"At what age can people drink wine or beer with a meal in a hotel or restaurant, as long as they are with someone over 18?",["16","12","14","17"],"This includes the eating areas in pubs.","年滿 16 歲的人如有 18 歲以上人士陪同，可以在酒店或餐廳用膳時喝葡萄酒或啤酒。"],["ea6aa61","s",4,"From what time are pubs usually open during the day?",["11.00 am","7.00 am","9.00 am","3.00 pm"],"On Sundays they usually open from 12 noon.","酒吧一般由上午 11 時開始營業，星期日則由正午 12 時開始。"],["e2d01cf","m",4,"Which TWO are traditional pub games?",["Pool","Darts","Croquet","Bowls"],"Pub quizzes are also popular.","桌球（pool）和飛鏢是傳統的酒吧遊戲，酒吧問答比賽亦很流行。"],["3862ced","s",4,"How old must you be to go into a betting shop or gambling club?",["18","16","17","21"],"In the UK, people often enjoy a gamble on sports or other events.","進入投注站或賭博會所必須年滿 18 歲。"],["263db99","s",4,"What must all dogs wear in public places?",["A collar showing the owner's name and address","A muzzle covering the mouth and nose","A coat showing a council licence number","A lead that is no longer than one metre"],"Owners are also responsible for keeping their dog under control and for cleaning up after it in a public place.","狗隻在公眾地方必須戴上寫有主人姓名和地址的頸圈，主人亦要看管好狗隻並清理糞便。"],["b56c5a1","t",4,"It is against the law to treat a pet cruelly or to neglect it.",1,"Vaccinations and medical treatment for animals are available from veterinary surgeons.","虐待或疏忽照顧寵物屬違法。"],["e3e1448","s",4,"How many national parks are there in England, Wales and Scotland?",["15","5","10","25"],"They are areas of protected countryside that everyone can visit, and where people live, work and look after the landscape.","英格蘭、威爾斯和蘇格蘭共有 15 個國家公園。"],["66a863a","s",4,"What does the National Trust do?",["It works to preserve important buildings, coastline and countryside","It runs the National Lottery and shares out the prize money","It manages the motorways and main roads in England","It trains the tour guides at the Tower of London"],"It is a charity in England, Wales and Northern Ireland. Scotland has the National Trust for Scotland.","National Trust 是慈善機構，致力保育重要建築、海岸和郊野。蘇格蘭有 National Trust for Scotland。"],["a21dd7a","s",4,"What is Big Ben?",["The nickname of the great bell at the Houses of Parliament","The tallest office building in the City of London","The official name of the clock tower at Parliament","The statue of Nelson at the top of his column"],"The clock is over 150 years old and is a popular tourist attraction.","Big Ben 是國會大樓大鐘的暱稱，已有超過 150 年歷史。"],["71e49d0","s",4,"What was the clock tower at the Houses of Parliament named in 2012?",["Elizabeth Tower","Victoria Tower","Jubilee Tower","Westminster Tower"],"It was named in honour of Queen Elizabeth II's Diamond Jubilee.","2012 年國會大樓的鐘樓命名為 Elizabeth Tower，以紀念 Queen Elizabeth II 登基鑽禧。"],["3a0d609","s",4,"Where is the Eden Project?",["Cornwall","Kent","Snowdonia","The Lake District"],"Its biomes, which are like giant greenhouses, house plants from all over the world.","Eden Project 位於 Cornwall，巨型溫室（biomes）內種有世界各地的植物。"],["1e4eb2c","t",4,"Edinburgh Castle has a long history, dating back to the early Middle Ages.",1,"The castle is a dominant feature of the skyline of Edinburgh.","愛丁堡城堡的歷史可追溯至中世紀早期，是愛丁堡天際線上最顯眼的建築。"],["c8cabba","s",4,"Where is the Giant's Causeway?",["On the north-east coast of Northern Ireland","On the west coast of the Scottish Highlands","In the mountains of North Wales","On the south coast of England near Dover"],"It is a land formation of columns made from volcanic lava, formed about 50 million years ago.","Giant's Causeway 位於北愛爾蘭東北海岸，由約五千萬年前的火山熔岩形成的石柱組成。"],["f07d3fe","s",4,"What is the largest expanse of fresh water in mainland Britain?",["Loch Lomond","Windermere","Loch Ness","Wastwater"],"Loch Lomond and the Trossachs National Park covers 720 square miles in the west of Scotland.","Loch Lomond 是英國本土最大的淡水湖，所在的國家公園位於蘇格蘭西部，面積 720 平方英里。"],["2f4fadb","s",4,"Where is the London Eye?",["On the southern bank of the River Thames","In the middle of Hyde Park, near the Serpentine","Next to the Tower of London","In the Olympic Park at Stratford"],"It is a Ferris wheel that is 443 feet (135 metres) tall, built as part of the UK's celebration of the new millennium.","London Eye 位於泰晤士河南岸，是高 443 呎（135 米）的摩天輪，為慶祝千禧年而建。"],["dcab345","s",4,"Snowdonia is a national park in which part of the UK?",["North Wales","The Scottish Highlands","Northern Ireland","South-west England"],"Its most well-known landmark is Snowdon, the highest mountain in Wales.","Snowdonia 是北威爾斯的國家公園，最著名的地標是威爾斯最高的山 Snowdon。"],["2a0b8fb","s",4,"What are the tour guides at the Tower of London called?",["Yeoman Warders, also known as Beefeaters","Chelsea Pensioners, also known as Redcoats","Life Guards of the Household Cavalry","Gentlemen Ushers of the Black Rod"],"They tell visitors about the building's history. The Crown Jewels can be seen there.","倫敦塔的導賞員稱為 Yeoman Warders，又稱 Beefeaters。塔內可以參觀王冠珠寶。"],["91448c4","s",4,"What can visitors see at the Tower of London?",["The Crown Jewels","The Bayeux Tapestry","The Domesday Book","The Magna Carta"],"The Tower was first built by William the Conqueror after he became king in 1066.","遊客可以在倫敦塔參觀王冠珠寶（Crown Jewels）。倫敦塔最初由 William the Conqueror 於 1066 年登基後興建。"],["e3bcb32","s",4,"Which is England's largest national park?",["The Lake District","Snowdonia","The Peak District","Dartmoor"],"It is famous for its lakes and mountains and is very popular with climbers, walkers and sailors.","Lake District 是英格蘭最大的國家公園，以湖泊和山巒聞名。"],["53d574f","s",4,"In 2007, television viewers voted which place as Britain's favourite view?",["Wastwater","Windermere","Loch Lomond","Snowdon"],"Wastwater is in the Lake District, where the biggest stretch of water is Windermere.","2007 年電視觀眾選出 Lake District 的 Wastwater 為英國最喜愛的景色。"],["d24371e","m",5,"Which TWO of these were demands of the Chartists?",["Secret ballots","For MPs to be paid","Votes for women","The abolition of the monarchy"],"The Chartists campaigned in the 1830s and 1840s for six changes, including the vote for every man and elections every year.","Chartists 在 1830 和 1840 年代提出六項訴求，包括不記名投票、議員有薪酬、所有男性有投票權和每年選舉。"],["c11d0ea","s",5,"In which year was the voting age reduced to 18 for men and women?",["1969","1918","1928","1997"],"In 1928 men and women over 21 gained the vote. The age was reduced to 18 in 1969.","投票年齡於 1969 年降至 18 歲。"],["741550b","s",5,"What is special about the British constitution?",["It is not written down in any single document","It was written in 1215 and never changed","It can be changed only by the monarch","It applies only in England"],"It is described as 'unwritten'. The UK has never had a revolution which led permanently to a totally new system of government.","英國憲法並沒有寫在單一文件內，所以稱為「不成文憲法」。"],["787838b","m",5,"Which TWO of these are institutions of the British constitution?",["The monarchy","The judiciary","The BBC","The National Trust"],"Others include Parliament, the Prime Minister, the cabinet, the police, the civil service and local government.","君主和司法機構都是英國憲制的組成部分，其他還有國會、首相、內閣、警隊、公務員和地方政府。"],["9cc1ee9","s",5,"Who is the head of state of the UK?",["The monarch","The Prime Minister","The Speaker","The Archbishop of Canterbury"],"King Charles III is the head of state. He is also the head of the Commonwealth.","英國的國家元首是君主，現為 King Charles III，他同時是英聯邦元首。"],["c1bca9b","s",5,"Since when has King Charles III reigned?",["September 2022","June 1953","May 2010","January 2020"],"He became king on the death of his mother, Queen Elizabeth II, who had reigned for 70 years.","King Charles III 自 2022 年 9 月母親 Queen Elizabeth II 逝世後登基。女王在位 70 年。"],["fe276eb","s",5,"Who is the heir to the throne?",["Prince William","Prince Harry","Prince George","Princess Anne"],"Prince William, the Prince of Wales, is the King's eldest son.","王位繼承人是國王的長子 Prince William（威爾斯親王）。"],["494e3b9","s",5,"What does it mean that the UK has a constitutional monarchy?",["The monarch does not rule but appoints the government the people have chosen","The monarch writes the constitution and can change it at any time","The monarch is elected by Parliament for a term of five years","The monarch chooses which candidates may stand for Parliament"],"The monarch invites the leader of the party with the largest number of MPs, or the leader of a coalition, to become Prime Minister.","君主立憲制是指君主不管治國家，而是任命人民經民主選舉選出的政府。"],["d62dd7f","s",5,"What can the monarch do in relation to government policies?",["Advise, warn and encourage the Prime Minister","Reject any law that Parliament passes","Appoint the cabinet","Decide how taxes are spent"],"The monarch has regular meetings with the Prime Minister, but decisions on policies are made by the Prime Minister and cabinet.","君主可以向首相提出意見、警告和鼓勵，但政策由首相和內閣決定。"],["a517459","s",5,"What does the monarch do at the opening of each new parliamentary session?",["Makes a speech summarising the government's policies for the year ahead","Chooses a new Speaker for the House of Commons","Announces the date of the next General Election","Swears in the new judges and Chief Constables"],"This is one of the monarch's important ceremonial roles.","每年國會新會期開幕時，君主會發表演說，概述政府來年的政策。"],["08bedec","s",5,"What is the National Anthem of the UK?",["G
