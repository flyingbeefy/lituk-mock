od Save the King","Land of Hope and Glory","Rule, Britannia","Jerusalem"],"It is played at important national occasions and at events attended by the King or the Royal Family.","英國國歌是 God Save the King。"],["02936be","t",5,"The monarch represents the UK to the rest of the world and receives foreign ambassadors and high commissioners.",1,"The monarch also entertains visiting heads of state and makes state visits overseas.","君主對外代表英國，接見外國大使和高級專員。"],["cb5bdac","s",5,"What are the small areas into which the UK is divided for parliamentary elections called?",["Constituencies","Boroughs","Counties","Wards"],"Voters in each constituency elect their Member of Parliament in a General Election.","英國劃分為多個國會選區（constituencies），每個選區選出一名國會議員。"],["90a0e44","s",5,"What usually happens if no party wins a majority in a General Election?",["Two parties may join together to form a coalition","The monarch chooses the government","The election is held again within a week","The House of Lords forms the government"],"The party with the majority of MPs normally forms the government.","如果沒有政黨取得過半議席，兩個政黨可以組成聯合政府。"],["15b5c3f","m",5,"Which TWO are responsibilities of Members of Parliament?",["To represent everyone in their constituency","To scrutinise and comment on what the government is doing","To appoint judges","To command the armed forces"],"MPs also help to create new laws and debate important national issues.","國會議員的職責包括代表選區內所有人，以及監察和評論政府工作，亦協助立法和辯論國家大事。"],["03ae7d0","s",5,"What are members of the House of Lords known as?",["Peers","Ministers","Councillors","Magistrates"],"They are not elected by the people and do not represent a constituency.","上議院議員稱為 peers，他們不是由人民選出，亦不代表任何選區。"],["7868e02","t",5,"Members of the House of Lords are elected by the people.",0,"Members of the House of Lords, known as peers, are not elected.","上議院議員並非由人民選出。"],["ac5d49d","s",5,"Since 1958, what has the Prime Minister had the power to nominate?",["Life peers","Hereditary peers","Bishops","Judges"],"Life peers are appointed just for their own lifetime, usually after an important career in politics, business, law or another profession.","自 1958 年起，首相有權提名終身貴族（life peers）。"],["f2b52f8","s",5,"Who appoints life peers?",["The monarch, on the advice of the Prime Minister","The Speaker, after a debate in the House of Commons","The House of Commons, by a vote of all its MPs","The Archbishop of Canterbury"],"They also include people nominated by the leaders of the other main political parties or by an independent Appointments Commission.","終身貴族由君主按首相的建議任命。"],["52fab2e","s",5,"What happened to hereditary peers in 1999?",["They lost the automatic right to attend the House of Lords","They were given the right to vote in the House of Commons","They were all made life peers","They were abolished completely"],"They now elect a few of their number to represent them in the House of Lords.","1999 年起世襲貴族不再自動有權出席上議院，只可互選少數代表。"],["802785f","t",5,"The House of Commons has powers to overrule the House of Lords, but these are not used often.",1,"The House of Lords is normally more independent of the government and checks laws passed by the Commons.","下議院有權推翻上議院的決定，但很少使用。"],["9473bab","s",5,"Who chairs debates in the House of Commons?",["The Speaker","The Prime Minister","The Lord Chancellor","The Leader of the Opposition"],"The Speaker is the chief officer of the House of Commons and keeps order during debates.","下議院的辯論由議長（Speaker）主持，他負責維持秩序。"],["cbf9f7e","t",5,"The Speaker of the House of Commons is neutral and does not represent a political party.",1,"The Speaker is still an MP, however, and represents a constituency.","下議院議長保持中立，不代表任何政黨，但仍是國會議員並代表一個選區。"],["89f1cef","s",5,"How is the Speaker chosen?",["By other MPs in a secret ballot","By the Prime Minister and cabinet","By the monarch at the State Opening","By a public vote"],"The Speaker makes sure the opposition has a guaranteed amount of time to debate issues it chooses.","議長由其他國會議員以不記名投票選出。"],["2ede999","s",5,"How often must a General Election be held?",["At least every five years","Every two years","Every seven years","Only when the monarch decides"],"MPs are elected at a General Election.","大選最少每五年舉行一次。"],["c259ddf","s",5,"What is a by-election?",["An election held in a constituency when an MP dies or resigns","An election to choose new members of the House of Lords","A second vote held when the first result is a tie","An election held only for local councillors"],"A fresh election is held in that constituency.","如果國會議員去世或辭職，該選區便會舉行補選（by-election）。"],["a9794da","s",5,"What does 'first past the post' mean?",["The candidate who gets the most votes in a constituency is elected","The first party to register its candidates is given extra seats","Seats are shared out in proportion to each party's total vote","A candidate needs more than half of all votes to win"],"This is the system used to elect MPs.","First past the post 是指在每個選區得票最多的候選人當選，國會議員以這個制度選出。"],["dcee96f","s",5,"What is Hansard?",["The official report of proceedings in Parliament","The country house used by the Prime Minister","The register of people who are entitled to vote","The rules of debate in the House of Lords"],"Proceedings in Parliament are also broadcast on television.","Hansard 是國會議事的正式紀錄。"],["62d3753","s",5,"What is an MP's 'surgery'?",["A regular session where constituents can talk to their MP in person","A medical check that all new MPs must pass","A debate on health policy in the House of Commons","A weekly meeting between MPs and the Speaker"],"MPs, Assembly members and MSPs hold regular local surgeries.","議員的 surgery 是定期接見選民的時間，選民可以親身向議員反映問題。"],["f11f99a","s",5,"What is the official home of the Prime Minister?",["10 Downing Street","Buckingham Palace","Chequers","The Palace of Westminster"],"The Prime Minister also has a country house outside London called Chequers.","首相的官邸是 10 Downing Street，在倫敦以外另有鄉間別墅 Chequers。"],["c13e9ac","s",5,"What is Chequers?",["The Prime Minister's country house","The official report of Parliament","The home of the Speaker","The headquarters of the civil service"],"It is outside London. The Prime Minister's official home is 10 Downing Street.","Chequers 是首相在倫敦以外的鄉間別墅。"],["cd09733","s",5,"Who appoints the members of the cabinet?",["The Prime Minister","The monarch","The Speaker","The House of Lords"],"The Prime Minister appoints about 20 senior MPs to become ministers in charge of departments.","內閣成員由首相任命，約有 20 名資深議員出任各部門的大臣。"],["2efe9bf","s",5,"Which cabinet minister is responsible for the economy?",["The Chancellor of the Exchequer","The Home Secretary","The Foreign Secretary","The Secretary of State for Defence"],"Other ministers, called Secretaries of State, are responsible for subjects such as education, health and defence.","財政大臣（Chancellor of the Exchequer）負責經濟事務。"],["8f81a59","s",5,"Which cabinet minister is responsible for crime, policing and immigration?",["The Home Secretary","The Foreign Secretary","The Chancellor of the Exchequer","The Defence Secretary"],"The Home Secretary leads the Home Office.","內政大臣（Home Secretary）負責罪案、警務和入境事務。"],["2a7da71","s",5,"Which cabinet minister is responsible for managing relationships with foreign countries?",["The Foreign Secretary","The Home Secretary","The Chancellor of the Exchequer","The Speaker"],"The Foreign Secretary is one of the senior members of the cabinet.","外交大臣（Foreign Secretary）負責處理與外國的關係。"],["8fe7cb0","s",5,"How often does the cabinet usually meet?",["Weekly","Daily","Monthly","Once a year"],"The cabinet makes important decisions about government policy.","內閣通常每星期開會一次，就政府政策作出重要決定。"],["27e990c","s",5,"What is the opposition?",["The second-largest party in the House of Commons","All MPs who are not ministers","The House of Lords","The party that came last in the election"],"The leader of the opposition usually becomes Prime Minister if his or her party wins the next General Election.","反對黨是下議院第二大黨。"],["5082c78","s",5,"What is the shadow cabinet?",["Senior opposition MPs who challenge the government's ministers","The ministers who served in the previous government","A committee of peers that checks new laws","Senior civil servants who advise the cabinet"],"The leader of the opposition appoints them as 'shadow ministers'.","影子內閣由反對黨領袖任命的資深反對黨議員組成，負責質詢政府。"],["ca6ee35","s",5,"How often does Prime Minister's Questions take place while Parliament is sitting?",["Every week","Every day","Every month","Twice a year"],"The leader of the opposition leads in pointing out what they see as the government's failures or weaknesses.","國會開會期間，首相答問環節（Prime Minister's Questions）每星期舉行一次。"],["f6abd92","s",5,"What are MPs who do not represent any of the main political parties called?",["Independents","Life peers","Shadow ministers","Backbenchers"],"They usually represent an issue important to their constituency.","不代表任何主要政黨的國會議員稱為 independents（獨立議員）。"],["331559e","s",5,"What do pressure and lobby groups do?",["They try to influence government policy","They organise and count General Elections","They run local councils","They appoint senior civil servants"],"Examples include the CBI, which represents British business, Greenpeace and Liberty.","壓力團體和遊說團體嘗試影響政府政策，例子有代表英國商界的 CBI、Greenpeace 和 Liberty。"],["6ad0c5c","t",5,"Civil servants are politically neutral and are not political appointees.",1,"They are chosen on merit and support the government in developing and implementing its policies.","公務員政治中立，憑才能獲聘，不是政治任命。"],["c1bfecb","m",5,"Which TWO are core values of the civil service?",["Integrity","Impartiality","Party loyalty","Ambition"],"The core values are integrity, honesty, objectivity and impartiality, including being politically neutral.","公務員的核心價值是正直、誠實、客觀和不偏不倚（包括政治中立）。"],["bdc5558","s",5,"How are local authorities funded?",["By money from central government and by local taxes","Only by donations from local residents and businesses","Only by parking charges and fines","By profits from the National Lottery"],"Towns, cities and rural areas are governed by democratically elected councils, often called local authorities.","地方政府的經費來自中央政府撥款和地方稅收。"],["0cb8448","s",5,"How many local authorities does London have?",["33","12","50","129"],"The Greater London Authority and the Mayor of London coordinate policies across the capital.","倫敦有 33 個地方政府，由 Greater London Authority 和倫敦市長協調全市政策。"],["e4e6f6e","s",5,"When are local elections for councillors usually held?",["In May every year","In January every year","In September every two years","In November every five years"],"Many candidates stand for council election as members of a political party.","地方議員選舉每年 5 月舉行。"],["2177dfd","m",5,"Which TWO matters remain under the control of the central UK government?",["Defence","Foreign affairs","Education","Health"],"Immigration, taxation and social security also remain under central UK government control.","國防和外交仍由英國中央政府負責，入境、稅務和社會保障亦然；教育和醫療則已下放。"],["395abe1","s",5,"Where is the Welsh Parliament, the Senedd, based?",["Cardiff","Swansea","Newport","Bangor"],"It has 60 members, known as Members of the Senedd (MSs).","威爾斯議會（Senedd）位於卡迪夫，有 60 名議員。"],["baa962d","s",5,"How many members does the Senedd have?",["60","90","129","650"],"The Senedd has the power to make laws for Wales in areas such as education, health and housing.","Senedd 有 60 名議員，可就教育、醫療和房屋等範疇為威爾斯立法。"],["d22deb7","t",5,"Members of the Senedd can speak in either Welsh or English, and all its publications are in both languages.",1,"The Senedd is based in Cardiff, the capital of Wales.","Senedd 議員可以用威爾斯語或英語發言，所有刊物都以兩種語言出版。"],["49d393a","s",5,"How many members does the Scottish Parliament have?",["129","60","90","300"],"They are known as Members of the Scottish Parliament (MSPs) and are elected by a form of proportional representation.","蘇格蘭議會有 129 名議員（MSPs），以一種比例代表制選出。"],["6edc25e","s",5,"Where do Members of the Scottish Parliament meet?",["At Holyrood in Edinburgh","At Stormont in Belfast","In Cardiff Bay","In Glasgow City Chambers"],"The Scottish Parliament was formed in 1999.","蘇格蘭議會議員在愛丁堡的 Holyrood 開會。"],["364543a","s",5,"On which matters can the Scottish Parliament pass laws for Scotland?",["All matters not specifically reserved to the UK Parliament","Only those matters approved in advance by the House of Lords","Defence, foreign affairs and immigration only","Only matters to do with the Gaelic language"],"These include civil and criminal law, health, education, planning and additional tax-raising powers.","蘇格蘭議會可就所有沒有明確保留給英國國會的事務立法，包括民事和刑事法律、醫療、教育和規劃。"],["4fa967a","s",5,"Where does the Northern Ireland Assembly meet?",["At Stormont in Belfast","At Holyrood in Edinburgh","In Londonderry","In Cardiff Bay"],"Its elected members are known as MLAs, Members of the Legislative Assembly.","北愛爾蘭議會在貝爾法斯特的 Stormont 開會，議員稱為 MLAs。"],["2e917e4","s",5,"How many elected members does the Northern Ireland Assembly have?",["90","60","129","33"],"The members are known as MLAs and are elected with a form of proportional representation.","北愛爾蘭議會有 90 名民選議員。"],["96d6051","s",5,"The Northern Ireland Assembly was established soon after which agreement in 1998?",["The Belfast (Good Friday) Agreement","The Treaty of Rome","The Act of Union","The Statute of Rhuddlan"],"There is a power-sharing agreement which distributes ministerial offices among the main parties.","北愛爾蘭議會在 1998 年 Belfast Agreement（又稱 Good Friday Agreement）之後不久成立，並實行權力分享安排。"],["88ea63f","s",5,"What voting system is used to elect members of the devolved parliaments and assemblies?",["A form of proportional representation","The system called 'first past the post'","A show of hands at public meetings","Appointment by the monarch"],"MPs in the House of Commons, by contrast, are elected by first past the post.","各權力下放議會的議員以比例代表制選出，下議院議員則以 first past the post 選出。"],["1cd9dab","t",5,"The UK government has the power to suspend all devolved assemblies.",1,"It has used this power several times in Northern Ireland.","英國政府有權中止所有權力下放議會的運作，並曾多次在北愛爾蘭行使這項權力。"],["97fd1c6","t",5,"By law, radio and television coverage of the political parties must be balanced.",1,"The UK has a free press, meaning that what is written in newspapers is free from government control.","法律規定電台和電視對各政黨的報道必須持平；報章則不受政府控制。"],["d89f372","s",5,"Since which year has the UK had a fully democratic voting system?",["1928","1832","1918","1969"],"That was the year women gained the vote at the same age as men. The present voting age of 18 was set in 1969.","英國自 1928 年起有全面民主的投票制度，當年女性取得與男性相同的投票權。"],["1a2ce9a","s",5,"Which of these groups can vote in all UK public elections?",["Adult UK citizens, and resident citizens of the Commonwealth and Ireland","Anyone who has lived in the UK for at least one year","Only adults who were born in the UK or its territories","Only adults who pay income tax or National Insurance"],"You must also have your name on the electoral register.","英國成年公民，以及居於英國的英聯邦和愛爾蘭共和國公民，可以在所有公共選舉中投票。"],["8fe6e6b","s",5,"What must you have your name on in order to vote?",["The electoral register","The council tax list","The National Insurance register","The census"],"If you are eligible to vote, you can register by contacting your local council electoral registration office.","要投票，名字必須在選民登記冊（electoral register）上。"],["f0b0700","s",5,"When is the electoral register updated each year?",["September or October","January or February","April or May","July or August"],"An electoral registration form is sent to every household and has to be completed and returned.","選民登記冊每年 9 或 10 月更新，每戶都會收到登記表格。"],["29cbf99","s",5,"Which part of the UK uses a system called 'individual registration' for the electoral register?",["Northern Ireland","Wales","Scotland","England"],"All those entitled to vote must complete their own registration form.","北愛爾蘭採用「個人登記」制度，每名合資格選民都要自行填寫登記表格。"],["2eab6c9","s",5,"Where do people go to vote in elections?",["Polling stations","Magistrates' courts","Police stations","Job centres"],"They are called polling places in Scotland. Before an election you are sent a poll card.","選民到投票站（polling stations，蘇格蘭稱 polling places）投票，選舉前會收到投票通知卡。"],["013ea8b","s",5,"What are the opening hours of polling stations on election day?",["7.00 am to 10.00 pm","9.00 am to 5.00 pm","8.00 am to 8.00 pm","6.00 am to midnight"],"If it is difficult for you to get to a polling station, you can register for a postal ballot.","選舉日投票站由上午 7 時開放至晚上 10 時，不便前往的人可以登記郵寄投票。"],["1453707","m",5,"Which TWO groups of people may NOT stand for public office?",["Members of the armed forces","Civil servants","Teachers","Doctors"],"People found guilty of certain criminal offences are also excluded.","軍人和公務員不可以參選公職，被裁定干犯某些刑事罪行的人亦不可以。"],["fdf9464","t",5,"Members of the House of Lords may stand for election to the House of Commons.",0,"They may not stand for election to the House of Commons but are eligible for all other public offices.","上議院議員不可以參選下議院，但可以擔任其他所有公職。"],["1dc42a5","s",5,"How can the public listen to debates in the Palace of Westminster?",["From public galleries in both Houses","Only by buying a ticket online","Only if invited by the Prime Minister","The public is never allowed in"],"You can write to your local MP in advance to ask for tickets or queue on the day. Entrance is free.","公眾可以在下議院和上議院的公眾席旁聽辯論，可預先寫信向議員索取門票或即日排隊，費用全免。"],["d5621a4","s",5,"What is the Commonwealth?",["An association of countries that support each other and work together","A military alliance of European and North American countries","A group of countries that share a single currency","The parliament of the British overseas territories"],"Most member states were once part of the British Empire, though a few countries which were not have also joined.","英聯邦是一個國家聯盟，成員互相支持並為共同目標合作。大部分成員國曾屬大英帝國。"],["34174d5","s",5,"Who is the ceremonial head of the Commonwealth?",["The King","The Prime Minister","The Secretary-General of the United Nations","The Archbishop of Canterbury"],"The Commonwealth is based on the core values of democracy, good government and the rule of law.","英聯邦的禮儀元首是國王。"],["0a0097f","t",5,"Membership of the Commonwealth is voluntary.",1,"The Commonwealth has no power over its members, although it can suspend membership.","加入英聯邦屬自願性質。英聯邦無權管轄成員國，但可以暫停其成員資格。"],["d6fac12","s",5,"What is the Council of Europe responsible for?",["Protecting and promoting human rights in its member countries","Setting interest rates for countries that use the euro","Organising the military defence of western Europe","Running elections to the European Parliament"],"It is separate from the EU.","Council of Europe 負責在成員國保護和促進人權，與歐盟是兩個不同的組織。"],["099cf50","t",5,"The Council of Europe has the power to make laws.",0,"It has no power to make laws but draws up conventions and charters, the best known being the European Convention on Human Rights.","Council of Europe 無權立法，但會草擬公約和憲章，最著名的是《歐洲人權公約》。"],["9dc08db","s",5,"What are the aims of the United Nations?",["To prevent war and promote international peace and security","To promote free trade and a single currency for its members","To defend member countries in Europe and North America","To promote the English language"],"It was set up after the Second World War and has more than 190 member countries.","聯合國的宗旨是防止戰爭，促進國際和平與安全，在第二次世界大戰後成立，有超過 190 個成員國。"],["aa1ee6a","s",5,"How many members are there on the UN Security Council?",["15","5","28","54"],"The UK is one of the five permanent members.","聯合國安全理事會有 15 個成員，英國是五個常任理事國之一。"],["be0cdfe","s",5,"What is NATO?",["A group of countries that have agreed to help each other if attacked","An organisation that protects human rights in Europe","A trade agreement between the Commonwealth countries","A court that settles disputes between governments"],"It also aims to maintain peace between all of its members.","北約（NATO）是歐洲和北美國家組成的組織，成員同意在受到攻擊時互相協助。"],["fb59eaf","s",5,"Which treaty, signed on 25 March 1957, set up the European Economic Community?",["The Treaty of Rome","The Treaty of Paris","The Treaty of Versailles","The Treaty of Union"],"It was signed by six countries: Belgium, France, Germany, Italy, Luxembourg and the Netherlands.","歐洲經濟共同體由 1957 年 3 月 25 日簽署的《羅馬條約》成立，創始成員有六國。"],["840d324","s",5,"What does criminal law relate to?",["Crimes, usually investigated by the police and punished by the courts","Disputes between landlords and tenants over repairs","Disagreements between workers and employers about wages","Arguments between individuals about unpaid debts"],"Civil law, by contrast, is used to settle disputes between individuals or groups.","刑事法律處理罪行，一般由警方調查，並由法庭判處刑罰；民事法律則用於解決個人或團體之間的糾紛。"],["0ded061","m",5,"Which TWO are examples of civil law?",["Housing law","Employment law","Carrying a weapon","Selling tobacco to someone under 18"],"Civil law also covers consumer rights and debt.","房屋法和僱傭法屬民事法律，消費者權益和債務亦是。"],["c185552","m",5,"Which TWO are examples of criminal offences?",["Carrying a weapon","Selling or buying drugs such as heroin and cannabis","Being owed money","Unfair dismissal from a job"],"Debt and unfair dismissal are matters of civil law.","攜帶武器和買賣海洛英、大麻等毒品都是刑事罪行；債務和不公平解僱屬民事範疇。"],["39d2c77","t",5,"It is legal to carry a weapon if it is only for self-defence.",0,"It is a criminal offence to carry a weapon of any kind, even if it is for self-defence.","即使為了自衛，攜帶任何武器都屬刑事罪行。"],["1733fac","s",5,"It is illegal to sell tobacco products to anyone under what age?",["18","16","17","21"],"It is also against the law to smoke tobacco products in nearly all enclosed public places.","向 18 歲以下人士售賣煙草產品屬違法。"],["51d727c","t",5,"It is a criminal offence to buy alcohol for people who are under 18.",1,"It is also an offence to sell alcohol to anyone under 18.","為 18 歲以下人士買酒，或向他們賣酒，都是刑事罪行。"],["07c3452","s",5,"What is a racial crime?",["Causing harassment, alarm or distress because of religion or ethnic origin","Refusing to register to vote in a General Election","Travelling within the UK without carrying a passport","Speaking a language other than English in a public place"],"It is a criminal offence.","因他人的宗教或族裔而對其造成騷擾、驚恐或困擾，屬刑事罪行。"],["382a342","m",5,"Which TWO are part of the job of the police?",["To protect life and property","To prevent and detect crime","To decide whether someone is guilty","To set prison sentences"],"The police also prevent disturbances, which is known as keeping the peace.","警察的職責包括保護生命財產、防止和偵查罪案，以及維持治安。"],["cd9b82d","s",5,"Who heads each police force?",["A Chief Constable","A Home Secretary","A magistrate","A mayor"],"The police are organised into a number of separate police forces and are independent of the government.","每支警隊由 Chief Constable（警察總長）領導，警隊獨立於政府。"],["c4d1b13","s",5,"What do Police and Crime Commissioners (PCCs) do?",["Set local police priorities and the local policing budget","Judge the most serious cases in the Crown Court","Train new police officers and support officers","Investigate complaints made against judges"],"They are directly elected by the public in England and Wales and appoint the local Chief Constable.","Police and Crime Commissioners 由英格蘭和威爾斯的市民直接選出，負責訂定地區警務優先次序和預算，並任命 Chief Constable。"],["d418256","s",5,"What do Police Community Support Officers (PCSOs) do?",["Patrol the streets and support police officers at crime scenes","Decide the sentences given in the Magistrates' Court","Run the local council's housing and parking services","Inspect schools and report to the government"],"PCSOs have different powers according to the area they work in.","PCSOs 通常在街上巡邏、與市民合作，並在罪案現場和大型活動支援警員。"],["1f2b756","s",5,"Who is responsible for interpreting the law and ensuring that trials are conducted fairly?",["Judges","The police","The Home Secretary","Members of Parliament"],"Judges together are called the judiciary.","法官負責解釋法律並確保審訊公平進行，法官整體稱為 judiciary（司法機構）。"],["ad7c8b3","t",5,"The government can interfere with the decisions of the judiciary.",0,"The government cannot interfere with the judiciary.","政府不可以干預司法。"],["f4aed23","s",5,"In England, Wales and Northern Ireland, where are most minor criminal cases dealt with?",["In a Magistrates' Court","In a Crown Court","In a County Court","In the High Court"],"In Scotland, minor criminal offences go to a Justice of the Peace Court.","在英格蘭、威爾斯和北愛爾蘭，大部分輕微刑事案件由 Magistrates' Court 處理；蘇格蘭則由 Justice of the Peace Court 處理。"],["958047d","s",5,"In Scotland, which court deals with minor criminal offences?",["A Justice of the Peace Court","A Magistrates' Court","A Crown Court","The Court of Session"],"Justices of the Peace are members of the local community.","蘇格蘭的輕微刑事案件由 Justice of the Peace Court 處理。"],["0f88da4","t",5,"In England, Wales and Scotland, magistrates and Justices of the Peace usually work unpaid and do not need legal qualifications.",1,"They receive training and are supported by a legal adviser.","在英格蘭、威爾斯和蘇格蘭，裁判官和太平紳士通常沒有薪酬，亦毋須法律資格，但會接受訓練並有法律顧問協助。"],["132240e","s",5,"In England, Wales and Northern Ireland, where are serious offences tried in front of a judge and jury?",["In a Crown Court","In a Magistrates' Court","In a County Court","In a Youth Court"],"In Scotland, serious cases are heard in a Sheriff Court.","在英格蘭、威爾斯和北愛爾蘭，嚴重罪行在 Crown Court 由法官和陪審團審理。"],["96b57ec","s",5,"In Scotland, where are the most serious criminal cases, such as murder, heard?",["At a High Court with a judge and jury","At a Justice of the Peace Court","At the Court of Session","At a Crown Court"],"Other serious cases are heard in a Sheriff Court with either a sheriff or a sheriff with a jury.","在蘇格蘭，謀殺等最嚴重的案件在 High Court 由法官和陪審團審理。"],["2c56ea3","s",5,"How many members does a jury have in England, Wales and Northern Ireland?",["12","9","10","15"],"In Scotland a jury has 15 members.","英格蘭、威爾斯和北愛爾蘭的陪審團有 12 人，蘇格蘭有 15 人。"],["719a10f","s",5,"How many members does a jury have in Scotland?",["15","9","12","20"],"In England, Wales and Northern Ireland a jury has 12 members.","蘇格蘭的陪審團有 15 人。"],["2066ac3","s",5,"How are members of a jury chosen?",["At random from the local electoral register","By the judge from a list of volunteers","By the police from people living nearby","By the local council from taxpayers"],"Everyone who is summoned to do jury service must do it unless they are not eligible or have a good reason.","陪審員從當地選民登記冊中隨機抽選，獲傳召的人除非不符合資格或有充分理由，否則必須出任。"],["a745eeb","s",5,"According to the handbook, which third verdict is possible in Scotland, in addition to 'guilty' and 'not guilty'?",["Not proven","Not known","No case","Undecided"],"The jury listens to the evidence and decides the verdict.","根據官方手冊，蘇格蘭除了「有罪」和「無罪」之外，還有第三種裁決「not proven」。"],["82a9e22","s",5,"If a jury finds a defendant guilty, who decides on the penalty?",["The judge","The jury","The police","The Home Secretary"],"The jury decides the verdict and the judge decides the penalty.","陪審團裁定被告有罪後，由法官決定刑罰。"],["88c2810","s",5,"In England, Wales and Northern Ireland, what ages does the Youth Court deal with?",["10 to 17","5 to 12","12 to 21","16 to 18"],"The case is normally heard in front of up to three specially trained magistrates or a District Judge.","在英格蘭、威爾斯和北愛爾蘭，Youth Court 處理 10 至 17 歲被告的案件。"],["3159a49","t",5,"Members of the public are allowed into Youth Courts, and the name of the accused young person can be published.",0,"Members of the public are not allowed in, and the name or photographs of the accused cannot be published.","公眾不可以進入 Youth Court，傳媒亦不可刊登被告的姓名或照片。"],["c2e6668","s",5,"What system is used in Scotland to deal with children and young people who have committed an offence?",["The Children's Hearings System","The system of youth conferencing","The Youth Court with three magistrates","The Sheriff's Panel"],"Northern Ireland has a system of youth conferencing.","蘇格蘭以 Children's Hearings System 處理犯事的兒童和青少年；北愛爾蘭則有 youth conferencing 制度。"],["ae4884a","s",5,"Which courts deal with a wide range of civil disputes in England, Wales and Northern Ireland?",["County Courts","Crown Courts","Youth Courts","Magistrates' Courts"],"These include people trying to get back money owed to them, personal injury, family matters, breaches of contract and divorce.","在英格蘭、威爾斯和北愛爾蘭，County Courts 處理各類民事糾紛，例如追討欠款、人身傷害、家庭事務和離婚。"],["81c724b","s",5,"In Scotland, where are the more serious civil cases dealt with?",["In the Court of Session in Edinburgh","In the Crown Court in Glasgow","In the High Court in London","In the Justice of the Peace Court"],"In England, Wales and Northern Ireland they are dealt with in the High Court.","在蘇格蘭，較嚴重的民事案件由愛丁堡的 Court of Session 處理。"],["0d53163","s",5,"What is the small claims procedure?",["An informal way of settling minor disputes without using a lawyer","A way of appealing against a sentence given by a magistrate","A fast criminal trial for people who plead guilty","A system for claiming state benefits and pensions"],"The hearing is held in front of a judge in an ordinary room, and people from both sides sit around a table.","小額錢債程序是一種非正式的方法，讓人毋須花大量時間和金錢聘請律師，便可解決小額糾紛。"],["2769deb","s",5,"What do solicitors do?",["Give legal advice and take action for their clients","Decide the verdict at the end of a criminal trial","Arrest and question people suspected of crimes","Draft new laws for Parliament to debate"],"Solicitors are trained lawyers.","Solicitors（事務律師）是受過訓練的律師，提供法律意見、代客戶採取行動並在法庭代表客戶。"],["bb6442a","s",5,"What did the Human Rights Act 1998 do?",["It put the European Convention on Human Rights into UK law","It gave women the vote at the same age as men","It set up the National Health Service across the UK","It abolished the death penalty in all parts of the UK"],"The government, public bodies and the courts must follow the principles of the Convention.","1998 年的 Human Rights Act 把《歐洲人權公約》納入英國法律。"],["1e22c66","s",5,"In which year was the UK one of the first countries to sign the European Convention on Human Rights?",["1950","1945","1973","1998"],"British diplomats and lawyers had an important role in drafting the Convention.","英國於 1950 年成為最早簽署《歐洲人權公約》的國家之一。"],["643f255","m",5,"Which TWO principles are included in the European Convention on Human Rights?",["The right to life","The prohibition of torture","The right to free housing","The right to a paid job"],"Others include the right to a fair trial, freedom of thought, conscience and religion, and freedom of expression.","生命權和禁止酷刑都是《歐洲人權公約》的原則，其他還有公平審訊權、思想和宗教自由及言論自由。"],["9a05589","s",5,"UK laws ensure that people are not treated unfairly because of which of these?",["Age, disability, sex, race, religion or sexuality","Their choice of political party and nothing else","Their income and savings and nothing else","Their job title and employer and nothing else"],"Pregnancy and maternity, and marital status, are also covered.","英國法律確保任何人不會因年齡、殘疾、性別、種族、宗教或性取向等原因而受到不公平對待。"],["c098162","t",5,"Anyone who is violent towards their partner can be prosecuted, whether they are a man or a woman, married or living together.",1,"Brutality and violence in the home is a serious crime in the UK.","任何人對伴侶使用暴力都可被檢控，不論男女、已婚或同居。"],["53c7d41","t",5,"Taking a girl or woman abroad for female genital mutilation (FGM) is a criminal offence.",1,"FGM, also known as cutting or female circumcision, is illegal in the UK.","女性割禮（FGM）在英國屬違法，把女童或婦女帶到外國進行亦是刑事罪行。"],["d73cf57","s",5,"Which of these statements about forced marriage is correct?",["A forced marriage, where one or both parties do not give their consent, is a criminal offence","A forced marriage is acceptable if the families agree"],"Arranged marriages, where both parties agree to the marriage, are acceptable in the UK.","強迫婚姻（一方或雙方沒有同意）是刑事罪行；雙方都同意的安排婚姻則可以接受。"],["d508360","s",5,"In which year were Forced Marriage Protection Orders introduced for England, Wales and Northern Ireland?",["2008","1998","2011","1969"],"Similar Protection Orders were introduced in Scotland in November 2011.","Forced Marriage Protection Orders 於 2008 年在英格蘭、威爾斯和北愛爾蘭實施，蘇格蘭於 2011 年 11 月推出類似命令。"],["ce5a5a6","m",5,"On which TWO types of income do people in the UK pay income tax?",["Wages from paid employment","Income from property","Lottery winnings","Birthday presents"],"Tax is also paid on profits from self-employment, taxable benefits, pensions, savings and dividends.","受僱工資和物業收入都要繳納入息稅，自僱利潤、退休金、儲蓄利息和股息亦要。"],["4897e0b","s",5,"What is the system called in which an employer automatically takes income tax from an employee's pay?",["Pay As You Earn (PAYE)","Self-assessment","National Insurance","Council tax"],"The tax is paid directly to HM Revenue & Customs (HMRC).","僱主自動從僱員薪金扣除入息稅並直接交給 HMRC，這個制度稱為 Pay As You Earn（PAYE）。"],["4b98b5a","s",5,"How do self-employed people pay their income tax?",["Through a system called self-assessment","Through Pay As You Earn","Through their council tax bill","Through their bank automatically"],"This includes completing a tax return.","自僱人士透過 self-assessment（自行評稅）制度交稅，需要填寫報稅表。"],["13c9dc5","s",5,"Which government department collects taxes?",["HM Revenue & Customs (HMRC)","The Home Office","The Department for Work and Pensions","The Bank of England"],"Money raised from income tax pays for government services such as roads, education, police and the armed forces.","HM Revenue & Customs（HMRC）負責徵稅。"],["3ac1600","s",5,"What is the money raised from National Insurance Contributions used for?",["State benefits and services such as the state pension and the NHS","Building and repairing motorways and bridges","Paying the salaries of MPs and peers","Funding the BBC's television and radio"],"Almost everybody in the UK who is in paid work, including self-employed people, must pay them.","國民保險供款用於國家福利和服務，例如國家退休金和 NHS。"],["2ac9f3d","s",5,"When are young people in the UK sent their National Insurance number?",["Just before their 16th birthday","When they are born","On their 18th birthday","When they finish university"],"It is a unique personal account number which makes sure that the contributions and tax you pay are properly recorded.","英國的年青人在 16 歲生日前不久會收到國民保險號碼。"],["dea054c","s",5,"A non-UK national living in the UK and looking for work may need to apply for a National Insurance number through which department?",["The Department for Work and Pensions","The Driver and Vehicle Licensing Agency","HM Revenue & Customs","The Home Office"],"You can start work without a National Insurance number.","居於英國並正在找工作的非英國公民，可能需要透過 Department for Work and Pensions（DWP）申請國民保險號碼。"],["272356f","s",5,"How old must you be to drive a car or motorcycle in the UK?",["17","16","18","21"],"You must also have a driving licence. You need to be at least 16 to ride a moped.","在英國駕駛汽車或電單車必須年滿 17 歲，駕駛 moped（輕便電單車）則須年滿 16 歲。"],["045c01c","s",5,"Until what age can drivers use their driving licence before they have to renew it?",["70","60","65","80"],"After that, the licence is valid for three years at a time.","駕駛執照可用至 70 歲，其後每次有效期為三年。"],["e90bb02","s",5,"In Northern Ireland, what must a newly qualified driver display for one year after passing the test?",["An 'R' plate","An 'L' plate","A 'P' plate","A tax disc"],"The R stands for restricted driver.","在北愛爾蘭，新考獲駕駛執照的司機在考試合格後一年內必須展示 'R' 牌（restricted driver）。"],["91c60e4","s",5,"If you have a driving licence from a country outside the EU, Iceland, Liechtenstein and Norway, for how long can you use it in the UK?",["Up to 12 months","Up to 3 months","Up to 5 years","Until it expires"],"To continue driving after that, you must get a UK full driving licence.","持有其他國家的駕駛執照，在英國最多可使用 12 個月，其後必須考取英國正式駕駛執照。"],["6eb85ab","s",5,"Where must a car in the UK be registered?",["At the Driver and Vehicle Licensing Agency (DVLA)","At the Department for Work and Pensions (DWP)","At HM Revenue & Customs (HMRC)","At the nearest police station"],"You must also pay an annual vehicle tax.","在英國，汽車必須在 DVLA（Driver and Vehicle Licensing Agency）登記。"],["c90bd38","s",5,"How often must a vehicle over three years old take an MOT test?",["Every year","Every six months","Every two years","Every five years"],"It is an offence not to have an MOT certificate if your vehicle is more than three years old.","車齡超過三年的車輛每年都要接受 MOT 檢驗。"],["2b0a02f","t",5,"It is a serious criminal offence to drive without motor insurance.",1,"It is also illegal to allow someone to use your car if they are not insured to drive it.","無保險駕駛是嚴重的刑事罪行。"],["1242d3c","m",5,"Which TWO are responsibilities of school governors?",["Setting the strategic direction of the school","Monitoring and evaluating school performance","Teaching lessons","Marking national exams"],"They also ensure accountability. In Scotland they are members of school boards.","校董的職責包括訂定學校的策略方向、監察和評估學校表現，以及確保問責。"],["403a8ee","s",5,"From what age can you apply to become a school governor?",["18","16","21","25"],"There is no upper age limit.","年滿 18 歲便可以申請成為校董，沒有年齡上限。"],["23721f9","t",5,"You have to tell a canvasser how you intend to vote if you are asked.",0,"Members of political parties may knock on doors and ask for support, but you do not have to tell them how you intend to vote.","拉票人員上門詢問時，你不一定要透露自己打算怎樣投票。"],["575f124","m",5,"Which TWO are ways in which you can help with local services?",["Becoming a special constable","Becoming a magistrate","Standing for the House of Lords","Becoming a Chief Constable"],"You can also be a lay (non-police) representative or a school governor.","擔任 special constable（義務警員）或裁判官都是協助地方服務的方法。"],["93ca1b8","s",5,"About how long does it take to give blood?",["About an hour","About five minutes","About four hours","A whole day"],"Donated blood is used by hospitals to help people with a wide range of injuries and illnesses.","捐血大約需要一小時。"],["27d25f7","s",5,"Which organ can a living person donate?",["A kidney","A heart","Both lungs","A stomach"],"Many people in the UK are waiting for organ transplants, and you can register to be an organ donor.","在生的人可以捐出一個腎。"],["85d925b","m",5,"Which TWO charities work with the homeless?",["Crisis","Shelter","Age UK","PDSA"],"Age UK works with older people, and the PDSA works with animals.","Crisis 和 Shelter 是幫助無家者的慈善機構；Age UK 服務長者，PDSA 照顧動物。"],["939c893","s",5,"Which charity works with children?",["The NSPCC","Age UK","The PDSA","Friends of the Earth"],"NSPCC stands for the National Society for the Prevention of Cruelty to Children.","NSPCC（National Society for the Prevention of Cruelty to Children）是服務兒童的慈善機構。"],["64b8d57","s",5,"What does the PDSA do?",["It helps animals whose owners cannot afford vet fees","It gives free legal advice to tenants and homeless people","It supports older people who are living alone","It campaigns to protect the environment"],"PDSA stands for the People's Dispensary for Sick Animals.","PDSA（People's Dispensary for Sick Animals）幫助主人負擔不起獸醫費用的動物。"],["c56ae46","s",5,"Which of these charities works for the environment?",["Friends of the Earth","Crisis","Barnardo's","Cancer Research UK"],"The National Trust also works to preserve the environment.","Friends of the Earth 是環保慈善機構，National Trust 亦致力保育環境。"],["60ce1d2","s",5,"What is volunteering?",["Working for good causes without payment","Working part-time for the council","Paying a monthly amount to a charity","Serving in the armed forces"],"It is an important way of contributing to your community and a chance to meet new people.","義務工作是指為公益事務無償工作。"],["f92292c","m",5,"Which TWO actions help to protect the environment?",["Recycling as much of your waste as you can","Walking and using public transport","Leaving lights on when you go out","Buying products that have travelled a long way"],"Shopping locally also helps, by supporting businesses in your community and reducing your carbon footprint.","盡量回收廢物、步行和使用公共交通工具都有助保護環境。"],["c16bf57","s",5,"Why is shopping for products locally good for the environment?",["Products have not travelled as far, so your carbon footprint is smaller","Local shops are not allowed to use any plastic packaging","Local products are always free of VAT and other taxes","Local shops use less electricity because they open for fewer hours"],"It also helps to support businesses and farmers in your area.","購買本地產品可以減少貨物的運輸距離，從而減低碳足跡，亦有助支持本地商戶和農民。"],["875f462","t",5,"Getting to know your neighbours can help you to become part of the community and make friends.",1,"Being a good neighbour also helps to prevent problems and conflicts.","認識鄰居有助你融入社區和結交朋友。"],["1819b5b","s",3,"Which of these statements about the Battle of Hastings is correct?",["Harold, the Saxon king of England, was killed in the battle","William, Duke of Normandy, was killed in the battle"],"William defeated Harold in 1066 and became king of England.","1066 年 Hastings 戰役中，撒克遜國王 Harold 陣亡，William 勝出並成為英格蘭國王。"],["b40a2c5","s",3,"Which of these statements about the Wars of the Roses is correct?",["The symbol of the House of York was a white rose","The symbol of the House of York was a red rose"],"The red rose was the symbol of the House of Lancaster.","York 家族的標誌是白玫瑰，紅玫瑰是 Lancaster 家族的標誌。"],["4a56bbf","s",3,"Which of these statements about Elizabeth I is correct?",["She never married and had no children of her own to inherit the throne","She was succeeded on the throne by her eldest son"],"When she died in 1603 her heir was her cousin, James VI of Scotland.","Elizabeth I 終身未婚，沒有子女繼承王位，1603 年去世後由表親蘇格蘭國王 James VI 繼位。"],["6df8ec2","s",3,"Which of these statements about the English Civil War is correct?",["The Roundheads supported Parliament","The Roundheads supported the king"],"The king's supporters were called the Cavaliers.","內戰中 Roundheads 支持國會，支持國王的是 Cavaliers。"],["f2ee9ba","s",3,"Which of these statements about James II of England is correct?",["He was also James VII of Scotland","He was also James VI of Scotland"],"James VI of Scotland was the earlier king who became James I of England in 1603.","James II 在蘇格蘭稱為 James VII。James VI 是較早的國王，1603 年成為英格蘭的 James I。"],["9a812fd","s",3,"Which of these statements about the Act of Union of 1707 is correct?",["It united England and Wales with Scotland","It united Great Britain with Ireland"],"Ireland was unified with Great Britain later, in 1801.","1707 年的 Act of Union 把英格蘭、威爾斯與蘇格蘭合併；愛爾蘭要到 1801 年才合併。"],["ca7c7c6","s",3,"Which of these statements about the end of slavery is correct?",["Trading slaves in British ships became illegal before slavery was abolished throughout the Empire","Slavery was abolished throughout the Empire before trading slaves in British ships became illegal"],"The slave trade was banned in 1807 and the Emancipation Act followed in 1833.","1807 年先禁止以英國船隻販賣奴隸，1833 年的 Emancipation Act 才在整個帝國廢除奴隸制。"],["8aae7e1","s",3,"Which of these statements about Admiral Nelson is correct?",["He was killed at the Battle of Trafalgar","He was killed at the Battle of Waterloo"],"Trafalgar was a sea battle in 1805. Waterloo, in 1815, was won by the Duke of Wellington.","Nelson 在 1805 年的 Trafalgar 海戰中陣亡；1815 年的 Waterloo 戰役由 Duke of Wellington 取勝。"],["bb9732b","s",3,"Which of these statements about Ireland in 1922 is correct?",["Northern Ireland remained part of the UK","The whole of Ireland left the UK"],"The six counties in the north, which were mainly Protestant, remained part of the UK.","1922 年以新教徒為主的北部六個郡留在英國，成為北愛爾蘭。"],["58cccae","s",3,"Which of these statements about the European Economic Community (EEC) is correct?",["The UK was not one of the six founding members","The UK was one of the six founding members"],"The EEC was formed in 1957 by West Germany, France, Belgium, Italy, Luxembourg and the Netherlands. The UK joined in 1973.","英國不是歐洲經濟共同體的六個創始成員國之一，1973 年才加入。"],["f879a4c","s",4,"Which of these statements about patron saints' days is correct?",["St Andrew's Day is on 30 November","St Andrew's Day is on 1 March"],"1 March is St David's Day, the patron saint of Wales.","St Andrew's Day 是 11 月 30 日；3 月 1 日是威爾斯主保聖人 St David 的紀念日。"],["2224366","s",4,"Which of these statements about the Giant's Causeway is correct?",["It is in Northern Ireland","It is in Scotland"],"It is on the north-east coast of Northern Ireland.","Giant's Causeway 位於北愛爾蘭東北海岸。"],["61802ed","s",4,"Which of these statements about British Olympians is correct?",["Sir Steve Redgrave is a rower and Sir Chris Hoy is a cyclist","Sir Steve Redgrave is a cyclist and Sir Chris Hoy is a rower"],"Redgrave won rowing gold in five consecutive Olympic Games. Hoy is a Scottish cyclist.","Sir Steve Redgrave 是賽艇運動員，Sir Chris Hoy 是單車運動員。"],["360396c","s",4,"Which of these statements about the Proms is correct?",["They have been organised by the BBC since 1927","They have been organised by the Royal Family since 1927"],"The Proms is an eight-week summer season of orchestral classical music.","The Proms 自 1927 年起由 BBC 主辦。"],["00a4c65","s",4,"Which of these statements about Eid al-Fitr is correct?",["It celebrates the end of Ramadan","It celebrates the start of Ramadan"],"Ramadan is the month in which Muslims fast.","Eid al-Fitr 慶祝齋戒月 Ramadan 結束。"],["ed15fbf","s",4,"Which of these statements about Snowdon is correct?",["It is the highest mountain in Wales","It is the highest mountain in Scotland"],"Snowdon is the best-known landmark of Snowdonia, a national park in North Wales.","Snowdon 是威爾斯最高的山，位於北威爾斯的 Snowdonia 國家公園。"],["72137cf","s",4,"Which of these statements about the Cenotaph in Whitehall is correct?",["It was designed by Sir Edwin Lutyens","It was designed by Sir Christopher Wren"],"Wren designed St Paul's Cathedral after the Great Fire of London.","Whitehall 的 Cenotaph 由 Sir Edwin Lutyens 設計；Sir Christopher Wren 設計的是 St Paul's Cathedral。"],["9763642","s",4,"Which of these statements about Lent is correct?",["It begins on Ash Wednesday","It begins on Shrove Tuesday"],"Shrove Tuesday, or Pancake Day, is the day before Lent starts.","Lent 由 Ash Wednesday 開始；Shrove Tuesday（Pancake Day）是 Lent 開始前一天。"],["6cb767c","s",5,"Which of these statements about the Speaker of the House of Commons is correct?",["The Speaker is an MP and represents a constituency","The Speaker is a member of the House of Lords"],"The Speaker is neutral and does not represent a political party.","下議院議長本身是國會議員並代表一個選區，但保持政治中立。"],["6d7ca91","s",5,"Which of these statements about the United Nations is correct?",["The UK is one of the five permanent members of the Security Council","The UK is a temporary member of the Security Council, elected every two years"],"The Security Council has 15 members.","英國是聯合國安全理事會五個常任理事國之一。"],["72e7355","s",5,"Which of these statements about the devolved parliaments is correct?",["The Scottish Parliament sits at Holyrood and the Northern Ireland Assembly at Stormont","The Scottish Parliament sits at Stormont and the Northern Ireland Assembly at Holyrood"],"Holyrood is in Edinburgh and Stormont is in Belfast.","蘇格蘭議會位於愛丁堡的 Holyrood，北愛爾蘭議會位於貝爾法斯特的 Stormont。"],["ea29b39","s",5,"Which of these statements about the MOT test is correct?",["A vehicle over three years old must take one every year","A vehicle over ten years old must take one every three years"],"It is an offence to drive a vehicle over three years old without an MOT certificate.","車齡超過三年的車輛每年都要接受 MOT 檢驗。"],["97ade70","s",5,"Which of these statements about the Council of Europe is correct?",["It is separate from the European Union","It is the law-making body of the European Union"],"The Council of Europe has no power to make laws.","Council of Europe 與歐盟是兩個不同的組織，亦無權立法。"],["ded14b6","s",5,"Which of these statements about electing Members of Parliament is correct?",["MPs are elected through a system called 'first past the post'","MPs are elected through a system of proportional representation"],"Proportional representation is used for the devolved parliaments and assemblies.","國會議員以 first past the post 制度選出；比例代表制則用於各權力下放議會。"],["3b45f5d","s",5,"Which of these statements about life peers is correct?",["They are appointed for their own lifetime only","They pass their title on to their eldest child"],"Life peers are appointed by the monarch on the advice of the Prime Minister.","終身貴族的爵位只限本人一生，不可世襲。"],["827c46d","s",1,"Which level of English speaking and listening must you show to become a permanent resident or citizen?",["Level B1","Level A1","Level C1","Level C2"],"You need speaking and listening skills at B1 of the Common European Framework of Reference.","申請永久居留或入籍，英語聽講能力須達到歐洲共同語言參考標準的 B1 級。"],["b620f5d","s",1,"Level B1 of the Common European Framework of Reference is equivalent to which qualification?",["ESOL Entry Level 3","ESOL Entry Level 1","A GCSE in English Literature","A university degree taught in English"],"B1 is equivalent to ESOL Entry Level 3.","B1 級相當於 ESOL Entry Level 3。"],["705dbd9","t",1,"The questions in the Life in the UK test are based on all parts of the official handbook.",1,"You should study the whole handbook, not only some chapters.","考試題目涵蓋官方手冊的所有部分，所以整本手冊都要溫習。"],["aae46b6","s",1,"Where can you take the Life in the UK test?",["Only at a registered and approved test centre","At any public library that has a computer room","At the offices of your local council","At home on your own computer"],"You can only take the test at a registered and approved Life in the UK test centre.","只可以在已註冊並獲認可的 Life in the UK 考試中心應考。"],["f2c2b15","t",1,"You can book the Life in the UK test in person at your local library.",0,"You can only book your test online.","考試只可以在網上預約。"],["3162f90","t",1,"If you do not bring the required identification to the test centre, you will not be able to take the test.",1,"You must take identification with you on the day of the test.","考試當日必須帶備所需的身份證明文件，否則不能應考。"],["1846bfd","s",1,"Which of these is one of the freedoms the UK offers in return for the responsibilities of residents?",["Freedom from unfair discrimination","Freedom from all taxation","Freedom to ignore court orders","Freedom to drive without a licence"],"The UK also offers freedom of belief and religion, freedom of speech and a right to a fair trial.","免受不公平歧視是英國給予居民的自由之一。"],["7b43903","m",1,"Which TWO are freedoms offered by the UK to its residents?",["Freedom of belief and religion","A right to join in the election of a government","A right to free public transport","A right to choose which laws to follow"],"Freedom of speech, freedom from unfair discrimination and a right to a fair trial are also offered.","信仰和宗教自由，以及參與選舉政府的權利，都是英國給予居民的自由。"],["455edbb","s",1,"In the pledge at a citizenship ceremony, what do new citizens promise to uphold?",["The UK's democratic values","The policies of the government of the day","The traditions of their local council","The rules of the Church of England"],"New citizens pledge to respect the UK's rights and freedoms, uphold its democratic values and observe its laws faithfully.","新公民在入籍儀式上承諾維護英國的民主價值、尊重其權利和自由，並忠誠地遵守法律。"],["70934a2","s",1,"Which of these is a fundamental principle of British life?",["Participation in community life","Membership of a trade union","Ownership of a home","Attendance at church"],"The five principles are democracy, the rule of law, individual liberty, tolerance and participation in community life.","參與社區生活是英國生活的五項基本原則之一。"],["5015946","s",2,"Which city is the capital of England?",["London","Manchester","Birmingham","York"],"London is the capital city of both England and the UK.","倫敦是英格蘭的首府，亦是英國的首都。"],["f8a0914","m",2,"Which TWO are British overseas territories?",["St Helena","The Falkland Islands","The Isle of Man","The Channel Islands"],"The Isle of Man and the Channel Islands are Crown dependencies, not overseas territories.","St Helena 和福克蘭群島是英國海外領土；馬恩島和海峽群島是皇家屬地。"],["07ebb1d","s",2,"Which of these is a country of Great Britain?",["Scotland","Northern Ireland","The Isle of Man","The Republic of Ireland"],"Great Britain is made up of England, Scotland and Wales.","蘇格蘭是大不列顛的一部分，大不列顛由英格蘭、蘇格蘭和威爾斯組成。"],["53598ff","t",2,"'Great Britain' and 'the United Kingdom' mean exactly the same thing.",0,"Great Britain is England, Scotland and Wales. The United Kingdom also includes Northern Ireland.","兩者並不相同：大不列顛只有英格蘭、蘇格蘭和威爾斯，聯合王國還包括北愛爾蘭。"],["020681c","s",2,"In the official handbook, the words 'Britain' and 'British' are used to refer to whom?",["Everyone in the UK","Only people born in England","Only people in Great Britain","Only people with a British passport"],"The handbook uses these words to refer to everyone in the UK.","手冊中 'Britain' 和 'British' 是指所有在英國的人。"],["dc09ec3","t",2,"The Isle of Man has its own government.",1,"The Isle of Man and the Channel Islands are Crown dependencies with their own governments.","馬恩島是皇家屬地，有自己的政府。"],["0c77c81","s",3,"From where did the ancestors of the first farmers in Britain probably come?",["South-east Europe","North Africa","Scandinavia","Central Asia"],"The first farmers arrived 6,000 years ago and built houses, tombs and monuments.","英國最早的農民的祖先可能來自東南歐。"],["0dc1e3f","s",3,"What was Stonehenge probably used for?",["As a special gathering place for seasonal ceremonies","As a market where farmers traded cattle and grain","As a fort to defend the area against the Romans","As a burial place for Anglo-Saxon kings"],"Stonehenge still stands in what is now the English county of Wiltshire.","巨石陣可能是舉行季節性儀式的特別聚集地。"],["e923180","s",3,"Around how long ago did people in Britain learn to make bronze?",["4,000 years ago","400 years ago","1,000 years ago","10,000 years ago"],"This period is called the Bronze Age. People were accomplished metalworkers who made objects in bronze and gold.","約四千年前，英國人學會製造青銅，這段時期稱為青銅時代。"],["85a84ee","s",3,"Who made the first coins to be minted in Britain?",["People of the Iron Age","Roman soldiers","Viking traders","Norman lords"],"Some of the coins were inscribed with the names of Iron Age kings. This marks the beginnings of British history.","英國最早的硬幣由鐵器時代的人鑄造，有些刻有鐵器時代國王的名字。"],["22b2081","t",3,"Hadrian's Wall is a UNESCO World Heritage Site.",1,"Parts of the wall, including the forts of Housesteads and Vindolanda, can still be seen.","Hadrian's Wall 是聯合國教科文組織世界遺產，部分城牆至今仍可參觀。"],["a32d4ff","s",3,"By about which year were Anglo-Saxon kingdoms established in Britain?",["AD 600","AD 43","AD 1066","55 BC"],"These kingdoms were mainly in what is now England.","到公元 600 年左右，盎格魯撒克遜各王國已在英國建立，主要位於今日的英格蘭。"],["372ce14","s",3,"The languages spoken by which people are the basis of modern-day English?",["The Anglo-Saxons","The Romans","The Picts","The Normans"],"The Jutes, Angles and Saxons came from northern Europe.","現代英語的基礎來自盎格魯撒克遜人所說的語言。"],["fc40f73","s",3,"William the Conqueror was the Duke of Normandy. Where is Normandy?",["In northern France","In southern Denmark","In western Germany","In northern Spain"],"William invaded England in 1066.","Normandy 位於法國北部。"],["82f0820","s",3,"In which country can the Bayeux Tapestry still be seen today?",["France","England","Norway","Belgium"],"It commemorates the Battle of Hastings.","Bayeux Tapestry 現存於法國。"],["9183ad3","t",3,"Many of the Viking invaders who stayed in Britain mixed with local communities, and some converted to Christianity.",1,"They settled especially in the Danelaw, in the east and north of England.","很多留下來的維京人與當地社群融合，部分更改信基督教。"],["2f09799","s",3,"The Middle Ages, or medieval period, are usually said to end in which year?",["1485","1066","1215","1603"],"The period covers about a thousand years from the end of the Roman Empire in AD 476.","中世紀一般由公元 476 年羅馬帝國滅亡起計，至 1485 年止。"],["fb39c1c","s",3,"In which year was the Battle of Bannockburn?",["1314","1066","1415","1485"],"Robert the Bruce defeated the English at Bannockburn.","Bannockburn 戰役發生於 1314 年。"],["80ef622","s",3,"In which year was the Battle of Agincourt?",["1415","1314","1348","1588"],"It is one of the most famous battles of the Hundred Years War.","Agincourt 戰役發生於 1415 年，是百年戰爭中最著名的戰役之一。"],["de89d56","s",3,"When did the English leave France at the end of the Hundred Years War?",["In the 1450s","In the 1340s","In the 1550s","In the 1650s"],"The English largely left France in the 1450s.","英格蘭人在 1450 年代撤出法國。"],["860dc61","s",3,"In the feudal system, what were serfs?",["Peasants who worked their lord's land and could not move away","Knights who fought for the king in return for land","Priests who collected taxes for the Church","Merchants who sold wool to other countries"],"Serfs had a small area of their lord's land where they could grow food, in return for working for him.","農奴（serfs）是替領主耕作的農民，不可以隨意離開。"],["17f1b1c","s",3,"In England, what did parliaments develop from?",["The king's council of advisers","The courts of the Roman governors","The meetings of the Viking chiefs","The councils of the Church"],"The council included important noblemen and the leaders of the Church.","英格蘭的國會由國王的顧問議會發展而來。"],["1b26e5b","s",3,"In the medieval English Parliament, who sat in the House of Lords?",["The nobility, great landowners and bishops","Knights and rich people from the towns","Judges chosen by the king","Serfs chosen by their lords"],"Knights and wealthy people from towns and cities were elected to sit in the House of Commons.","中世紀英格蘭國會的上議院由貴族、大地主和主教組成。"],["88b3401","m",3,"Which TWO castles were built in the Middle Ages and are still in use today?",["Windsor","Edinburgh","Maiden Castle","Housesteads"],"Many castles were built in Britain and Ireland in the Middle Ages. Others are in ruins.","Windsor 和愛丁堡城堡都建於中世紀，至今仍在使用。"],["297c7a9","s",3,"In the Middle Ages, from which country did glass manufacturers come to England?",["Italy","Holland","Germany","France"],"Weavers came from France, engineers from Germany and canal builders from Holland.","中世紀來英格蘭的玻璃製造者來自意大利。"],["6ccdc78","m",3,"Which TWO English words come from Anglo-Saxon?",["Apple","Cow","Park","Beauty"],"Summer also comes from Anglo-Saxon. Park and beauty come from Norman French.","Apple 和 cow 源自盎格魯撒克遜語；park 和 beauty 源自諾曼法語。"],["6afb0d8","s",3,"Which language developed in Scotland during the Middle Ages, alongside Gaelic?",["Scots","Welsh","Norman French","Latin"],"In Scotland, many people continued to speak Gaelic and the Scots language also developed.","中世紀的蘇格蘭除了蓋爾語之外，亦發展出 Scots 語。"],["bbb21e2","s",3,"What did Henry VII do to make sure England stayed peaceful after the Wars of the Roses?",["He strengthened central administration and reduced the power of the nobles","He divided the country between the Houses of Lancaster and York","He gave Parliament the right to choose the next king","He moved the royal court from London to York"],"His son Henry VIII continued the policy of centralising power.","Henry VII 加強中央行政並削減貴族的權力，以確保英格蘭在玫瑰戰爭後保持和平。"],["60ae1f9","s",3,"In which year did the Wars of the Roses begin?",["1455","1348","1485","1642"],"The war ended at the Battle of Bosworth Field in 1485.","玫瑰戰爭於 1455 年開始，1485 年結束。"],["0ac4b1c","s",3,"Which of Henry VIII's wives survived him?",["Catherine Parr","Catherine Howard","Anne Boleyn","Jane Seymour"],"Catherine Parr was a widow who married Henry late in his life.","Catherine Parr 是寡婦，在 Henry VIII 晚年嫁給他，並比他長壽。"],["5904c92","s",3,"Catherine of Aragon, Henry VIII's first wife, was a princess from which country?",["Spain","France","Germany","Portugal"],"Henry wanted to divorce her because she had not given him a surviving male heir.","Henry VIII 的第一任妻子 Catherine of Aragon 是西班牙公主。"],["3e13278","s",3,"How old was Edward VI when he died?",["15","9","21","38"],"He had ruled for just over six years and was succeeded by his half-sister Mary.","Edward VI 15 歲去世，在位僅六年多，由同父異母的姐姐 Mary 繼位。"],["5fbccbe","s",3,"What was the religion of Queen Mary I, the daughter of Henry VIII?",["Roman Catholic","Protestant","Puritan","Presbyterian"],"She was a devout Catholic and persecuted Protestants.","Mary I 是虔誠的天主教徒，曾迫害新教徒。"],["69ef976","s",3,"From which play by Shakespeare does the line 'To be or not to be' come?",["Hamlet","Macbeth","Romeo and Juliet","Henry V"],"Many lines from his plays and poems are still often quoted.","'To be or not to be' 出自莎士比亞的 Hamlet。"],["5c1d0f7","s",3,"From which play by Shakespeare does the line 'A rose by any other name' come?",["Romeo and Juliet","A Midsummer Night's Dream","Hamlet","As You Like It"],"Shakespeare was one of the first to portray ordinary Englishmen and women.","'A rose by any other name' 出自莎士比亞的 Romeo and Juliet。"],["dee4c3f","s",3,"Who was the son of Mary, Queen of Scots?",["James VI of Scotland","Charles I of England","Edward VI of England","Robert the Bruce"],"Mary gave her throne to her Protestant son when she fled to England.","Mary, Queen of Scots 的兒子是蘇格蘭的 James VI，她逃往英格蘭時把王位讓給這位信奉新教的兒子。"],["fcc09d1","s",3,"In which year did Elizabeth I die?",["1603","1558","1588","1649"],"She was succeeded by James VI of Scotland, who became James I of England.","Elizabeth I 於 1603 年去世。"],["b60ebfb","t",3,"English settlers first began to colonise the eastern coast of America in the time of Elizabeth I.",1,"This colonisation greatly increased in the next century.","英格蘭人在 Elizabeth I 時期開始在美洲東岸建立殖民地。"],["93c9479","s",3,"Who were the Puritans?",["A group of Protestants who wanted strict and simple religious doctrine and worship","A group of Catholics who wanted the Pope to lead the Church of England","Supporters of the king during the English Civil War","Scottish clans who refused to accept William III"],"Many Puritans opposed the religious reforms of Charles I.","Puritans（清教徒）是主張嚴格而簡樸的教義和崇拜方式的新教徒。"],["39fa181","s",3,"Why did Charles I recall Parliament in 1640?",["He needed funds for an army after a rebellion in Scotland","He wanted Parliament to approve his marriage","He wanted to declare war on Spain","He needed support against the Roundheads"],"He had tried to impose a revised Prayer Book on the Presbyterian Church in Scotland, which led to serious unrest.","Charles I 企圖在蘇格蘭長老教會強推新祈禱書而引發動亂，他需要軍費，於是在 1640 年重新召開國會。"],["d3f0315","s",3,"How many parliamentary leaders did Charles I try to arrest when he entered the House of Commons?",["Five","Two","Twelve","Twenty"],"They had been warned and were not there. No monarch has set foot in the Commons since.","Charles I 進入下議院試圖拘捕五名國會領袖，但他們事先得到消息而不在場。"],["fdb846a","m",3,"At which TWO battles did Oliver Cromwell defeat the army of Charles II?",["Dunbar","Worcester","Naseby","Bosworth Field"],"The Scots had declared Charles II king, but Cromwell defeated his army.","Cromwell 在 Dunbar 和 Worcester 兩場戰役擊敗 Charles II 的軍隊。"],["9b9387f","s",3,"Who became Lord Protector after the death of Oliver Cromwell in 1658?",["His son, Richard Cromwell","His brother, Thomas Cromwell","General Fairfax","Charles II"],"Richard was not able to control the army or the government.","Oliver Cromwell 於 1658 年去世後，兒子 Richard Cromwell 繼任 Lord Protector，但他無法控制軍隊和政府。"],["d44919d","s",3,"In which year was the monarchy restored under Charles II?",["1660","1649","1666","1688"],"Parliament invited Charles II to come back from exile in the Netherlands.","1660 年君主制復辟，Charles II 由荷蘭流亡回國。"],["7ebd87e","s",3,"Who became king when Charles II died in 1685?",["His brother, James II","His nephew, William of Orange","His cousin, George of Hanover","His son, Charles Edward Stuart"],"Charles II had no legitimate children. James was a Roman Catholic.","Charles II 沒有合法子女，1685 年去世後由信奉天主教的弟弟 James II 繼位。"],["7443b28","s",3,"William of Orange was the Protestant ruler of which country?",["The Netherlands","Denmark","Germany","Sweden"],"He was asked to invade England in 1688 and became William III.","William of Orange 是荷蘭的新教統治者，1688 年應邀入侵英格蘭，成為 William III。"],["7787247","s",3,"Which clan was killed at Glencoe after being late in taking an oath to William III?",["The MacDonalds","The Campbells","The Stuarts","The MacAlpins"],"All Scottish clans were required formally to accept William as king by taking an oath.","Glencoe 的 MacDonalds 氏族因為遲了宣誓效忠 William III 而被殺。"],["0ba413d","s",3,"In which year did the first Jews to come to Britain since the Middle Ages settle in London?",["1656","1215","1558","1707"],"Britain's population grew through the 17th century, and other groups such as the Huguenots also arrived.","1656 年，自中世紀以來第一批猶太人在倫敦定居。"],["bfe13e2","s",3,"What name is given to the system that developed after the Glorious Revolution, in which ministers gradually became more important than the monarch?",["Constitutional monarchy","Absolute monarchy","Feudalism","The Commonwealth"],"The monarch remained very important but could no longer insist on policies that Parliament did not agree with.","光榮革命後，大臣逐漸比君主更重要，這種制度稱為君主立憲制。"],["d028bce","t",3,"In the early 18th century, only men who owned property of a certain value were able to vote.",1,"No women at all had the vote.","18 世紀初只有擁有一定價值物業的男性才可以投票，女性完全沒有投票權。"],["e651f67","s",3,"Which monarch was on the throne when the Act of Union with Scotland was agreed in 1707?",["Queen Anne","Queen Victoria","William III","George I"],"Queen Anne had no surviving children, which created uncertainty over the succession.","1707 年與蘇格蘭合併時在位的是 Queen Anne。"],["42e9b4a","s",3,"Charles Edward Stuart, known as Bonnie Prince Charlie, was the grandson of which king?",["James II","Charles I","George I","William III"],"He landed in Scotland in 1745 and was supported by clansmen from the Scottish highlands.","Bonnie Prince Charlie 是 James II 的孫，1745 年在蘇格蘭登陸，得到高地氏族支持。"],["3c0f8a4","s",3,"Which principle was one of the most important ideas of the Enlightenment?",["Everyone should have the right to their own political and religious beliefs","The king is appointed by God and his decisions cannot be questioned by anyone","Only men who own land should be allowed to vote","The Church should control all schools and universities"],"The state should not try to dictate people's beliefs. This remains an important principle in the UK today.","啟蒙時代最重要的原則之一，是每個人都有權持有自己的政治和宗教信念，國家不應干預。"],["62bac34","s",3,"What was the East India Company originally set up to do?",["To trade","To govern India","To build railways","To spread Christianity"],"It later gained control of large parts of India.","East India Company 最初是為貿易而成立的，後來控制了印度大片地區。"],["b075331","s",3,"From which part of the world did slaves transported on British ships primarily come?",["West Africa","South America","East Asia","The Middle East"],"They were taken to America and the Caribbean to work on tobacco and sugar plantations.","英國船隻運送的奴隸主要來自西非，被帶到美洲和加勒比海的煙草和甘蔗種植園工作。"],["54002a6","s",3,"After slavery was abolished in 1833, who were employed to replace the freed slaves?",["2 million Indian and Chinese workers","Convicts sent from British prisons","Soldiers from the British army","Farm workers from Ireland and Wales"],"They worked on sugar plantations in the Caribbean, in mines in South Africa and on railways in East Africa.","1833 年廢除奴隸制後，僱用了約二百萬名印度和中國工人取代獲釋的奴隸。"],["e00dc34","s",3,"In which year did Britain recognise the independence of the American colonies?",["1783","1776","1707","1815"],"The colonies had declared their independence in 1776.","英國於 1783 年承認美洲殖民地獨立。"],["f45fc75","s",3,"In which year did the French Revolution begin?",["1789","1689","1815","1848"],"The new French government soon declared war on Britain, and Napoleon later became Emperor of France.","法國大革命於 1789 年爆發，其後拿破崙成為法國皇帝。"],["f808f06","s",3,"Which nickname was given to the Duke of Wellington?",["The Iron Duke","The Bard","The Lord Protector","The Conqueror"],"He defeated Napoleon at the Battle of Waterloo in 1815 and later became Prime Minister.","Duke of Wellington 人稱 Iron Duke，1815 年在 Waterloo 擊敗拿破崙，後來出任首相。"],["5964d46","s",3,"What is the cross of St Patrick, which appears on the Union Flag?",["A diagonal red cross on a white ground","A diagonal white cross on a blue ground","A red cross on a white ground","A green cross on a white ground"],"St Patrick is the patron saint of Ireland.","St Patrick 十字是白底紅色斜十字。"],["8994a7b","s",3,"What is the Union Flag also often called?",["The Union Jack","The Royal Standard","The St George's Cross","The Red Ensign"],"It combines the crosses of St George, St Andrew and St Patrick.","英國國旗（Union Flag）又常稱為 Union Jack。"],["4300f72","s",3,"What does the official Welsh flag show?",["A Welsh dragon","A daffodil","A red cross","A harp"],"The Welsh dragon does not appear on the Union Flag.","威爾斯的官方旗幟上有一條威爾斯龍。"],["c441c19","s",3,"What was the population of the British Empire at its height during the Victorian period?",["More than 400 million","About 40 million","About 100 million","More than 2 billion"],"The Empire covered all of India, Australia and large parts of Africa.","維多利亞時期大英帝國的人口超過四億。"],["425c3c1","s",3,"Why did around 120,000 Russian and Polish Jews come to Britain between 1870 and 1914?",["To escape persecution","To work in the coal mines","To fight in the Boer War","To study at British universities"],"Many settled in London's East End and in Manchester and Leeds.","1870 至 1914 年間約有 12 萬俄羅斯和波蘭猶太人為逃避迫害來到英國，很多人在倫敦東區、Manchester 和 Leeds 定居。"],["cc1f744","s",3,"From which London station did Brunel's Great Western Railway run?",["Paddington","St Pancras","Euston","Waterloo"],"It ran to the south west of England, the West Midlands and Wales.","Brunel 的 Great Western Railway 由倫敦 Paddington 站出發。"],["6c7ff3c","s",3,"In which year was the Great Exhibition held?",["1851","1801","1837","1901"],"It showed goods and exhibits from all over the world, as well as British-made products.","萬國博覽會於 1851 年舉行。"],["e7e3d98","s",3,"During which years was the Crimean War fought?",["1853 to 1856","1803 to 1815","1899 to 1902","1914 to 1918"],"Britain fought with Turkey and France against Russia.","克里米亞戰爭於 1853 至 1856 年進行。"],["d9b9e4a","s",3,"In which country was Florence Nightingale born?",["Italy","England","Turkey","Germany"],"She was born in Italy to English parents and trained as a nurse in Germany at the age of 31.","Florence Nightingale 生於意大利，父母是英格蘭人，31 歲時在德國接受護士訓練。"],["762abc9","s",3,"To which country did Florence Nightingale go in 1854 to work in military hospitals?",["Turkey","Russia","France","India"],"She and her fellow nurses improved conditions in the hospitals and reduced the mortality rate.","1854 年 Florence Nightingale 前往土耳其的軍事醫院工作，改善環境並降低了死亡率。"],["69c33b9","m",3,"By 1861, which TWO British cities had large populations of Irish people?",["Liverpool","Glasgow","Norwich","Plymouth"],"London and Manchester also had large Irish populations by then.","到 1861 年，Liverpool 和 Glasgow 都有大量愛爾蘭人口，倫敦和 Manchester 亦然。"],["ffeb58c","s",3,"What did the Fenians want for Ireland?",["Complete independence","Home Rule within the UK","A union with Scotland","Rule by the Catholic Church"],"Others, such as Charles Stuart Parnell, advocated Home Rule instead.","Fenians 主張愛爾蘭完全獨立；Charles Stuart Parnell 等人則主張 Home Rule。"],["6269c86","s",3,"What did the Reform Act of 1867 do?",["It created more urban seats and reduced the property needed to vote","It gave the vote to every man and woman over 21","It allowed Catholics to sit in the House of Lords","It ended the right of the monarch to choose ministers"],"The majority of men still did not have the right to vote, and no women could vote.","1867 年的 Reform Act 增加了城市議席，並降低了投票所需的財產要求，但大部分男性仍未有投票權。"],["ea02374","s",3,"In which city was Emmeline Pankhurst born?",["Manchester","Liverpool","London","Birmingham"],"She was born in 1858 and set up the Women's Franchise League in 1889.","Emmeline Pankhurst 1858 年生於 Manchester。"],["4bc1038","m",3,"Which TWO methods were used by the suffragettes in their campaign?",["Chaining themselves to railings","Going on hunger strike","Standing for election to Parliament","Refusing to pay for the war"],"They used civil disobedience, which also included smashing windows and committing arson.","Suffragettes 採用公民抗命的手法，包括把自己鎖在欄杆上和絕食，亦有打破窗戶和縱火。"],["37cf99f","s",3,"Who wrote the poem If?",["Rudyard Kipling","Robert Burns","Dylan Thomas","William Blake"],"The poem has often been voted among the UK's favourite poems.","詩作 If 由 Rudyard Kipling 所寫。"],["e26016f","s",3,"In which year did the First World War begin?",["1914","1899","1916","1939"],"It ended on 11 November 1918.","第一次世界大戰於 1914 年爆發，1918 年 11 月 11 日結束。"],["82eda98","m",3,"Which TWO countries were allies of Britain in the First World War?",["France","Russia","Bulgaria","The Ottoman Empire"],"Britain's allies also included Japan, Belgium and Serbia, and later Greece, Italy, Romania and the United States.","法國和俄國是英國在第一次世界大戰的盟友；保加利亞和鄂圖曼帝國屬於同盟國。"],["929c6e5","s",3,"About how many British casualties were there in the First World War?",["More than 2 million","About 60,000","About 300,000","More than 20 million"],"The whole of the British Empire was involved in the conflict.","第一次世界大戰中英國有超過二百萬人傷亡。"],["0b84066","s",3,"In 1913 the British government promised 'Home Rule' for Ireland. Why were the changes postponed?",["The First World War broke out","The Great Depression began","Queen Victoria died","The Easter Rising failed"],"The proposal was to have a self-governing Ireland with its own parliament but still part of the UK.","1913 年英國政府答應讓愛爾蘭自治（Home Rule），但因第一次世界大戰爆發而擱置。"],["4d64daf","s",3,"In which year was a peace treaty signed between Britain and the Irish nationalists?",["1921","1916","1949","1998"],"In 1922 Ireland became two countries.","英國與愛爾蘭民族主義者於 1921 年簽署和約，1922 年愛爾蘭分成兩個國家。"],["73f3044","t",3,"Between 1930 and 1939, car ownership in the UK doubled from 1 million to 2 million.",1,"New industries such as the automobile and aviation industries developed in the inter-war period.","1930 至 1939 年間，英國的汽車擁有量由一百萬輛倍增至二百萬輛。"],["9359129","s",3,"Which economist published influential new theories of economics in the inter-war period?",["John Maynard Keynes","Adam Smith","William Beveridge","David Hume"],"It was also a time of cultural blossoming, with writers such as Graham Greene and Evelyn Waugh.","經濟學家 John Maynard Keynes 在兩次大戰之間發表了具影響力的經濟理論。"],["b667c68","s",3,"In which year did Adolf Hitler come to power in Germany?",["1933","1918","1929","1939"],"He believed that the conditions imposed on Germany after the First World War were unfair.","希特拉於 1933 年在德國上台。"],["2957cd3","s",3,"Until which event did Britain and the Empire stand almost alone against Nazi Germany?",["Germany's invasion of the Soviet Union in June 1941","The fall of France in June 1940","The D-Day landings in June 1944","The bombing of Coventry in November 1940"],"The United States entered the war after Pearl Harbor in December 1941.","在 1941 年 6 月德國入侵蘇聯之前，英國和大英帝國幾乎是孤軍對抗納粹德國。"],["49c5efd","s",3,"In the Second World War, where did the Japanese defeat the British before going on to occupy Burma?",["Singapore","Hong Kong","Australia","India"],"The war in the east continued until August 1945.","第二次世界大戰期間，日軍在新加坡擊敗英軍，其後佔領緬甸。"],["45fee2e","s",3,"Which English city was almost totally destroyed during the Blitz?",["Coventry","Oxford","Norwich","Bath"],"Despite the destruction, there was a strong national spirit of resistance.","Coventry 在 Blitz 期間幾乎全毀。"],["2591bf7","s",3,"What did Winston Churchill do before he became a Conservative MP in 1900?",["He was a soldier and journalist","He was a lawyer and judge","He was a doctor and scientist","He was a teacher and priest"],"Churchill was the son of a politician.","邱吉爾在 1900 年成為保守黨國會議員之前，曾是軍人和記者。"],["c69c110","s",3,"In which part of the UK was Alexander Fleming born?",["Scotland","Wales","Northern Ireland","England"],"He moved to London as a teenager and later qualified as a doctor.","Alexander Fleming 生於蘇格蘭，十多歲時移居倫敦，後來成為醫生。"],["fc0e2e4","s",3,"What was Alexander Fleming researching when he discovered penicillin?",["Influenza","Diabetes","Tuberculosis","Malaria"],"He made the discovery in 1928. Penicillin is still used to treat bacterial infections today.","Alexander Fleming 在 1928 年研究流感時發現了盤尼西林。"],["6d501f7","s",3,"What was Clement Attlee's profession before he gave it up to do social work in East London?",["Barrister","Doctor","Teacher","Journalist"],"He was born in London, studied at Oxford University and became a Labour MP.","Clement Attlee 原本是大律師，後來放棄執業到倫敦東區從事社會工作。"],["d08ccf9","s",3,"By what name is the 1942 report Social Insurance and Allied Services usually known?",["The Beveridge Report","The Butler Report","The Attlee Report","The Bevan Report"],"William Beveridge was a British economist and social reformer.","1942 年的報告 Social Insurance and Allied Services 通常稱為 Beveridge Report。"],["61962cf","s",3,"To which political party did R A Butler belong?",["The Conservative Party","The Labour Party","The Liberal Party","The Scottish National Party"],"He became a Conservative MP in 1923 and oversaw the Education Act 1944.","R A Butler 屬保守黨，1923 年成為國會議員，並主理 1944 年的 Education Act。"],["e894363","s",3,"Who wrote the poem Do Not Go Gentle into That Good Night?",["Dylan Thomas","Wilfred Owen","Rudyard Kipling","Robert Browning"],"He wrote it for his dying father in 1952. There are memorials to him in his birthplace, Swansea.","詩作 Do Not Go Gentle into That Good Night 是 Dylan Thomas 於 1952 年為垂危的父親而寫的。"],["bcbd799","s",3,"Which Prime Minister was famous for his 'wind of change' speech about decolonisation?",["Harold Macmillan","Clement Attlee","Winston Churchill","John Major"],"He was Prime Minister during the Conservative government of 1951 to 1964.","Harold Macmillan 以關於非殖民地化的 'wind of change' 演說聞名。"],["4fef584","m",3,"Which TWO changes took place in Britain during the 1960s?",["Laws on divorce and abortion were liberalised","Women gained the right to equal pay","The National Health Service was set up","Women over 30 gained the vote"],"It also became illegal for employers to discriminate against women because of their gender.","1960 年代英國放寬了離婚和墮胎法例，並通過法例給予女性同工同酬的權利。"],["e19ad86","s",3,"What did the immigration laws passed in the late 1960s require of immigrants?",["A strong connection to Britain through birth or ancestry","A university degree from a British university","A job offer in the coal or steel industry","A promise to serve in the armed forces"],"The government passed these laws to restrict immigration to Britain.","1960 年代後期通過的移民法例，要求移民因出生或祖籍而與英國有密切關係。"],["d27688f","s",3,"In which year did Concorde first fly?",["1969","1948","1976","2003"],"It began carrying passengers in 1976 and was retired from service in 2003.","Concorde 於 1969 年首航，1976 年開始載客，2003 年退役。"],["fe27cbc","m",3,"Which TWO people pioneered IVF therapy in Britain?",["Sir Robert Edwards","Patrick Steptoe","Sir Ian Wilmut","Sir Peter Mansfield"],"Edwards was a physiologist and Steptoe a gynaecologist.","試管嬰兒技術由生理學家 Sir Robert Edwards 和婦科醫生 Patrick Steptoe 在英國首創。"],["85b3cce","s",3,"In which year was the structure of the DNA molecule discovered?",["1953","1928","1969","1996"],"The discovery was made through work at British universities in London and Cambridge.","DNA 分子結構於 1953 年被發現。"],["d92c1c2","s",3,"On which date was information first successfully transferred via the World Wide Web?",["25 December 1990","1 January 2000","6 June 1984","11 November 1978"],"The Web was invented by Sir Tim Berners-Lee.","1990 年 12 月 25 日，資訊首次成功經萬維網傳送。"],["4f161f9","m",3,"Which TWO problems affected the British economy in the 1970s?",["Prices of goods and raw materials rose sharply","There were many strikes","The pound was replaced by the euro","The coal mines were nationalised"],"The exchange rate between the pound and other currencies was also unstable.","1970 年代英國經濟面對物價和原材料價格急升，以及多次罷工等問題。"],["a163acc","s",3,"About how many people lost their lives in the decades after 1969 in the violence in Northern Ireland?",["3,000","300","30,000","300,000"],"This period is known as the Troubles.","1969 年之後的數十年間，北愛爾蘭的暴力衝突（the Troubles）造成約三千人死亡。"],["e54cb5d","m",3,"Which TWO countries were among the six that formed the European Economic Community in 1957?",["Belgium","Italy","Spain","Denmark"],"The six were West Germany, France, Belgium, Italy, Luxembourg and the Netherlands.","比利時和意大利都是 1957 年成立歐洲經濟共同體的六個創始國之一。"],["b2f0d82","s",3,"In which year did Margaret Thatcher become Leader of the Conservative Party?",["1975","1959","1970","1979"],"She became Prime Minister in 1979.","戴卓爾夫人於 1975 年當選保守黨領袖，1979 年出任首相。"],["257b430","s",3,"With which US President did Margaret Thatcher work closely?",["Ronald Reagan","John F Kennedy","Bill Clinton","Franklin D Roosevelt"],"She was also one of the first Western leaders to recognise the changes in the leadership of the Soviet Union.","戴卓爾夫人與美國總統列根（Ronald Reagan）緊密合作。"],["02e2ce8","m",3,"Which TWO policies were introduced by the Conservative government of 1979 to 1990?",["Privatisation of nationalised industries","Legal controls on trade union powers","Creation of the National Health Service","Devolution to Scotland and Wales"],"Deregulation also saw a great increase in the role of the City of London as an international financial centre.","1979 至 1990 年的保守黨政府把國有企業私有化，並立法限制工會權力。"],["51e9d4e","s",3,"Roald Dahl was born in Wales. Where w
