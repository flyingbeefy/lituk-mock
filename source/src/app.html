<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life in the UK 模擬試</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
/* Layout: one centred column (max 760px) on a cool paper ground. Cards hold each task;
   "paper" cards carry a red margin rule like a ruled exam sheet. The test view has a sticky
   bar (leave, position, timer, finish) above a single question card and a number grid. */
:root{
  --paper:#eef1f5; --surface:#ffffff; --ink:#111c2e; --muted:#566579; --line:#d3dae4;
  --brand:#1b3a73; --brand-ink:#ffffff; --accent:#c4122f; --ok:#177245;
  --tint:color-mix(in srgb,var(--brand) 9%,var(--surface));
  --ok-tint:color-mix(in srgb,var(--ok) 13%,var(--surface));
  --bad-tint:color-mix(in srgb,var(--accent) 10%,var(--surface));
  --font-display:"Bricolage Grotesque","PingFang HK","Noto Sans HK","Microsoft JhengHei",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible","PingFang HK","Noto Sans HK","Microsoft JhengHei",system-ui,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0c131f; --surface:#151f30; --ink:#e9eef7; --muted:#9aa9be; --line:#2a3850;
    --brand:#9dbcff; --brand-ink:#0c131f; --accent:#ff7085; --ok:#5fd39a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0c131f; --surface:#151f30; --ink:#e9eef7; --muted:#9aa9be; --line:#2a3850;
  --brand:#9dbcff; --brand-ink:#0c131f; --accent:#ff7085; --ok:#5fd39a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.55 var(--font-body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--font-display);line-height:1.2;margin:0}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 56px}
.muted{color:var(--muted)}
.small{font-size:.88rem}

.mast{margin:6px 0 12px}
.mast h1{font-size:clamp(1.7rem,6vw,2.4rem);font-weight:800;letter-spacing:-.02em}
.mast h1 span{color:var(--accent)}
.sub{color:var(--muted);margin-top:4px;font-size:.92rem}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.nav a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink);text-decoration:none;font-weight:700;font-size:.92rem}
.nav a[aria-current="page"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.nav b{font-variant-numeric:tabular-nums;font-size:.8rem;padding:0 7px;border-radius:999px;background:var(--accent);color:var(--surface)}
.nav a[aria-current="page"] b{background:var(--brand-ink);color:var(--brand)}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 14px}
@media (min-width:620px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile b{display:block;font:800 1.65rem/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.tile b small{font-size:.55em;color:var(--muted);font-weight:600}
.tile span{color:var(--muted);font-size:.84rem;line-height:1.3;display:block;margin-top:3px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 14px}
.card > h2 + p,.card > h3 + p{margin-top:6px}
.paper{position:relative;padding-left:32px}
.paper::before{content:"";position:absolute;left:15px;top:14px;bottom:14px;width:2px;background:var(--accent);opacity:.6;border-radius:2px}
.banner{border-color:var(--brand);background:var(--tint)}
.cardfoot{display:flex;gap:12px 16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-top:14px}
.lbl{display:block;font-size:.8rem;color:var(--muted);font-weight:700;margin-bottom:5px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:9px 20px;border-radius:999px;
  border:1.5px solid var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.1)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brand);filter:none}
.btn.danger{background:var(--accent);border-color:var(--accent);color:var(--brand-ink)}
.btn.sm{min-height:38px;padding:5px 14px;font-size:.9rem}
.btn.on{border-color:var(--accent);color:var(--accent)}

.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--paper);flex-wrap:wrap}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span{display:block;padding:6px 13px;border-radius:999px;font-size:.88rem;font-weight:700;color:var(--muted)}
.seg input:checked + span{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1.5px var(--brand) inset}
.seg input:focus-visible + span{outline:3px solid var(--brand);outline-offset:2px}

.chlist{display:grid;gap:14px;margin-top:14px}
.chrow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.chrow b{display:block;line-height:1.3}
.chrow small{display:block;color:var(--muted);font-size:.84rem}
.meter{grid-column:1/-1;display:flex;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand);opacity:.45}
.meter i.m{background:var(--ok);opacity:1}
.meter i.x{background:var(--accent);opacity:1}

.spark{display:block;width:100%;height:auto;margin-top:10px}
.spark .passline{stroke:var(--ok);stroke-width:1;stroke-dasharray:4 4}
.spark .tl{fill:none;stroke:var(--brand);stroke-width:2;stroke-linejoin:round}
.spark .p{fill:var(--ok)} .spark .f{fill:var(--accent)}

.foot{color:var(--muted);font-size:.82rem;margin-top:22px;display:grid;gap:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}
.dot.ok{background:var(--ok)}

/* test */
.tbar{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 0 8px;display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:8px}
.where{text-align:center;font-weight:700;line-height:1.25}
.where small{display:block;color:var(--muted);font-weight:400;font-size:.78rem}
.timer{font:800 1.15rem/1 var(--font-display);font-variant-numeric:tabular-nums;padding:8px 10px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line)}
.timer.low{color:var(--accent);border-color:var(--accent)}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 14px}
.bar i{display:block;height:100%;background:var(--brand);transition:width .2s}
.kicker{color:var(--muted);font-size:.8rem;letter-spacing:.04em;margin:0 0 6px}
.qtext{font:700 1.3rem/1.35 var(--font-display)}
.qtext.sm{font-size:1.05rem}
.hint{color:var(--muted);font-size:.9rem;margin-top:8px}
.hint.flash{color:var(--accent);font-weight:700}
.opts{display:grid;gap:10px;border:0;padding:0;margin:16px 0 0;min-width:0}
.opt{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.opt input{flex:none;width:22px;height:22px;margin:2px 0 0;accent-color:var(--brand)}
.opt .otext{flex:1;min-width:0}
.opt.sel{border-color:var(--brand);background:var(--tint)}
.opt.right{border-color:var(--ok);background:var(--ok-tint)}
.opt.wrong{border-color:var(--accent);background:var(--bad-tint)}
.opt.locked{cursor:default}
.mark{flex:none;font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:999px;align-self:center;white-space:nowrap}
.mark.ok{background:var(--ok);color:var(--surface)}
.mark.bad{background:var(--accent);color:var(--surface)}
.fbk{margin-top:14px;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.fbk.ok{border-color:var(--ok)} .fbk.bad{border-color:var(--accent)}
.verdict{font:800 1.1rem/1.2 var(--font-display);margin-bottom:6px}
.fbk.ok .verdict{color:var(--ok)} .fbk.bad .verdict{color:var(--accent)}
.exp .zh{border-top:1px dashed var(--line);padding-top:7px;margin-top:7px}
.acts{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.acts .sp{flex:1}
.gridbox{margin-top:22px}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:8px}
@media (min-width:620px){.grid{grid-template-columns:repeat(12,1fr)}}
.cell{aspect-ratio:1;min-height:36px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);font-weight:700;cursor:pointer;position:relative;font-variant-numeric:tabular-nums;padding:0}
.cell.ans{background:var(--tint);border-color:var(--brand)}
.cell.r{background:var(--ok-tint);border-color:var(--ok)}
.cell.w{background:var(--bad-tint);border-color:var(--accent)}
.cell.cur{box-shadow:0 0 0 3px var(--brand)}
.cell.flag::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.8rem;margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:1.5px solid var(--line);vertical-align:-1px;margin-right:5px}
.legend i.a{background:var(--tint);border-color:var(--brand)}
.legend i.f{background:var(--accent);border-color:var(--accent);border-radius:50%}

/* results */
.score{display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap}
.big{font:800 clamp(3rem,15vw,4.6rem)/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.big small{font-size:.42em;color:var(--muted);font-weight:600;letter-spacing:0}
.stamp{display:inline-block;padding:7px 16px;border:3px double currentColor;border-radius:8px;font:800 1.25rem/1.15 var(--font-display);letter-spacing:.08em;transform:rotate(-6deg);text-align:center}
.stamp.pass{color:var(--ok)} .stamp.fail{color:var(--accent)}
.meta{color:var(--muted);font-size:.9rem;margin-top:12px;display:flex;gap:4px 16px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{min-height:38px;padding:5px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.revlist{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:12px}
.rev{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}
.rev.ok{border-left-color:var(--ok)} .rev.bad{border-left-color:var(--accent)}
.revhead{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.tag{font-weight:700}
.rev.ok .tag{color:var(--ok)} .rev.bad .tag{color:var(--accent)}
.ropts{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px}
.ropts li{padding:8px 12px;border-radius:9px;border:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:center}
.ropts li.right{border-color:var(--ok);background:var(--ok-tint)}
.ropts li.wrong{border-color:var(--accent);background:var(--bad-tint)}
.hrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow b{font-variant-numeric:tabular-nums}
.pill{font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.pill.pass{color:var(--ok)} .pill.fail{color:var(--accent)}
.setrow{padding:14px 0;border-bottom:1px solid var(--line)}
.setrow:first-of-type{padding-top:4px}
.setrow:last-child{border-bottom:0;padding-bottom:0}
.setrow p{margin-top:6px}

.iobox{width:100%;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);resize:vertical}
.anhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.anstats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
@media (min-width:620px){.anstats{grid-template-columns:repeat(4,1fr)}}
.anstats div{background:var(--paper);border-radius:10px;padding:8px 10px}
.anstats b{display:block;font:800 1.25rem/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.anstats span{font-size:.78rem;color:var(--muted)}
.annote{margin-top:10px;font-size:.9rem}
.anchart{display:block;width:100%;height:auto;margin-top:6px}
.anchart .gl{stroke:var(--line);stroke-width:1}
.anchart .pl{stroke:var(--ok);stroke-width:1.5;stroke-dasharray:4 4}
.anchart .ln{fill:none;stroke:var(--brand);stroke-width:2;stroke-linejoin:round}
.anchart .pt{fill:var(--brand);stroke:var(--surface);stroke-width:2}
.anchart .hit{fill:transparent}
.anchart text{fill:var(--muted);font:11px var(--font-body)}
.prio{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.prio li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.prio .rk{font:800 1.1rem/1 var(--font-display);color:var(--muted)}
.miss{margin:8px 0 0;padding-left:18px;font-size:.92rem}
.miss li{margin-top:4px}
.tmbar .tb{fill:var(--brand)}
.tmbar .hit{fill:transparent}
.tmbar text{fill:var(--muted);font:11px var(--font-body)}
.tmbar .gl{stroke:var(--line);stroke-width:1}
.tmch{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin-top:8px;font-size:.92rem}
.modal-bg{position:fixed;inset:0;background:rgba(8,14,24,.58);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border-radius:var(--r);padding:22px;max-width:430px;width:100%;border:1px solid var(--line)}
.modal h2{margin-bottom:8px}
.modal p{margin-bottom:18px;color:var(--muted)}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="modal-root"></div>
<script>
(() => {
'use strict';
const BANK = /*__BANK__*/[];
const PAPER = 24, PASS_RATE = 0.75, LIMIT = 45 * 60;
const QUOTA = {1:1, 2:1, 3:9, 4:7, 5:6};
const K = {prog:'lituk.v1.progress', set:'lituk.v1.settings', ses:'lituk.v1.session'};
const HASHV = ['home', 'analysis', 'weak', 'history', 'settings'];
const Q = BANK.map(b => ({id:b[0], type:b[1], ch:b[2], q:b[3], o:b[4], en:b[5], zh:b[6]}));
const BYID = new Map(Q.map(q => [q.id, q]));
const CHN = Q.reduce((m, q) => (m[q.ch] = (m[q.ch] || 0) + 1, m), {});
const CH = [null,
  {en:'The values and principles of the UK', zh:'英國的價值與原則'},
  {en:'What is the UK?', zh:'英國是甚麼'},
  {en:'A long and illustrious history', zh:'悠久而輝煌的歷史'},
  {en:'A modern, thriving society', zh:'現代而繁榮的社會'},
  {en:'The UK government, the law and your role', zh:'英國政府、法律與你的角色'}];

const STR = {
zh:{
 'app.mock':'模擬試', 'tagline':'題庫 {n} 題 · 每份試卷 24 題 · 限時 45 分鐘 · 答對 18 題合格',
 'nav.label':'頁面', 'nav.home':'主頁', 'nav.weak':'弱項題目', 'nav.history':'成績紀錄', 'nav.settings':'設定', 'nav.analysis':'分析',
 'an.title':'各章分析', 'an.desc':'根據你所有已交卷試卷的作答計算，包括模擬試卷、弱項練習卷和分章練習。', 'an.empty':'未有足夠紀錄。先做幾份試卷，這裏就會顯示分析。',
 'an.pred':'預計模擬試卷分數', 'an.predNote':'按每份模擬試卷各章題數（第 1、2 章各 1 題，第 3 章 9 題，第 4 章 7 題，第 5 章 6 題）乘以各章最近正確率計算，只供參考。',
 'an.prio':'溫習優先次序', 'an.prioNote':'按每份模擬試卷預計失分由多到少排列。', 'an.lose':'每份卷預計失 {n} 分', 'an.unseen':'仍有 {n} 題未做過',
 'an.overall':'整體正確率', 'an.recent':'最近 {n} 題', 'an.coverage':'已做', 'an.weak':'弱項', 'an.answers':'共作答 {n} 次',
 'an.up':'最近比整體高 {n} 個百分點，正在進步', 'an.down':'最近比整體低 {n} 個百分點，要留意', 'an.flat':'最近同整體差不多', 'an.few':'數據不足，再做多啲題目先準確',
 'an.trend':'每日正確率', 'an.trendNote':'虛線為 75% 合格水平。只計算當日作答 3 次或以上的日子。把滑鼠移到點上可看當日數字。', 'an.oneDay':'只有一日的數據，未能顯示走勢。',
 'an.miss':'錯得最多的題目', 'an.missNone':'這章未有答錯過的題目。', 'an.missStat':'錯 {w} / {s} 次', 'an.chart':'第 {n} 章每日正確率：{s}',
 'an.first':'第一次作答正確率', 'an.repeat':'重做正確率', 'an.est':'預計真試正確率 {p}%（目標 {g}%）', 'an.met':'已達目標，保持重溫弱項就可以。',
 'an.need':'預計仲要第一次做約 {q} 題新題目，連重溫大約 {a} 至 {b} 分鐘（約 {pa} 至 {pb} 份分章練習）。', 'an.notes':'即使做晒這章所有題目都未必夠，建議配合溫習筆記。',
 'an.lockAcc':'這章再作答 {n} 次就會顯示正確率。', 'an.lockPred':'再做 {n} 份模擬試卷就會顯示預計分數。', 'an.lockTime':'{parts}就會顯示所需時間。',
 'an.lockPapers':'再交 {n} 份試卷', 'an.lockFirst':'在這章再第一次作答 {n} 題', 'an.and':'，同埋',
 'an.total':'合共預計仲要做題 {a} 至 {b} 分鐘（未計溫筆記時間）。', 'an.allMet':'所有已有估算的章節都已達目標。',
 'an.predNote2':'按每份模擬試卷各章題數（第 1、2 章各 1 題，第 3 章 9 題，第 4 章 7 題，第 5 章 6 題）乘以各章預計真試正確率計算。預計真試正確率＝做過的題目按重做正確率計，未做過的按第一次作答正確率計。只供參考。',

const S = {view:'home', set:{lang:'zh', zh:true, theme:'auto', fb:{m:'e', w:'i', c:'i'}}, ses:null, res:null, resFilter:'wrong', weakCh:0, sync:'connecting'};
let P = blank(0);
const M = {open:false, onOk:null, back:null};
const app = document.getElementById('app');
const mroot = document.getElementById('modal-root');

function blank(r){ return {v:1, r:r || 0, s:{}, h:[]}; }
function t(k, v){
  let s = (STR[S.set.lang] || STR.zh)[k];
  if (s == null) s = STR.en[k] != null ? STR.en[k] : k;
  if (v) for (const x in v) s = s.split('{' + x + '}').join(v[x]);
  return s;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
const zhOn = () => S.set.zh !== false;
const uiLang = () => S.set.lang === 'en' ? 'en-GB' : 'zh-HK';
const chName = ch => S.set.lang === 'en' ? CH[ch].en : CH[ch].zh;
const fmt = sec => { sec = Math.max(0, sec | 0); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };
const fmtDate = ms => { try { return new Date(ms).toLocaleString(uiLang(), {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}); } catch (e) { return new Date(ms).toISOString().slice(0, 16).replace('T', ' '); } };

/* ---------- storage ---------- */
const store = {
  get(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k){ try { localStorage.removeItem(k); } catch (e) {} }
};
function valid(p){ return !!p && p.v === 1 && !!p.s && typeof p.s === 'object' && Array.isArray(p.h); }
function loadLocal(){
  const s = store.get(K.set);
  if (s && typeof s === 'object') {
    if (s.lang === 'en' || s.lang === 'zh') S.set.lang = s.lang;
    if (typeof s.zh === 'boolean') S.set.zh = s.zh;
    if (['auto', 'light', 'dark'].includes(s.theme)) S.set.theme = s.theme;
    if (s.fb) for (const k of ['m', 'w', 'c']) if (s.fb[k] === 'e' || s.fb[k] === 'i') S.set.fb[k] = s.fb[k];
  }
  const p = store.get(K.prog); if (valid(p)) P = p;
  const z = store.get(K.ses);
  if (z && Array.isArray(z.q) && z.q.length && z.q.every(id => BYID.has(id)) && Array.isArray(z.ans) && z.ans.length === z.q.length) S.ses = z;
}
const saveSet = () => store.set(K.set, S.set);
const saveSes = () => { if (S.ses) store.set(K.ses, S.ses); else store.del(K.ses); };
function saveProg(sync){ store.set(K.prog, P); cloud.dirty = true; if (sync) queueCloud(300); }
function trimHistory(){
  P.h.sort((a, b) => a.t - b.t);
  if (P.h.length > 300) P.h = P.h.slice(-300);
  const cut = P.h.length - 300;
  for (let i = 0; i < cut; i++) { delete P.h[i].q; delete P.h[i].a; }
}
function merge(a, b){
  if ((a.r || 0) !== (b.r || 0)) return JSON.parse(JSON.stringify((a.r || 0) > (b.r || 0) ? a : b));
  const s = {};
  for (const id of new Set(Object.keys(a.s).concat(Object.keys(b.s)))) {
    const x = a.s[id], y = b.s[id];
    const ok = v => Array.isArray(v) && v.length >= 4;
    if (!ok(x)) { if (ok(y)) s[id] = y.slice(0, 4); continue; }
    if (!ok(y)) { s[id] = x.slice(0, 4); continue; }
    s[id] = (x[0] !== y[0] ? (x[0] > y[0] ? x : y) : (x[3] >= y[3] ? x : y)).slice(0, 4);
  }
  const by = new Map();
  for (const h of a.h.concat(b.h)) {
    if (!h || typeof h.t !== 'number') continue;
    const cur = by.get(h.t);
    if (!cur || (!cur.q && h.q)) by.set(h.t, h);
  }
  const out = {v:1, r:a.r || 0, s, h:Array.from(by.values())};
  const keep = P; P = out; trimHistory(); P = keep;
  return out;
}

function sig(p){ return JSON.stringify([p.r || 0, Object.keys(p.s).sort().map(k => [k].concat(p.s[k])), p.h.slice().sort((a, b) => a.t - b.t)]); }

const cloud = {ref:null, dirty:false, writing:false, timer:null, fails:0, pulled:0};
function setSync(v){ S.sync = v; const el = document.getElementById('sync'); if (el) el.innerHTML = syncHTML(); }
function syncHTML(){ return '<span class="dot' + (S.sync === 'ok' ? ' ok' : '') + '"></span>' + esc(t('sync.' + S.sync)); }
function timeout(p, ms){ return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(Object.assign(new Error('timeout'), {code:'unavailable'})), ms))]); }
function snapData(snap){
  if (!snap) return null;
  const ex = typeof snap.exists === 'function' ? snap.exists() : snap.exists;
  if (ex === false) return null;
  const d = typeof snap.data === 'function' ? snap.data() : snap.data;
  return valid(d) ? d : null;
}
async function initCloud(){
  try {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') { setSync('local'); return; }
    const pair = await Promise.all([c.use('db'), c.use('user')]);

const today = () => Math.floor(Date.now() / 864e5);

const isMastered = q => { const s = P.s[q.id]; return !!s && s[2] >= 2; };

  s[3] = today(); P.s[q.id] = s;

function pickWeak(){
  const weak = Q.filter(isWeak);

    const s = P.s[q.id];

  });

    const s = P.s[q.id];

function pickChapter(ch){

}

  M.open = true; M.onOk = o.onOk; M.back = document.activeElement;
  mroot.innerHTML = '<div class="modal-bg" data-act="modal-cancel"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">' + esc(o.title) + '</h2><p>' + esc(o.body) + '</p>' +
    '<div class="row"><button class="btn ghost" id="modal-cancel" data-act="modal-cancel">' + esc(o.cancel) + '</button><button class="btn' + (o.danger ? ' danger' : '') + '" id="modal-ok" data-act="modal-ok">' + esc(o.ok) + '</button></div></div></div>';
  const b = document.getElementById('modal-ok'); if (b) b.focus();
}
function closeModal(){
  if (!M.open) return;
  M.open = false; M.onOk = null; mroot.innerHTML = '';
  if (M.back && document.contains(M.back) && M.back.focus) M.back.focus();
}

/* ---------- test interactions ---------- */
function choose(oi){
  const z = S.ses; if (!z || S.view !== 'test') return;
  const k = z.cur, q = BYID.get(z.q[k]); if (z.chk[k]) return;
  let a = z.ans[k];
  if (q.type === 'm') {
    if (a.includes(oi)) a = a.filter(x => x !== oi);
    else if (a.length < 2) a = a.concat(oi);
    else { const hEl = document.getElementById('hint'); if (hEl) { hEl.classList.add('flash'); setTimeout(() => hEl.classList.remove('flash'), 1200); } }
  } else a = [oi];
  z.ans[k] = a; saveSes(); syncOpts();
}
function syncOpts(){
  const z = S.ses, k = z.cur, q = BYID.get(z.q[k]), a = z.ans[k];
  document.querySelectorAll('#opts input').forEach(inp => {
    const on = a.includes(+inp.value); inp.checked = on;
    inp.closest('.opt').classList.toggle('sel', on);
  });
  const c = document.getElementById('btn-check'); if (c) c.disabled = !ready(q, a);
  const cell = document.getElementById('cell-' + k); if (cell) cell.className = cellCls(z, k);
  const bar = document.getElementById('bar'); if (bar) bar.style.width = (100 * answered(z) / z.q.length) + '%';
}
function goto(i){
  const z = S.ses; if (!z) return;
  z.cur = Math.max(0, Math.min(z.q.length - 1, i)); saveSes(); render(); window.scrollTo(0, 0);
  const qh = document.getElementById('qh'); if (qh) qh.focus({preventScroll:true});
}
function check(){
  const z = S.ses, i = z.cur, q = BYID.get(z.q[i]);
  if (z.chk[i] || !ready(q, z.ans[i])) return;
  if (!z.guess) z.guess = z.q.map(() => 0);
  const okNow = isRight(q, z.ans[i]);
  z.chk[i] = 1; record(q, okNow && !z.guess[i]); if (okNow && z.guess[i]) z.guess[i] = 2; saveSes(); saveProg(false); render();
  const f = document.getElementById('fbk'); if (f) { f.focus({preventScroll:true}); if (f.scrollIntoView) f.scrollIntoView({block:'nearest'}); }
}
function askFinish(){
  const z = S.ses, un = z.q.length - z.ans.filter(a => a.length).length;
  modal({title:t('m.finish.title'), body:un ? t('m.finish.un', {n:un}) : t('m.finish.all'), ok:t('m.finish.ok'), cancel:t('m.back'), onOk:() => finish(false)});
}
function askQuit(){
  const z = S.ses;
  modal({title:t('m.quit.title'), body:t(z.fb === 'i' ? 'm.quit.i' : 'm.quit.e'), ok:t('m.quit.ok'), cancel:t('m.back'), danger:true, onOk:quit});
}
function begin(kind, ch){
  if (S.ses) modal({title:t('m.new.title'), body:t('m.new.body'), ok:t('m.new.ok'), cancel:t('m.cancel'), onOk:() => startSession(kind, ch)});
  else startSession(kind, ch);
}
function inArtifact(){ return /claudeusercontent\.com$/.test(location.hostname) || !!(window.claude && window.claude.use); }
function parseImport(txt){
  let o = JSON.parse(String(txt).trim().replace(/^\uFEFF/, ''));
  if (o && typeof o.p === 'string') o = JSON.parse(o.p);
  else if (o && o.app === 'lituk') o = o.progress;
  if (!valid(o)) throw new Error('bad');
  const s = {};
  for (const k in o.s) { const v = o.s[k]; if (Array.isArray(v) && v.length >= 4 && v.slice(0, 4).every(x => typeof x === 'number')) s[k] = v.slice(0, 4); }
  const h = o.h.filter(x => x && typeof x.t === 'number' && typeof x.sc === 'number' && typeof x.n === 'number' && ['m', 'w', 'c'].includes(x.k));
  return {v:1, r:o.r || 0, s, h};
}
const ACT = {
  start(el){ begin(el.dataset.kind, +el.dataset.ch || 0); },
  resume(){ show('test'); tick(); },
  drop(){ askQuit(); },
  prev(){ goto(S.ses.cur - 1); },
  next(){ goto(S.ses.cur + 1); },
  goto(el){ goto(+el.dataset.i); },
  guess(){
    const z = S.ses, i = z.cur, q = BYID.get(z.q[i]);
    if (!z.guess) z.guess = z.q.map(() => 0);
    if (z.chk[i]) {
      if (!isRight(q, z.ans[i]) || z.guess[i] === 2) return;
      const st = P.s[q.id]; if (st) { st[1]++; st[2] = 0; st[3] = today(); }
      z.guess[i] = 2; saveSes(); saveProg(false);
    } else { z.guess[i] = z.guess[i] ? 0 : 1; saveSes(); }
    render(); const b = document.getElementById('btn-guess'); if (b) b.focus();
  },
  flag(){ const z = S.ses; z.flag[z.cur] = z.flag[z.cur] ? 0 : 1; saveSes(); render(); const b = document.getElementById('btn-flag'); if (b) b.focus(); },
  check(){ check(); },
  finish(){ askFinish(); },
  quit(){ askQuit(); },
  home(){ show('home'); },
  again(){ const r = S.res; begin(r.k, r.c || 0); },
  filter(el){ S.resFilter = el.dataset.f; render(); const b = document.getElementById('flt-' + S.resFilter); if (b) b.focus(); },
  weakch(el){ S.weakCh = +el.dataset.ch; render(); },
  open(el){ const r = P.h.find(x => String(x.t) === el.dataset.t); if (r) { S.res = r; S.resFilter = 'wrong'; show('result'); } },
  exp(){
    const box = document.getElementById('exp-box'), ta = document.getElementById('exp-text');
    ta.value = JSON.stringify({app:'lituk', v:1, exported:Date.now(), progress:P, settings:S.set});
    box.hidden = false; ta.focus(); ta.select();
  },
  copyexp(){
    const ta = document.getElementById('exp-text'), msg = document.getElementById('io-msg');
    const ok = () => { msg.textContent = t('io.copied'); };
    const manual = () => { ta.focus(); ta.select(); let done = false; try { done = document.execCommand('copy'); } catch (e) {} msg.textContent = t(done ? 'io.copied' : 'io.copyFail'); };
    try { navigator.clipboard.writeText(ta.value).then(ok, manual); } catch (e) { manual(); }
  },
  dlexp(){
    const ta = document.getElementById('exp-text');
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ta.value], {type:'application/json'})); a.download = 'lituk-backup-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(a); a.click(); a.remove(); } catch (e) {}
  },
  imp(){
    const msg = document.getElementById('io-msg'); let inc;
    try { inc = parseImport(document.getElementById('imp-text').value); } catch (e) { msg.textContent = t('io.bad'); return; }
    const have = new Set(P.h.map(h => h.t));
    modal({title:t('m.imp.title'), body:t('m.imp.body', {h:inc.h.length, nh:inc.h.filter(h => !have.has(h.t)).length, s:Object.keys(inc.s).length}), ok:t('m.imp.ok'), cancel:t('m.cancel'), onOk:() => {
      inc.r = P.r || 0; P = merge(P, inc); saveProg(true); render();
      const m = document.getElementById('io-msg'); if (m) m.textContent = t('io.done');
    }});
  },
  reset(){
    modal({title:t('m.reset.title'), body:t('m.reset.body'), ok:t('m.reset.ok'), cancel:t('m.cancel'), danger:true, onOk:() => {
      P = blank(Date.now()); S.ses = null; S.res = null; saveSes(); saveProg(true); render();
    }});
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest ? e.target.closest('[data-act]') : null; if (!el) return;
  const a = el.dataset.act;
  if (a === 'modal-cancel') { if (el.classList.contains('modal-bg') && e.target !== el) return; closeModal(); return; }
  if (a === 'modal-ok') { const fn = M.onOk; closeModal(); if (fn) fn(); return; }
  if (el.disabled) return;
  if ((a === 'prev' || a === 'next' || a === 'goto' || a === 'flag' || a === 'check' || a === 'finish' || a === 'quit') && !S.ses) return;
  if (ACT[a]) ACT[a](el);
});
document.addEventListener('change', e => {
  const el = e.target; if (!el || !el.dataset) return;
  if (el.name === 'opt') { choose(+el.value); return; }
  if (el.dataset.fb) { S.set.fb[el.dataset.fb] = el.value === 'i' ? 'i' : 'e'; saveSet(); return; }
  if (el.id === 'imp-file' && el.files && el.files[0]) {
    const r = new FileReader();
    r.onload = () => { const ta = document.getElementById('imp-text'); if (ta) ta.value = String(r.result || ''); };
    r.readAsText(el.files[0]); return;
  }
  if (el.dataset.set) {
    const k = el.dataset.set;
    if (k === 'lang') S.set.lang = el.value === 'en' ? 'en' : 'zh';
    if (k === 'zh') S.set.zh = el.value === '1';
    if (k === 'theme') S.set.theme = el.value;
    saveSet(); applyTheme(); render();
    const b = document.getElementById(el.id); if (b) b.focus();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && M.open) { closeModal(); return; }
  if (S.view !== 'test' || M.open || !S.ses || e.metaKey || e.ctrlKey || e.altKey) return;
  const n = ['1', '2', '3', '4'].indexOf(e.key); if (n < 0) return;
  const z = S.ses, q = BYID.get(z.q[z.cur]), ord = order(z.id, q);
  if (n < ord.length) { choose(ord[n]); e.preventDefault(); }
});
window.addEventListener('hashchange', () => {
  const v = location.hash.slice(1);
  if (HASHV.includes(v)) { closeModal(); S.view = v; render(); window.scrollTo(0, 0); }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { if (cloud.dirty) { clearTimeout(cloud.timer); flushCloud(); } }
  else if (cloud.ref && Date.now() - cloud.pulled > 5 * 60 * 1000 && !cloud.writing) pull();
});
function tick(){
  if (S.view !== 'test' || !S.ses || !S.ses.limit) return;
  const r = remaining();
  if (r <= 0) { closeModal(); finish(true); return; }
  const el = document.getElementById('timer');
  if (el) { el.textContent = fmt(r); el.classList.toggle('low', r <= 300); }
}
setInterval(tick, 500);

/* ---------- boot ---------- */
let booted = false;
function boot(data){
  if (booted) return; booted = true;
  loadLocal(); applyTheme();
  const hv = location.hash.slice(1);
  S.view = HASHV.includes(hv) ? hv : 'home';
  if (data && data.view === 'test' && S.ses) S.view = 'test';
  render();
  initCloud();
}
try { const hot = window.claude && window.claude.hot; if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({view:S.view})); } catch (e) {}
try {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.ready === 'function') { hot.ready(boot); setTimeout(() => boot({}), 1500); }
  else boot(hot && hot.data ? hot.data : {});
} catch (e) { boot({}); }
})();
</script>
